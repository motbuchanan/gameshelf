<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Star Defender</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;}
  body{font-family:system-ui,sans-serif;color:#dfeaf2;overflow:hidden;display:flex;flex-direction:column;
    background:radial-gradient(120% 80% at 50% 14%,#101a2e 0%,#05080f 70%);touch-action:none;}
  #bar{display:flex;align-items:center;gap:10px;padding:12px 14px;}
  #bar a{color:#cfe0f0;text-decoration:none;font-size:14px;border:1px solid #34465f;border-radius:999px;padding:6px 12px;}
  #title{font-weight:800;font-size:19px;}
  #hud{margin-left:auto;display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px;}
  #lives{color:#5ce0a0;letter-spacing:2px;}
  #score{color:#7fb6ff;}#wave{color:#ffd25c;}
  #stageWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:6px;}
  #board{position:relative;border-radius:12px;overflow:hidden;
    box-shadow:0 14px 30px rgba(0,0,0,.6),inset 0 0 0 2px rgba(120,160,210,.18);background:#060a14;touch-action:none;}
  #cv{display:block;height:min(62vh,520px);width:auto;max-width:94vw;}
  #pad{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:340px;width:94vw;margin:0 auto;padding:0 14px;}
  #pad button{font-family:inherit;font-size:24px;font-weight:800;color:#06121e;border:none;border-radius:14px;cursor:pointer;padding:16px 0;
    background:linear-gradient(180deg,#88c0ff,#5a93d6);box-shadow:0 4px 0 #2f5e96,0 5px 9px rgba(0,0,0,.4);}
  #pad button:active{transform:translateY(2px);box-shadow:0 2px 0 #2f5e96;}
  #foot{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 14px 16px;}
  .act{font-family:inherit;font-size:15px;font-weight:bold;padding:10px 18px;border-radius:10px;border:none;
    color:#06121e;background:#7fb6ff;cursor:pointer;box-shadow:0 4px 0 #3f6ea5,0 5px 10px rgba(0,0,0,.4);}
  .act.ghost{background:#101a2a;color:#cfe0f0;box-shadow:0 4px 0 #08101c;border:1px solid #34465f;font-size:14px;}
  .act:active{transform:translateY(2px);}
  .ov{position:fixed;inset:0;background:rgba(4,7,12,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;text-align:center;padding:24px;}
  .ov.show{display:flex;}
  .ov h1{font-size:28px;}.ov p{font-size:16px;color:#cfe0f0;}
  .ov .big{font-size:44px;font-weight:900;color:#7fb6ff;}
  #who{font-family:inherit;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 9px 3px 4px;margin-left:8px;cursor:pointer;}
</style>
</head>
<body>
<div id="bar"><a href="index.html">&#8962; Shelf</a><div id="title">Star Defender</div><button id="who"></button>
  <div id="hud"><span id="lives">&#9650;&#9650;&#9650;</span><span id="wave">W1</span><span id="score">0</span></div></div>
<div id="stageWrap"><div id="board"><canvas id="cv"></canvas></div></div>
<div id="pad"><button data-a="left">&#9664;</button><button data-a="right">&#9654;</button></div>
<div id="foot"><button class="act ghost" id="newBtn">New game</button></div>
<div class="ov" id="overlay">
  <div style="font-size:48px;">&#128126;</div>
  <h1 id="ovTitle">Game over</h1>
  <div class="big" id="ovScore">0</div>
  <p id="ovText"></p>
  <button class="act" id="ovBtn">Play again</button>
  <a href="index.html" style="font-size:14px;padding:9px 16px;border-radius:10px;border:1px solid #34465f;background:#101a2a;color:#cfe0f0;text-decoration:none;">Back to shelf</a>
</div>
<script src="gamenight.js?v=12"></script>
<script src="sfx.js?v=5"></script>
<script>
const KEY="stardefender_games";
function S(n,o){window.GNS&&GNS.play(n,0,o);}
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const overlay=document.getElementById("overlay");
const COLS=7;
const G={
  W:300,H:444,aSize:22,sx:34,sy:30,stepX:8,dropStep:16,shipW:32,shipH:16,shipY:418,
  shipX:150, cols:COLS, rows:3, fx:48, fy:48, dir:1,
  aliens:[], bullets:[], bombs:[],
  score:0, lives:3, wave:1, over:false, running:false, raf:0, invuln:0,
  lastMarch:0, lastFire:0, lastBomb:0, tStart:0, best:0
};
window.__SD=G;
cv.width=G.W;cv.height=G.H;
const ACOLORS=["#ff8a5c","#ffd25c","#8ce06a","#7fb6ff","#c98cff"];

function readBest(){let b=0;const r=GN.readGames(KEY)||[];for(const x of r)if((x.score||0)>b)b=x.score;return b;}
function aliveCount(){let n=0;for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++)if(G.aliens[r][c])n++;return n;}
function totalAliens(){return G.rows*G.cols;}
function marchEvery(){return Math.max(110,520-G.wave*40-(totalAliens()-aliveCount())*6);}
function bombEvery(){return Math.max(650,1700-G.wave*120);}
const FIRE_EVERY=340;

function spawnWave(){
  G.rows=3+Math.min(G.wave-1,2);
  G.aliens=[];for(let r=0;r<G.rows;r++){const row=[];for(let c=0;c<G.cols;c++)row.push(true);G.aliens.push(row);}
  G.fx=(G.W-(G.cols-1)*G.sx)/2;G.fy=46;G.dir=1;G.bullets=[];G.bombs=[];
  G.lastMarch=G.lastBomb=Date.now();
}
function newGame(){
  cancelAnimationFrame(G.raf);G.raf=0;
  G.score=0;G.lives=3;G.wave=1;G.over=false;G.running=true;G.invuln=0;G.shipX=G.W/2;G.tStart=Date.now();
  spawnWave();updateHud();overlay.classList.remove("show");G.lastFire=Date.now();
  G.raf=requestAnimationFrame(loop);
}
function updateHud(){
  document.getElementById("lives").innerHTML="\u25b2".repeat(Math.max(0,G.lives));
  document.getElementById("wave").textContent="W"+G.wave;
  document.getElementById("score").textContent=G.score;
}
function ax(c){return G.fx+c*G.sx;}
function ay(r){return G.fy+r*G.sy;}

function autoFire(now){if(now-G.lastFire<FIRE_EVERY)return;G.lastFire=now;G.bullets.push({x:G.shipX,y:G.shipY-12});}
function stepBullets(){
  const half=G.aSize/2;
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i];b.y-=7;
    if(b.y<-8){G.bullets.splice(i,1);continue;}
    let hit=false;
    for(let r=0;r<G.rows&&!hit;r++)for(let c=0;c<G.cols&&!hit;c++){
      if(!G.aliens[r][c])continue;
      if(Math.abs(b.x-ax(c))<half&&Math.abs(b.y-ay(r))<half){
        G.aliens[r][c]=false;G.score+=10+G.wave;hit=true;S("pop");
      }
    }
    if(hit)G.bullets.splice(i,1);
  }
}
function maybeBomb(now){
  if(aliveCount()===0)return;if(now-G.lastBomb<bombEvery())return;G.lastBomb=now;
  // pick a random alive alien
  const live=[];for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++)if(G.aliens[r][c])live.push([r,c]);
  const p=live[(Math.random()*live.length)|0];
  G.bombs.push({x:ax(p[1]),y:ay(p[0])+G.aSize/2});
}
function stepBombs(now){
  for(let i=G.bombs.length-1;i>=0;i--){
    const b=G.bombs[i];b.y+=4;
    if(b.y>G.H+8){G.bombs.splice(i,1);continue;}
    if(Math.abs(b.x-G.shipX)<G.shipW/2+3&&Math.abs(b.y-G.shipY)<G.shipH/2+3){
      G.bombs.splice(i,1);hitShip(now);
    }
  }
}
function hitShip(now){
  if(now<G.invuln)return;
  G.lives--;updateHud();S("bump");
  if(G.lives<=0)return gameOver();
  G.invuln=now+1300;
}
function checkInvade(){
  for(let r=G.rows-1;r>=0;r--)for(let c=0;c<G.cols;c++){
    if(G.aliens[r][c]&&ay(r)+G.aSize/2>=G.shipY-G.shipH/2-2)return gameOver();
  }
}
function stepMarch(now){
  if(now-G.lastMarch<marchEvery())return;G.lastMarch=now;
  let minC=99,maxC=-1;
  for(let r=0;r<G.rows;r++)for(let c=0;c<G.cols;c++)if(G.aliens[r][c]){if(c<minC)minC=c;if(c>maxC)maxC=c;}
  if(maxC<0)return;
  const half=G.aSize/2,next=G.fx+G.dir*G.stepX;
  const leftX=next+minC*G.sx-half,rightX=next+maxC*G.sx+half;
  if(leftX<4||rightX>G.W-4){G.dir*=-1;G.fy+=G.dropStep;S("move");}
  else G.fx=next;
  checkInvade();
}
function checkWave(){if(!G.over&&aliveCount()===0){G.wave++;updateHud();spawnWave();S("fanfare");}}

// ---- baked "living space" assets (built once) ----
function _mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function _tint(hex,f){var n=parseInt(hex.slice(1),16),r=Math.min(255,(n>>16)*f),g=Math.min(255,((n>>8)&255)*f),b=Math.min(255,(n&255)*f);return"rgb("+(r|0)+","+(g|0)+","+(b|0)+")";}
function _starTile(count,maxR,alpha,seed){var c=document.createElement("canvas");c.width=G.W;c.height=G.H;var g=c.getContext("2d"),rnd=_mul(seed);
  for(var i=0;i<count;i++){var x=rnd()*G.W,y=rnd()*G.H,s2=rnd()*maxR+0.3;g.fillStyle="rgba("+(190+rnd()*50|0)+","+(200+rnd()*45|0)+",255,"+(alpha*(0.5+rnd()*0.5)).toFixed(2)+")";g.beginPath();g.arc(x,y,s2,0,7);g.fill();}return c;}
var _farTile=_starTile(120,1.1,0.5,11), _nearTile=_starTile(46,1.9,0.9,29), _farY=0,_nearY=0;
var _objs=[], _objRnd=_mul(5), _OBJ_GAP=180;
function _topY(){var m=Infinity;for(var i=0;i<_objs.length;i++)if(_objs[i].y<m)m=_objs[i].y;return m===Infinity?G.H:m;}
function _spawnObj(y){var types=["planet","ringed","nebula","blackhole"],t=types[_objRnd()*types.length|0];
  return {t:t,x:40+_objRnd()*(G.W-80),y:y,r:(t==="nebula"?60+_objRnd()*70:18+_objRnd()*24),sp:0.15+_objRnd()*0.2,hue:_objRnd(),rot:_objRnd()*6.28};}
(function(){var y=G.H*0.5;for(var i=0;i<3;i++){var o=_spawnObj(y);_objs.push(o);y-=_OBJ_GAP+_objRnd()*120;}})();
function _recycle(o){o.t=_spawnObj(0).t;o.x=40+_objRnd()*(G.W-80);o.y=_topY()-(_OBJ_GAP+_objRnd()*160)-o.r;o.r=(o.t==="nebula"?60+_objRnd()*70:18+_objRnd()*24);o.sp=0.15+_objRnd()*0.2;o.hue=_objRnd();o.rot=_objRnd()*6.28;}
function _drawObj(o){var x=o.x,y=o.y,r=o.r;
  if(o.t==="nebula"){var cols=["rgba(120,80,180,","rgba(60,130,180,","rgba(180,80,140,"],col=cols[(o.hue*cols.length)|0];
    var g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col+"0.20)");g.addColorStop(1,col+"0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    var g2=ctx.createRadialGradient(x+r*0.3,y-r*0.2,0,x+r*0.3,y-r*0.2,r*0.6);g2.addColorStop(0,col+"0.16)");g2.addColorStop(1,col+"0)");ctx.fillStyle=g2;ctx.beginPath();ctx.arc(x+r*0.3,y-r*0.2,r*0.6,0,7);ctx.fill();return;}
  if(o.t==="blackhole"){var ag=ctx.createRadialGradient(x,y,r*0.4,x,y,r*1.8);ag.addColorStop(0,"rgba(255,150,60,0)");ag.addColorStop(.5,"rgba(255,140,50,.35)");ag.addColorStop(.72,"rgba(180,90,220,.28)");ag.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=ag;ctx.beginPath();ctx.arc(x,y,r*1.8,0,7);ctx.fill();
    ctx.strokeStyle="rgba(255,200,120,.7)";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,y,r*1.1,r*0.42,o.rot,0,7);ctx.stroke();
    ctx.fillStyle="#000";ctx.beginPath();ctx.arc(x,y,r*0.6,0,7);ctx.fill();ctx.strokeStyle="rgba(120,90,180,.5)";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,r*0.6,0,7);ctx.stroke();return;}
  var hue=o.hue,c1=hue<.33?"#c98a5a":hue<.66?"#6a8fc0":"#8a6ac0",c2=hue<.33?"#5e3520":hue<.66?"#2c3f66":"#3a2a60";
  var pg=ctx.createRadialGradient(x-r*0.4,y-r*0.4,r*0.2,x,y,r);pg.addColorStop(0,c1);pg.addColorStop(1,c2);
  if(o.t==="ringed"){ctx.strokeStyle="rgba(230,210,170,.4)";ctx.lineWidth=r*0.16;ctx.beginPath();ctx.ellipse(x,y,r*1.7,r*0.5,o.rot,0,7);ctx.stroke();}
  ctx.fillStyle=pg;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.arc(x+r*0.3,y+r*0.2,r*0.9,0,7);ctx.fill();
  if(o.t==="ringed"){ctx.strokeStyle="rgba(230,210,170,.55)";ctx.lineWidth=r*0.16;ctx.beginPath();ctx.ellipse(x,y,r*1.7,r*0.5,o.rot,3.14,6.28);ctx.stroke();}}
function _bodyGrad(x,y,h,color){var g=ctx.createLinearGradient(x,y-h,x,y+h);g.addColorStop(0,_tint(color,1.3));g.addColorStop(1,_tint(color,0.72));return g;}
function _eye(x,y,r,now,seed){var glance=Math.sin(now*0.0018+seed);ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  if(Math.sin(now*0.0011+seed*2.3)>0.96){ctx.strokeStyle="#12162a";ctx.lineWidth=r*0.5;ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.stroke();return;}
  ctx.fillStyle="#12162a";ctx.beginPath();ctx.arc(x+glance*r*0.35,y+r*0.15,r*0.52,0,7);ctx.fill();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x+glance*r*0.35-r*0.18,y-r*0.05,r*0.18,0,7);ctx.fill();}
function _creature(kind,x,y,color,now,seed){var box=G.aSize+4,h=box*0.42,bob=Math.sin(now*0.003+seed)*1.0;y+=bob;ctx.save();ctx.shadowColor=color;ctx.shadowBlur=7;
  if(kind===0){ctx.fillStyle=_tint(color,0.7);
    ctx.beginPath();ctx.moveTo(x-h*0.55,y-h*0.5);ctx.lineTo(x-h*0.8,y-h*1.15);ctx.lineTo(x-h*0.2,y-h*0.65);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(x+h*0.55,y-h*0.5);ctx.lineTo(x+h*0.8,y-h*1.15);ctx.lineTo(x+h*0.2,y-h*0.65);ctx.closePath();ctx.fill();
    ctx.fillStyle=_bodyGrad(x,y,h,color);ctx.beginPath();ctx.arc(x,y,h,0,7);ctx.fill();ctx.restore();
    ctx.fillStyle="rgba(255,255,255,.25)";ctx.beginPath();ctx.ellipse(x-h*0.3,y-h*0.4,h*0.4,h*0.22,-0.5,0,7);ctx.fill();
    _eye(x,y-h*0.05,h*0.5,now,seed);
    ctx.strokeStyle=_tint(color,0.55);ctx.lineWidth=2;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x-h*0.55,y-h*0.5);ctx.lineTo(x+h*0.55,y-h*0.3);ctx.stroke();
    ctx.fillStyle=_tint(color,0.7);ctx.beginPath();ctx.arc(x-h*0.45,y+h*0.9,h*0.2,0,7);ctx.arc(x+h*0.45,y+h*0.9,h*0.2,0,7);ctx.fill();
  }else if(kind===1){ctx.strokeStyle=_tint(color,0.8);ctx.lineWidth=box*0.11;ctx.lineCap="round";
    for(var t=0;t<4;t++){var tx=x-h*0.7+t*(h*1.4/3),wig=Math.sin(now*0.006+t+seed)*3;ctx.beginPath();ctx.moveTo(tx,y+h*0.5);ctx.quadraticCurveTo(tx+wig,y+h*1.1,tx+wig*0.5,y+h*1.5);ctx.stroke();}
    ctx.fillStyle=_bodyGrad(x,y,h,color);ctx.beginPath();ctx.arc(x,y,h,3.14,0);ctx.lineTo(x+h,y+h*0.5);ctx.lineTo(x-h,y+h*0.5);ctx.closePath();ctx.fill();ctx.restore();
    ctx.fillStyle="rgba(255,255,255,.25)";ctx.beginPath();ctx.ellipse(x-h*0.3,y-h*0.35,h*0.4,h*0.2,-0.5,0,7);ctx.fill();
    _eye(x-h*0.4,y-h*0.05,h*0.3,now,seed);_eye(x+h*0.4,y-h*0.05,h*0.3,now,seed+1.7);
  }else{ctx.fillStyle=_bodyGrad(x,y,h,color);
    ctx.beginPath();ctx.moveTo(x-h,y-h*0.6);ctx.arcTo(x-h,y+h,x,y+h,h*0.6);ctx.arcTo(x+h,y+h,x+h,y-h*0.6,h*0.6);ctx.arcTo(x+h,y-h,x,y-h,h*0.5);ctx.arcTo(x-h,y-h,x-h,y-h*0.6,h*0.5);ctx.closePath();ctx.fill();ctx.restore();
    ctx.fillStyle="rgba(255,255,255,.22)";ctx.beginPath();ctx.ellipse(x-h*0.3,y-h*0.4,h*0.4,h*0.2,-0.5,0,7);ctx.fill();
    _eye(x-h*0.4,y-h*0.35,h*0.28,now,seed);_eye(x+h*0.4,y-h*0.35,h*0.28,now,seed+2.1);
    ctx.fillStyle="#2a0f14";ctx.beginPath();ctx.moveTo(x-h*0.6,y+h*0.15);ctx.quadraticCurveTo(x,y+h*0.7,x+h*0.6,y+h*0.15);ctx.closePath();ctx.fill();
    ctx.fillStyle="#fff";for(var f=-1;f<=1;f++){var fxp=x+f*h*0.35;ctx.beginPath();ctx.moveTo(fxp-h*0.12,y+h*0.16);ctx.lineTo(fxp+h*0.12,y+h*0.16);ctx.lineTo(fxp,y+h*0.42);ctx.closePath();ctx.fill();}}}
function _drawShipG(now){var sx=G.shipX,sy=G.shipY;
  var blink=now<G.invuln&&((now/120)|0)%2===0;if(blink)return;
  var flame=6+Math.sin(now*0.03)*3;var fg=ctx.createLinearGradient(sx,sy+8,sx,sy+8+flame);fg.addColorStop(0,"rgba(255,200,80,.9)");fg.addColorStop(1,"rgba(255,120,40,0)");
  ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(sx-5,sy+7);ctx.lineTo(sx+5,sy+7);ctx.lineTo(sx,sy+8+flame);ctx.closePath();ctx.fill();
  ctx.save();ctx.shadowColor="#7fb6ff";ctx.shadowBlur=12;var hg=ctx.createLinearGradient(sx,sy-12,sx,sy+8);hg.addColorStop(0,"#dff0ff");hg.addColorStop(1,"#4f8fd8");
  ctx.fillStyle=hg;ctx.beginPath();ctx.moveTo(sx,sy-12);ctx.quadraticCurveTo(sx+16,sy+2,sx+13,sy+7);ctx.lineTo(sx-13,sy+7);ctx.quadraticCurveTo(sx-16,sy+2,sx,sy-12);ctx.closePath();ctx.fill();ctx.restore();
  ctx.fillStyle="#173a5e";ctx.beginPath();ctx.ellipse(sx,sy-2,4,5,0,0,7);ctx.fill();
  ctx.fillStyle="rgba(180,230,255,.8)";ctx.beginPath();ctx.ellipse(sx-1,sy-3,1.6,2.2,0,0,7);ctx.fill();
  ctx.fillStyle="#ff7a6e";ctx.beginPath();ctx.arc(sx-11,sy+5,1.6,0,7);ctx.fill();ctx.fillStyle="#8ce06a";ctx.beginPath();ctx.arc(sx+11,sy+5,1.6,0,7);ctx.fill();}

function draw(now){
  now=now||0;
  var bg=ctx.createLinearGradient(0,0,0,G.H);bg.addColorStop(0,"#141a33");bg.addColorStop(.5,"#0c1024");bg.addColorStop(1,"#070812");
  ctx.fillStyle=bg;ctx.fillRect(0,0,G.W,G.H);
  for(var oi=0;oi<_objs.length;oi++){var o=_objs[oi];o.y+=o.sp;o.rot+=0.0009;if(o.y-o.r*2>G.H){_recycle(o);}else _drawObj(o);}
  _farY=(_farY+0.25)%G.H;_nearY=(_nearY+0.6)%G.H;
  ctx.drawImage(_farTile,0,_farY);ctx.drawImage(_farTile,0,_farY-G.H);
  ctx.drawImage(_nearTile,0,_nearY);ctx.drawImage(_nearTile,0,_nearY-G.H);
  for(var r=0;r<G.rows;r++)for(var c=0;c<G.cols;c++){if(!G.aliens[r][c])continue;_creature(r%3,ax(c),ay(r),ACOLORS[r%ACOLORS.length],now,r*7+c);}
  // enemy bombs (glowing red orbs)
  for(var bi=0;bi<G.bombs.length;bi++){var bb=G.bombs[bi];ctx.save();ctx.shadowColor="#ff5a5a";ctx.shadowBlur=7;
    var og=ctx.createRadialGradient(bb.x-1,bb.y-1,0.5,bb.x,bb.y,4.5);og.addColorStop(0,"#ffd0d0");og.addColorStop(.5,"#ff5555");og.addColorStop(1,"#b01010");
    ctx.fillStyle=og;ctx.beginPath();ctx.arc(bb.x,bb.y,4,0,7);ctx.fill();ctx.restore();}
  // player laser bolts (glow)
  for(var li=0;li<G.bullets.length;li++){var b=G.bullets[li];ctx.save();ctx.shadowColor="#8ffcff";ctx.shadowBlur=8;
    var lg=ctx.createLinearGradient(b.x,b.y-10,b.x,b.y+4);lg.addColorStop(0,"#eafcff");lg.addColorStop(1,"#39c6ff");
    ctx.fillStyle=lg;ctx.fillRect(b.x-1.8,b.y-10,3.6,14);ctx.restore();}
  _drawShipG(now);
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function loop(ts){G.raf=requestAnimationFrame(loop);
  if(G.over||!G.running){draw(ts||0);return;}
  const now=Date.now();
  autoFire(now);stepBullets();maybeBomb(now);stepBombs(now);stepMarch(now);checkWave();
  draw(ts||now);
}
function gameOver(){
  if(G.over)return;G.over=true;G.running=false;S("bump");
  const prev=G.best;
  GN.recordGame(KEY,{start:G.tStart||Date.now(),end:Date.now(),durationMs:Date.now()-(G.tStart||Date.now()),
    score:G.score,wave:G.wave,solo:true,winner:null,draw:true});
  G.best=readBest();
  document.getElementById("ovScore").textContent=G.score;
  const beat=G.score>0&&G.score>=G.best&&G.score>prev;
  document.getElementById("ovText").textContent=(beat?"New best! \u{1F389}  ":"")+"Reached wave "+G.wave;
  if(beat)S("fanfare");
  overlay.classList.add("show");
}

/* input: steer only (auto-fire) */
function steerTo(clientX){const rc=cv.getBoundingClientRect();G.shipX=(clientX-rc.left)*(G.W/rc.width);
  G.shipX=Math.max(G.shipW/2,Math.min(G.W-G.shipW/2,G.shipX));}
cv.addEventListener("touchstart",e=>{steerTo(e.touches[0].clientX);e.preventDefault();},{passive:false});
cv.addEventListener("touchmove",e=>{steerTo(e.touches[0].clientX);e.preventDefault();},{passive:false});
let held=null;
function holdStart(dir){held=dir;}function holdEnd(){held=null;}
document.querySelectorAll("#pad button").forEach(b=>{
  const dir=b.dataset.a==="left"?-1:1;
  b.addEventListener("touchstart",e=>{holdStart(dir);e.preventDefault();},{passive:false});
  b.addEventListener("mousedown",()=>holdStart(dir));
  b.addEventListener("touchend",holdEnd);b.addEventListener("mouseup",holdEnd);b.addEventListener("mouseleave",holdEnd);
});
setInterval(()=>{if(held&&!G.over){G.shipX+=held*7;G.shipX=Math.max(G.shipW/2,Math.min(G.W-G.shipW/2,G.shipX));}},16);
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){G.shipX=Math.max(G.shipW/2,G.shipX-18);e.preventDefault();}
  else if(e.key==="ArrowRight"){G.shipX=Math.min(G.W-G.shipW/2,G.shipX+18);e.preventDefault();}
},{passive:false});
document.getElementById("newBtn").addEventListener("click",newGame);
document.getElementById("ovBtn").addEventListener("click",newGame);
document.addEventListener("visibilitychange",()=>{if(document.hidden){G.running=false;}else if(!G.over){G.running=true;G.lastMarch=G.lastBomb=G.lastFire=Date.now();}});

GN.rulesButton(document.getElementById("foot"),{title:"Star Defender",sections:[
  {h:"Goal",t:"Defend the bottom of the screen. Your ship fires on its own \u2014 just steer to line up your shots and clear each wave of invaders."},
  {h:"Move",t:"Slide your finger across the board, hold the on-screen arrows, or use the left/right arrow keys."},
  {h:"Watch out",t:"Dodge the bombs the invaders drop, and don't let them reach your ship. You have three lives, and every wave gets tougher."}
]});
if(window.GNS)GNS.button(document.getElementById("foot"));
G.best=readBest();
const whoEl=document.getElementById("who");
function pickPlayer(){if(window.GN&&GN.soloStart){GN.soloStart(function(name){if(GN.whoBadge)GN.whoBadge(whoEl,name,pickPlayer);newGame();});}else newGame();}
pickPlayer();
</script>
