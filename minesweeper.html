<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minesweeper</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#10140d;color:#dfe6d6;
    background-image:radial-gradient(ellipse at 50% -10%,#1b2414,#10140d 70%);min-height:100vh;}
  #bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0c0f09;border-bottom:1px solid #2a341e;}
  #bar a{color:#dfe6d6;text-decoration:none;font-size:13px;border:1px solid #4f6e3a;background:#1d2615;border-radius:999px;padding:6px 12px;}
  #title{font-weight:800;font-size:17px;}
  #who{margin-left:auto;font-size:12.5px;color:#9fc285;border:1px solid #3a5226;background:#172011;border-radius:999px;padding:5px 11px;cursor:pointer;}
  #wrap{max-width:520px;margin:0 auto;padding:12px;}
  #hud{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 12px;font-weight:800;}
  .stat{background:#172011;border:1px solid #2f421e;border-radius:10px;padding:7px 12px;font-size:15px;color:#cfe3b6;min-width:74px;text-align:center;}
  .stat small{display:block;font-size:10px;color:#7fa45f;font-weight:700;letter-spacing:.5px;}
  #diff{display:flex;gap:6px;justify-content:center;margin-bottom:12px;}
  #diff button{font-family:inherit;font-weight:700;font-size:13px;padding:8px 12px;border-radius:9px;border:1px solid #4f6e3a;background:#1d2615;color:#dfe6d6;cursor:pointer;}
  #diff button.on{background:#7ec060;color:#10220a;border-color:#4f8a37;}
  #board{margin:0 auto;width:max-content;max-width:100%;background:radial-gradient(ellipse at 50% 0%,#33472a,#1f2b16 80%);border:3px solid #4f6e3a;border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.55),inset 0 2px 8px rgba(0,0,0,.4);padding:6px;display:grid;gap:3px;touch-action:manipulation;user-select:none;}
  .ms{background:linear-gradient(155deg,#d7e2c4,#b6c79a 55%,#9fb283);border-radius:5px;display:flex;align-items:center;justify-content:center;
    font-weight:800;cursor:pointer;color:#234;position:relative;
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -2px 3px rgba(60,80,40,.45),0 1px 2px rgba(0,0,0,.35);transition:transform .05s;}
  .ms:active{transform:translateY(1px);}
  .ms.rev{background:linear-gradient(155deg,#e7edda,#d5decb);cursor:default;box-shadow:inset 0 2px 4px rgba(70,90,50,.35),inset 0 0 0 1px rgba(140,160,110,.3);}
  .ms.flag{background:linear-gradient(155deg,#f0d79a,#dcae60);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.35);}
  .ms.mine{background:radial-gradient(circle at 50% 40%,#ff9c86,#e06a55);}
  .ms.boom{background:radial-gradient(circle at 50% 40%,#ff7a5c,#c0271f);box-shadow:inset 0 0 0 1px rgba(120,20,10,.6),0 0 10px rgba(224,60,40,.5);}
  .ms svg{width:78%;height:78%;display:block;}
  .n1{color:#1976d2;}.n2{color:#388e3c;}.n3{color:#d32f2f;}.n4{color:#512da8;}.n5{color:#8d3b1f;}.n6{color:#0097a7;}.n7{color:#222;}.n8{color:#607d8b;}
  @keyframes msPop{0%{transform:scale(.4) rotate(-8deg);opacity:0}60%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
  .ms.pop{animation:msPop .3s cubic-bezier(.3,1.4,.5,1);}
  .firefly{position:absolute;top:0;left:0;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle,#eaff9a,rgba(180,220,90,0));filter:blur(.4px);will-change:transform,opacity;}
  @keyframes msWobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  @keyframes msDrip{0%{transform:translateY(0);opacity:.9}80%{opacity:.9}100%{transform:translateY(3px);opacity:0}}
  @keyframes msFlick{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.85}}
  .livebomb{animation:msWobble 1.4s ease-in-out infinite;transform-origin:50% 70%;}
  .livebomb .fuse{animation:msFlick .5s ease-in-out infinite;transform-origin:center;}
  .livebomb .sweat{animation:msDrip 1.3s ease-in infinite;}
  #ctrl{max-width:340px;margin:12px auto 0;display:flex;gap:8px;}
  #ctrl button{flex:1;font-family:inherit;font-weight:700;font-size:14px;padding:12px 0;border-radius:10px;border:1px solid #4f6e3a;background:#1d2615;color:#dfe6d6;cursor:pointer;}
  #ctrl button.on{background:#e8c466;color:#221a02;border-color:#b8860b;}
  #msg{text-align:center;color:#bcc9aa;font-size:13.5px;min-height:18px;margin:12px 4px 4px;}
  .ov{position:fixed;inset:0;background:rgba(8,12,6,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:60;text-align:center;padding:22px;}
  .ov.show{display:flex;}
  .ov h1{font-size:26px;margin:0;}
  .ov p{color:#bcc9aa;max-width:330px;font-size:15px;}
  .act{font-family:inherit;font-size:15px;font-weight:bold;padding:11px 20px;border-radius:10px;border:none;background:#7ec060;color:#10220a;box-shadow:0 4px 0 #3f7a2a;cursor:pointer;}
  html.gn-easy #title{font-size:21px;}html.gn-easy .stat{font-size:17px;}
</style>
</head>
<body>
<div id="bar"><a href="index.html">&#8962; Shelf</a><div id="title">Minesweeper</div><div id="who">1 player</div></div>
<div id="wrap">
  <div id="diff">
    <button data-d="0" class="on">Easy</button>
    <button data-d="1">Medium</button>
    <button data-d="2">Hard</button>
  </div>
  <div id="hud">
    <div class="stat"><small>MINES</small><span id="mineCount">0</span></div>
    <div class="stat"><small>TIME</small><span id="time">0</span></div>
    <div class="stat"><small>BEST</small><span id="best">0</span></div>
  </div>
  <div id="board"></div>
  <div id="ctrl">
    <button id="mode">&#128681; Flag: <span id="modeState">off</span></button>
    <button id="newg">&#128512; New game</button>
  </div>
  <div id="msg">Tap to dig. Flip to Flag to mark mines. First tap is always safe.</div>
</div>
<div class="ov" id="overlay"><div id="ovEmoji" style="font-size:46px;">&#128512;</div><h1 id="ovTitle">Cleared!</h1><p id="ovText"></p>
  <button class="act" id="ovBtn">Play again</button>
  <a href="index.html" style="font-size:14px;padding:9px 16px;border-radius:10px;border:1px solid #4f6e3a;background:#1d2615;color:#dfe6d6;text-decoration:none;">Back to shelf</a></div>
<script src="gamenight.js?v=12"></script>
<script src="sfx.js?v=5"></script>
<script>
const KEY="minesweeper_games";
const LEVELS=[{n:9,m:10,name:"Easy"},{n:12,m:25,name:"Medium"},{n:16,m:45,name:"Hard"}];
function S(n){try{window.GNS&&GNS.play(n);}catch(e){}}
const boardEl=document.getElementById("board"),msgEl=document.getElementById("msg");
let di=0, N=9, M=10, mine=[], adj=[], rev=[], flag=[], started=false, dead=false, won=false, t0=0, timer=null, flagMode=false, best=0, who="";
let _prevRev=[],_prevFlag=[];
const _BOMB_INNER='<circle cx="11" cy="14" r="7.5" fill="#2b2b33"/><ellipse cx="8.5" cy="11.5" rx="2" ry="1.4" fill="rgba(255,255,255,.25)"/><circle cx="9" cy="14" r="1.4" fill="#fff"/><circle cx="13" cy="14" r="1.4" fill="#fff"/><circle cx="9" cy="14.3" r=".7" fill="#12162a"/><circle cx="13" cy="14.3" r=".7" fill="#12162a"/><path d="M9.5 17q1.5 1 3 0" stroke="#0d0d14" stroke-width=".8" fill="none" stroke-linecap="round"/><rect x="14" y="6.5" width="2.2" height="4" rx="1" transform="rotate(35 15 8)" fill="#3a3a44"/><path d="M17 5.5q1-1.5 0-3" stroke="#8a6a3a" stroke-width="1.3" fill="none" stroke-linecap="round"/>';
const _FLAME='<path d="M17 3q.8-1.2 2 0 1 1.4-.6 2.4-1.8.3-1.4-2.4z" fill="#ff8a3c"/><path d="M17.4 3.4q.5-.8 1.3 0 .6.9-.4 1.5-1 .3-.9-1.5z" fill="#ffd24a"/>';
const LIVEBOMB='<svg class="livebomb" viewBox="0 0 24 24">'+_BOMB_INNER+'<circle class="sweat" cx="5.4" cy="14.5" r="1" fill="#7fc4ff"/><g class="fuse">'+_FLAME+'</g></svg>';
const STATICBOMB='<svg viewBox="0 0 24 24">'+_BOMB_INNER+_FLAME+'</svg>';

function readBest(){let b=0;const recs=(window.GN&&GN.readGames?GN.readGames(KEY):[])||[];for(const r of recs)if((r.score||0)>b)b=r.score;return b;}
function fmtT(s){return s+"s";}
function tick(){if(!started||dead||won)return;document.getElementById("time").textContent=Math.floor((Date.now()-t0)/1000);}

function newGame(){
  const L=LEVELS[di];N=L.n;M=L.m;
  mine=new Array(N*N).fill(false);adj=new Array(N*N).fill(0);
  rev=new Array(N*N).fill(false);flag=new Array(N*N).fill(false);
  started=false;dead=false;won=false;if(timer)clearInterval(timer);timer=null;
  best=readBest();
  render();updateHud();
  document.getElementById("time").textContent="0";
  msgEl.textContent="Tap to dig. First tap is always safe.";
}
function place(safe){ // generate mines avoiding 'safe' cell + neighbors
  const banned=new Set([safe,...neighbors(safe)]);
  let placed=0;
  while(placed<M){const i=Math.floor(Math.random()*N*N);if(mine[i]||banned.has(i))continue;mine[i]=true;placed++;}
  for(let i=0;i<N*N;i++){if(mine[i]){adj[i]=-1;continue;}let c=0;for(const j of neighbors(i))if(mine[j])c++;adj[i]=c;}
}
function neighbors(i){const r=Math.floor(i/N),c=i%N,out=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const nr=r+dr,nc=c+dc;if(nr>=0&&nr<N&&nc>=0&&nc<N)out.push(nr*N+nc);}return out;}
function reveal(i){
  if(rev[i]||flag[i]||dead||won)return;
  if(!started){started=true;t0=Date.now();timer=setInterval(tick,250);place(i);}
  rev[i]=true;
  if(mine[i]){dead=true;S("err");endGame(false);render();return;}
  if(adj[i]===0){for(const j of neighbors(i))if(!rev[j]&&!flag[j])reveal(j);}
  S("tap");
  checkWin();
}
function toggleFlag(i){if(rev[i]||dead||won)return;flag[i]=!flag[i];S("tap");render();updateHud();}
function checkWin(){
  let r=0;for(let i=0;i<N*N;i++)if(rev[i])r++;
  if(r===N*N-M){won=true;S("win");endGame(true);}
  render();
}
function countRev(){let r=0;for(let i=0;i<N*N;i++)if(rev[i])r++;return r;}
function score(){ // higher = better: clearing harder boards scores more; reward speed on wins
  const cells=countRev();const lvlMul=[1,2,4][di];
  if(won){const secs=Math.max(1,Math.floor((Date.now()-t0)/1000));return Math.round((N*N)*lvlMul*10*(60/(60+secs)));}
  return cells*lvlMul;
}
function endGame(win){
  if(timer)clearInterval(timer);
  const sc=score();const prevBest=best;
  const rec={start:t0||Date.now(),end:Date.now(),durationMs:t0?Date.now()-t0:0,score:sc,level:LEVELS[di].name,solo:true,winner:null,draw:true};
  try{if(window.GN&&GN.recordGame)GN.recordGame(KEY,rec);}catch(e){}
  best=readBest();updateHud();
  const secs=t0?Math.floor((Date.now()-t0)/1000):0;
  document.getElementById("ovEmoji").textContent=win?"\uD83C\uDF89":"\uD83D\uDCA5";
  document.getElementById("ovTitle").textContent=win?"Cleared!":"Boom!";
  document.getElementById("ovText").textContent=win
    ? ("Solved "+LEVELS[di].name+" in "+secs+"s. Score "+sc+(sc>=best&&sc>prevBest?" \u2014 new best!":"."))
    : ("You hit a mine. Score "+sc+". Try again!");
  document.getElementById("overlay").classList.add("show");
}
function updateHud(){
  let f=0;for(let i=0;i<N*N;i++)if(flag[i])f++;
  document.getElementById("mineCount").textContent=Math.max(0,M-f);
  document.getElementById("best").textContent=best;
}
function render(){
  const sz=Math.max(20,Math.min(34,Math.floor(330/N)));
  boardEl.style.gridTemplateColumns="repeat("+N+","+sz+"px)";boardEl.innerHTML="";
  for(let i=0;i<N*N;i++){
    const el=document.createElement("div");el.className="ms";el.style.width=sz+"px";el.style.height=sz+"px";el.style.fontSize=Math.floor(sz*0.55)+"px";
    if(rev[i]){el.classList.add("rev");
      if(mine[i]){el.classList.add("boom");el.innerHTML=LIVEBOMB;}
      else if(adj[i]>0){el.textContent=adj[i];el.classList.add("n"+adj[i]);}
      if(!_prevRev[i])el.classList.add("pop");
    }else if(flag[i]){el.classList.add("flag");el.textContent="\uD83D\uDEA9";if(!_prevFlag[i])el.classList.add("pop");}
    if(dead&&mine[i]&&!rev[i]&&!flag[i]){el.classList.add("mine");el.innerHTML=STATICBOMB;}
    el.addEventListener("click",()=>{flagMode?toggleFlag(i):reveal(i);});
    boardEl.appendChild(el);
  }
  _prevRev=rev.slice();_prevFlag=flag.slice();
}

document.querySelectorAll("#diff button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#diff button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
  di=+b.dataset.d;document.getElementById("overlay").classList.remove("show");newGame();}));
document.getElementById("mode").addEventListener("click",()=>{flagMode=!flagMode;
  document.getElementById("modeState").textContent=flagMode?"on":"off";
  document.getElementById("mode").classList.toggle("on",flagMode);});
document.getElementById("newg").addEventListener("click",()=>{document.getElementById("overlay").classList.remove("show");newGame();});
document.getElementById("ovBtn").addEventListener("click",()=>{document.getElementById("overlay").classList.remove("show");newGame();});

function pickPlayer(){if(window.GN&&GN.soloStart){GN.soloStart(function(name){who=name;if(GN.whoBadge)GN.whoBadge(document.getElementById("who"),name,pickPlayer);else document.getElementById("who").textContent=name;newGame();},{title:"Minesweeper"});}else newGame();}
document.getElementById("who").addEventListener("click",pickPlayer);
// ambient fireflies over the felt board
(function(){var wrap=document.createElement("div");wrap.style.cssText="position:relative;width:max-content;max-width:100%;margin:0 auto;";
  boardEl.parentNode.insertBefore(wrap,boardEl);wrap.appendChild(boardEl);boardEl.style.margin="0";
  var layer=document.createElement("div");layer.style.cssText="position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:12px;";wrap.appendChild(layer);
  var flies=[];for(var i=0;i<6;i++){var f=document.createElement("div");f.className="firefly";layer.appendChild(f);flies.push({el:f,px:null,py:null,x:Math.random(),y:Math.random(),a:Math.random()*6.28,ph:Math.random()*6.28});}
  function tick(t){var W=layer.clientWidth||280,H=layer.clientHeight||280;for(var i=0;i<flies.length;i++){var fl=flies[i];if(fl.px==null){fl.px=fl.x*W;fl.py=fl.y*H;}fl.a+=0.01;fl.px+=Math.cos(fl.a)*0.5;fl.py+=Math.sin(fl.a*1.3)*0.45;
    if(fl.px<0)fl.px=W;if(fl.px>W)fl.px=0;if(fl.py<0)fl.py=H;if(fl.py>H)fl.py=0;
    fl.el.style.transform="translate("+fl.px+"px,"+fl.py+"px)";fl.el.style.opacity=(0.25+0.5*Math.abs(Math.sin(t*0.002+fl.ph))).toFixed(2);}
    requestAnimationFrame(tick);}requestAnimationFrame(tick);})();

window.__mine=function(){return{N:N,mine:mine.slice(),adj:adj.slice(),rev:rev.slice(),flag:flag.slice(),dead:dead,won:won,started:started};};
window.__reveal=reveal;window.__flag=toggleFlag;window.__newGame=newGame;
pickPlayer();

if(window.GN&&GN.rulesButton){GN.rulesButton(document.getElementById("ctrl"),{title:"Minesweeper",sections:[
  {h:"Goal",t:"Uncover every safe square on the grid without digging up a hidden mine. Clear them all and you win. Your first tap is always safe.",svg:'<svg viewBox="0 0 120 72"><g><rect x="20" y="10" width="16" height="16" rx="2" fill="#cfd8e3"/><rect x="38" y="10" width="16" height="16" rx="2" fill="#cfd8e3"/><rect x="56" y="10" width="16" height="16" rx="2" fill="#e8edf3"/><rect x="74" y="10" width="16" height="16" rx="2" fill="#cfd8e3"/><rect x="20" y="28" width="16" height="16" rx="2" fill="#e8edf3"/><rect x="38" y="28" width="16" height="16" rx="2" fill="#e8edf3"/><rect x="56" y="28" width="16" height="16" rx="2" fill="#e8edf3"/><rect x="74" y="28" width="16" height="16" rx="2" fill="#cfd8e3"/></g><text x="46" y="40" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle" font-family="system-ui">1</text><text x="64" y="40" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle" font-family="system-ui">2</text><circle cx="82" cy="36" r="5" fill="#111"/></svg>'},
  {h:"Read the numbers",t:"When you uncover a safe square it shows a number: that\u2019s how many mines are hidden in the eight squares touching it. A blank square touches no mines and opens up its neighbors automatically.",svg:'<svg viewBox="0 0 120 72"><g><rect x="40" y="8" width="16" height="16" rx="2" fill="#e8edf3"/><rect x="58" y="8" width="16" height="16" rx="2" fill="#e8edf3"/><rect x="76" y="8" width="16" height="16" rx="2" fill="#e8edf3"/><rect x="40" y="26" width="16" height="16" rx="2" fill="#e8edf3"/><rect x="58" y="26" width="16" height="16" rx="2" fill="#fde68a"/><rect x="76" y="26" width="16" height="16" rx="2" fill="#e8edf3"/><rect x="40" y="44" width="16" height="16" rx="2" fill="#e8edf3"/><rect x="58" y="44" width="16" height="16" rx="2" fill="#e8edf3"/><rect x="76" y="44" width="16" height="16" rx="2" fill="#e8edf3"/></g><text x="66" y="39" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle" font-family="system-ui">3</text></svg>'},
  {h:"Dig & flag",t:"Tap a square to dig it. Switch the button to Flag and tap to plant a marker on a square you think hides a mine \u2014 flagged squares are protected from an accidental dig.",svg:'<svg viewBox="0 0 120 72"><rect x="48" y="20" width="24" height="24" rx="3" fill="#cfd8e3"/><path d="M58 24 V40" stroke="#555" stroke-width="2"/><path d="M58 24 L68 28 L58 32 Z" fill="#ef4444"/></svg>'},
  {h:"Win or lose",t:"Clear every safe square to win, and the clock shows your time. Dig a mine and the round is over. Easy, Medium, and Hard change the grid size and how many mines are buried.",ex:"A 1 next to a single unopened square means that square is the mine \u2014 flag it and dig elsewhere with confidence."}
]});}

</script>
</body>
</html>
