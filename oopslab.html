<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="build" content="0.9">
<meta name="robots" content="noindex">
<title>Oops Lab</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#16263a;--panel:#1f3550;--ink:#f3f6fa;--dim:#9fb3c8;--accent:#ffb627;--good:#5fd38d;--bad:#ff6b6b;--card:#26425f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS, Verdana, sans-serif",Verdana,system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:14px;touch-action:manipulation}
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0f1c2c;flex-wrap:wrap}
#top h1{font-size:clamp(18px,3vw,26px);margin:0 auto 0 4px;letter-spacing:.5px}
#top h1 span{color:var(--accent)}
.tb{background:var(--panel);padding:10px 14px;font-size:clamp(14px,2vw,17px);font-weight:bold}
.tb.on{background:var(--accent);color:#1a1a1a}
#ver{background:transparent;color:var(--dim);font-size:12px;padding:6px}
.screen{flex:1;display:none;min-height:0}
.screen.on{display:flex}
/* home */
#home{flex-direction:column;align-items:center;overflow-y:auto;padding:14px;gap:14px}
#home h2{margin:4px 0 0;font-size:clamp(18px,3vw,24px)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.pick{background:var(--panel);padding:10px;width:clamp(130px,20vw,170px);display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent}
.pick.sel{border-color:var(--accent)}
.pick canvas{width:100px;height:100px}
.pick b{font-size:18px}.pick small{color:var(--dim)}
.rig{background:var(--panel);padding:14px 18px;font-size:clamp(16px,2.4vw,20px);font-weight:bold;border:3px solid transparent;min-width:150px}
.rig.sel{border-color:var(--accent)}
.rig small{display:block;font-weight:normal;color:var(--dim);font-size:13px;margin-top:4px}
#go{background:var(--good);color:#10261a;font-size:24px;font-weight:bold;padding:14px 48px}
#tries{color:var(--dim)}
/* play */
#play{flex-direction:column;min-height:0}
#stageWrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#0f1c2c}
#cv{display:block;touch-action:none}
#banner{position:absolute;left:50%;top:10px;transform:translateX(-50%) scale(.6);transition:opacity .2s,transform .4s cubic-bezier(.34,1.56,.64,1)!important;background:rgba(15,28,44,.92);border:3px solid var(--accent);border-radius:16px;padding:8px 18px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;max-width:92%}
#banner.on{opacity:1;transform:translateX(-50%) scale(1)}
#banner .nm{font-size:clamp(20px,3.4vw,30px);font-weight:bold;color:var(--accent)}
#banner .nw{font-size:14px;color:var(--good);font-weight:bold}
#banner .tr{font-size:14px;color:var(--dim)}
#controls{background:var(--panel);padding:10px 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;min-height:86px}
.sl{display:flex;flex-direction:column;min-width:200px;flex:1;max-width:340px}
.sl label{font-size:15px;color:var(--dim);display:flex;justify-content:space-between}
.sl label b{color:var(--ink);font-size:18px}
input[type=range]{width:100%;height:40px;accent-color:var(--accent)}
.big{background:var(--accent);color:#1a1a1a;font-size:clamp(20px,3vw,26px);font-weight:bold;padding:14px 30px}
.big:disabled{opacity:.4}
.small{background:var(--card);padding:10px 14px;font-weight:bold}
.bal{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:6px 10px}
.bal button{background:#35597d;width:46px;height:46px;font-size:24px;font-weight:bold}
.bal .ct{font-size:22px;font-weight:bold;min-width:28px;text-align:center}
.dot{width:22px;height:28px;border-radius:50% 50% 45% 45%;display:inline-block}
#coach{display:none;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
#coach.on{display:flex}
#coach .q{width:100%;text-align:center;color:var(--dim);font-size:15px}
.tool{background:#35597d;padding:10px 14px;font-size:clamp(15px,2.2vw,18px);font-weight:bold;display:flex;align-items:center;gap:6px}
.tool i{font-style:normal;font-size:24px}
/* book + crew */
#book,#crew{flex-direction:column;overflow-y:auto;padding:14px;gap:12px}
#book h2,#crew h2{margin:6px 0 0;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border-radius:14px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:4px;border:2px solid #35597d}
.card.got{border-color:var(--accent)}
.card .t{font-weight:bold;font-size:17px}
.card .d{font-size:13px;color:var(--dim)}
.card .n{font-size:12px;color:var(--good);margin-top:auto}
.card.lock .t{color:#6f88a3}
.card.gold{border-color:var(--good)}
.bio{background:var(--card);border-radius:16px;padding:12px;display:flex;gap:12px;flex-wrap:wrap}
.bio canvas{width:110px;height:110px;flex:none}
.bio .tx{flex:1;min-width:200px}
.bio h3{margin:0;font-size:20px}
.bio p{margin:4px 0;font-size:15px}
.bio .lk{color:#6f88a3}
.bio ul{margin:4px 0;padding-left:20px;font-size:14px}
#museum{flex-direction:column;overflow-y:auto;padding:14px;gap:14px}
.mhead{display:flex;gap:12px;align-items:center;background:#2a2238;border-radius:16px;padding:10px}
.mhead canvas{width:70px;height:70px;flex:none}
.mhead .sp{background:#fff;color:#1a1a1a;border-radius:12px;padding:8px 12px;font-size:16px}
.room{background:#3b2f4a;border-radius:16px;padding:12px;border-top:10px solid #5a4670}
.room h3{margin:0 0 8px;font-size:20px;color:#ffd98a}
.room.lock{opacity:.6}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.frame{background:#8a5a2b;border:6px solid #c9a227;border-radius:6px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:150px;justify-content:center;color:#fff}
.frame.empty{background:#2a2238;border-style:dashed;border-color:#7a6a90;color:#b9a8d0;font-weight:bold}
.frame canvas{width:84px;height:84px}
.plaque{background:#e8d9a8;color:#3a2a10;font-size:13px;font-weight:bold;padding:3px 8px;border-radius:4px;text-align:center}
.shelf{display:flex;flex-wrap:wrap;gap:8px;background:#5a3f22;border-radius:10px;padding:10px;border-bottom:8px solid #3a2810}
.shelf span{font-size:30px}
#picker{position:fixed;inset:0;background:rgba(10,18,30,.92);display:none;z-index:20;padding:16px;overflow-y:auto}
#picker.on{display:block}
#picker .pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
#picker .pl button{background:var(--card);padding:10px;text-align:left;border:2px solid #35597d}
#tales{flex-direction:column;overflow-y:auto;padding:14px;gap:12px}
#tales h2{margin:6px 0 0;font-size:20px}
.tale{background:var(--card);border-radius:14px;padding:12px;border:2px solid #35597d;text-align:left;width:100%}
.tale.new{border-color:var(--good)}
.tale .t{font-weight:bold;font-size:18px}.tale .d{font-size:13px;color:var(--dim)}
.tale.lock{opacity:.6}
.panel{display:flex;gap:10px;align-items:flex-start;background:#1b3049;border-radius:12px;padding:8px;margin-top:8px}
.panel canvas{width:56px;height:56px;flex:none}
.panel .sp{background:#fff;color:#1a1a1a;border-radius:12px;padding:8px 12px;font-size:16px}
.panel .who{font-size:12px;color:var(--dim);font-weight:bold;margin-bottom:2px}
.pick.locked{opacity:.55}
#badges{flex-direction:column;overflow-y:auto;padding:14px;gap:12px}
#badges h2{margin:6px 0 0;font-size:20px}
.badge{background:var(--card);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;border:2px solid #35597d}
.badge.got{border-color:var(--accent)}
.badge .ic{font-size:30px;width:44px;text-align:center;flex:none}
.badge.lock .ic{filter:grayscale(1);opacity:.4}
.badge .t{font-weight:bold;font-size:16px}.badge .d{font-size:13px;color:var(--dim)}
.badge .pr{font-size:12px;color:var(--good)}
.vdots{display:flex;gap:4px;margin-top:2px}
.vdots span{width:16px;height:16px;border-radius:50%;border:2px solid #6f88a3;display:inline-block}
.vdots span.on{border-color:transparent}
.card.set{box-shadow:0 0 0 2px var(--good) inset}
.card .cs{font-size:12px;color:var(--good);font-weight:bold}
.card .vf{font-size:12px;color:#c9d6e3;font-style:italic}
#achPop{position:fixed;left:50%;bottom:118px;transform:translateX(-50%) translateY(-10px) scale(.7);transition:opacity .25s,transform .4s cubic-bezier(.34,1.56,.64,1)!important;background:#0f1c2c;border:3px solid var(--good);padding:10px 18px;border-radius:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:10;text-align:center;max-width:90%}
#achPop.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
#achPop .k{font-size:13px;color:var(--good);font-weight:bold}#achPop .n{font-size:20px;font-weight:bold}
.bud{background:var(--panel);padding:10px 14px;font-weight:bold;border:3px solid transparent;display:flex;align-items:center;gap:6px}
.bud.sel{border-color:var(--accent)}.bud canvas{width:40px;height:40px}
button{transition:transform .09s ease-out,background-color .15s}
button:active{transform:scale(.93)}
.screen.on{animation:scrIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bump{animation:bump .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.pick:not(.locked):hover,.rig:hover{filter:brightness(1.12)}
@media (prefers-reduced-motion:reduce){.screen.on,.bump{animation:none}button:active{transform:none}}
#howto{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,18,30,.6);z-index:6;padding:12px}
#howto.on{display:flex}
#howto .card2{background:#1f3550;border:3px solid var(--accent);border-radius:18px;padding:14px 16px;max-width:520px;width:100%;display:flex;gap:12px;align-items:flex-start;animation:scrIn .3s cubic-bezier(.34,1.56,.64,1)}
#howto canvas{width:84px;height:84px;flex:none}
#howto h3{margin:0 0 6px;font-size:22px;color:var(--accent)}
#howto ol{margin:0 0 10px;padding-left:22px;font-size:17px;line-height:1.35}
#howto .big{padding:10px 24px;font-size:20px}
#updBar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:7;display:none;background:#0f1c2c;border:3px solid var(--good);border-radius:16px;padding:10px 14px;align-items:center;gap:10px;max-width:94%}
#updBar.on{display:flex}
#updBar b{font-size:16px}
#updBar button{background:var(--good);color:#10261a;font-weight:bold;padding:10px 16px;font-size:16px}
#missions{flex-direction:column;overflow-y:auto;padding:14px;gap:12px}
#missions h2{margin:6px 0 0;font-size:20px}
.dpanel{background:linear-gradient(160deg,#2a4a6c,#1f3550);border:3px solid var(--accent);border-radius:16px;padding:10px 12px}
.dpanel h3{margin:0 0 6px;font-size:19px;color:var(--accent);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dpanel h3 small{color:var(--ink);font-size:14px;font-weight:normal}
.drow{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.18);border-radius:12px;padding:8px 10px;margin-top:6px}
.drow .ck{width:30px;height:30px;border-radius:50%;border:3px solid #6f88a3;flex:none;display:flex;align-items:center;justify-content:center;font-weight:bold}
.drow.done .ck{background:var(--good);border-color:var(--good);color:#10261a}
.drow .tx{flex:1;font-size:16px}
.drow.done .tx{opacity:.7}
.drow button{background:var(--accent);color:#1a1a1a;font-weight:bold;padding:8px 14px}
.cal{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.cal span{width:22px;height:22px;border-radius:6px;background:#35597d;display:inline-block}
.cal span.on{background:var(--good)}.cal span.today{outline:2px solid var(--accent)}
.mcard{background:var(--card);border-radius:14px;padding:10px;display:flex;gap:10px;border:2px solid #35597d}
.mcard.done{border-color:var(--good)}
.mcard canvas{width:70px;height:70px;flex:none}
.mcard .t{font-weight:bold;font-size:17px}
.mstep{font-size:14px;margin-top:3px;color:var(--dim)}
.mstep.cur{color:var(--ink);font-weight:bold}.mstep.ok{color:var(--good)}
.bar{height:8px;background:#35597d;border-radius:5px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.card.shiny{background:linear-gradient(135deg,#3a3060,#26425f 45%,#3a5a40);border-color:#ffe27a;box-shadow:0 0 12px rgba(255,226,122,.45)}
.card .sh{font-size:12px;color:#ffe27a;font-weight:bold}
.frame.shiny{box-shadow:0 0 16px rgba(255,226,122,.8);border-color:#ffe27a}
#workshop{flex-direction:column;overflow-y:auto;padding:14px;gap:14px}
.wsec{background:var(--card);border-radius:16px;padding:12px;border:2px solid #35597d}
.wsec h2{margin:0 0 8px;font-size:21px;color:var(--accent)}
.wrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.wrow>label{min-width:110px;font-weight:bold;color:var(--dim)}
.opt{background:#35597d;padding:8px 12px;font-weight:bold;border:3px solid transparent}
.opt.sel{border-color:var(--accent)}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw.sel{border-color:#fff}
.winp{background:#13202f;color:var(--ink);border:2px solid #35597d;border-radius:10px;padding:10px;font:inherit;font-size:17px;min-width:200px;flex:1;max-width:420px}
#mkPrev{width:150px;height:150px;background:#35597d;border-radius:50%}
#pad{background:#fff;border-radius:12px;touch-action:none;width:100%;max-width:360px;aspect-ratio:4/3;display:block}
.mycards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.mycards .card img,.card img.inv{width:100%;border-radius:8px;background:#fff}
#duelHud{position:absolute;left:8px;top:8px;z-index:5;display:none;background:rgba(15,28,44,.9);border:2px solid #8e6bd1;border-radius:12px;padding:6px 10px;font-size:14px;pointer-events:none}
#duelHud.on{display:block}
#duelHud b{font-size:16px}
#duelHud .act{color:var(--accent)}
#duelPass{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(20,10,40,.8)}
#duelPass.on{display:flex}
#duelPass .card2{background:#2a2048;border:3px solid #8e6bd1;border-radius:18px;padding:16px 20px;text-align:center;max-width:460px}
#duelPass h3{margin:6px 0;font-size:26px;color:#ffd98a}
#duelPass canvas{width:100px;height:100px}
.season{background:linear-gradient(135deg,#7a3b12,#b5651d);border:3px solid #ffb627;border-radius:16px;padding:10px 14px;font-size:16px}
.season.winter{background:linear-gradient(135deg,#2d5a8a,#5f8fc0);border-color:#e6f3fd}
.season.spooky{background:linear-gradient(135deg,#2a1440,#6a2c70);border-color:#ff9f1c}
.season b{font-size:19px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0f1c2c;border:2px solid var(--accent);padding:8px 16px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
@media (orientation:landscape) and (max-height:520px){#controls{min-height:70px;padding:6px 10px}.sl{min-width:160px}input[type=range]{height:30px}.big{padding:10px 22px}}
</style>
</head>
<body>
<div id="top">
  <a class="tb" href="index.html" style="text-decoration:none;color:var(--ink)" aria-label="Back to the Game Shelf">← Shelf</a>
  <h1>Oops <span>Lab</span></h1>
  <button class="tb on" data-go="home">Lab</button>
  <button class="tb" data-go="book" id="bookBtn">Oops Book</button>
  <button class="tb" data-go="crew">Crew</button>
  <button class="tb" data-go="badges" id="badgeBtn">Badges</button>
  <button class="tb" data-go="tales" id="taleBtn">Tales</button>
  <button class="tb" data-go="missions" id="misBtn">Missions</button>
  <button class="tb" data-go="museum">Museum</button>
  <button class="tb" data-go="workshop">Workshop</button>
  <button class="tb" id="snd">Settings</button>
  <button id="ver">v0.9 · Nov 13</button>
</div>

<div class="screen on" id="home">
  <div id="dailyHome" style="width:100%;max-width:760px"></div>
  <h2>Who is testing today?</h2>
  <div class="row" id="charPicks"></div>
  <h2>Bring a buddy?</h2>
  <div class="row" id="budPicks"></div>
  <h2>Which contraption?</h2>
  <div class="row" id="rigPicks"></div>
  <h2>Where?</h2>
  <div class="row" id="yardPicks"></div>
  <div id="seasonHome" style="width:100%;max-width:760px"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button id="go">Go!</button><button id="duelBtn" class="big" style="background:#8e6bd1;color:#fff">Duel Mode (2 players)</button></div>
  <div id="tries"></div>
</div>

<div class="screen" id="play">
  <div id="stageWrap"><canvas id="cv"></canvas>
    <div id="howto"></div><div id="duelHud"></div><div id="duelPass"></div><div id="updBar"></div>
    <div id="banner"><div class="nm"></div><div class="nw"></div><div class="tr"></div></div>
  </div>
  <div id="controls"></div>
</div>

<div class="screen" id="book"></div>
<div class="screen" id="crew"></div>
<div class="screen" id="badges"></div>
<div class="screen" id="tales"></div>
<div class="screen" id="museum"></div>
<div class="screen" id="missions"></div>
<div class="screen" id="workshop"></div>
<div id="picker"></div>
<div id="achPop"></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
var VERSION="0.9", VDATE="Nov 13";
var W=1000,H=560,G=480;

/* ---------- storage ---------- */
var KEY="oopslab.v1", mem=null;
function blank(){return {tries:{pip:0,sprocket:0,honk:0,nib:0},total:0,cards:{},fav:{},sound:true,cv:{},coached:0,buddyHelps:0,ach:{},weird:{},rigsUsed:{},bestRun:0,coachedBy:{},unl:{},tales:{},talesRead:{},yardTries:{},ammo:"ball",golds:0,bestWinRun:0,museum:{},shake:true,daily:{},mis:{},misDone:{},shiny:{},charm:0,expDone:0,myCards:[],mychar:null,duels:0};}
function load(){try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s),b=blank();for(var k in b){if(d[k]===undefined)d[k]=b[k];}return d;}}catch(e){}return mem||blank();}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load();

/* ---------- data ---------- */
var CHARS={
 pip:{name:"Pip",kind:"Mole engineer",fav:"snack",look:"Huge goggles, tiny paws",
  style:"Digs straight down and pouts in his hole",
  likes:"Measuring things twice, acorn cookies, the sound of a tape measure snapping shut",
  facts:["Pip has measured every room in the lab. Twice.","His goggles are not for safety. He just thinks they look cool.","Pip once dug a tunnel all the way to the snack cupboard. Nobody has found it.","Pip's biggest dream is to build a machine that digs by itself."],
  mad:["I measured it TWICE!","Ugh. That was supposed to be perfect.","I'm going in my hole.","This thing is broken. It's not me. It's broken."],
  quip:["Huh. Did not measure for that.","Well, that's a new one.","Interesting. Very interesting.","Okay, that was kind of funny."],
  win:["Exactly as I measured!","Bullseye! Write that down!","Ha! Measured it right!"]},
 sprocket:{name:"Sprocket",kind:"Wind-up tin robot",fav:"breathe",look:"Round eyes, a big brass key on his back",
  style:"Overheats: steam out of his ears and a rattling key",
  likes:"Oil on Sundays, counting gears, beeping songs",
  facts:["Sprocket has to be wound up every morning. He hums while it happens.","He counts in beeps when he gets nervous.","Sprocket's favorite color is rust orange. He is a little worried about that.","He was built in a toy shop and walked out on his own."],
  mad:["BZZT. Error. Error. ERROR.","My gears are too hot!","Does not compute. I quit. Beep.","Why does this keep happening?!"],

function missionEvent(ev){var changed=false;
  CHAR_IDS.forEach(function(cid){if(!unlocked(cid)||S.misDone[cid]||!MISSIONS[cid])return;var M=MISSIONS[cid],st=S.mis[cid]=S.mis[cid]||{step:0,prog:0};var q=M.s[st.step];if(!q)return;
    var hit=0;
    if(q.ch&&ev.type!=="tick"&&ev.op!==q.ch&&q.t!=="museum")hit=-1;
    if(hit===0){
      if(q.t==="card"&&ev.type==="finish"&&ev.id===q.card)hit=1;
      else if(q.t==="bonus"&&ev.type==="finish"&&ev.bon&&ev.bon.indexOf(q.card)>=0)hit=1;
      else if(q.t==="gold"&&ev.type==="finish"&&ev.win)hit=1;
      else if(q.t==="combo"&&ev.type==="finish"&&ev.combo)hit=1;
      else if(q.t==="coach"&&ev.type==="coach")hit=1;
      else if(q.t==="try"&&ev.type==="try")hit=1;
      else if(q.t==="missrun"&&ev.type==="finish"&&!ev.win&&P.missRun>=q.c){st.prog=q.c;hit=2;}
      else if(q.t==="museum"){var mc=museumCount();if(mc!==st.prog){st.prog=Math.min(q.c,mc);changed=true;}if(mc>=q.c)hit=2;}}
    if(hit===1){st.prog++;changed=true;}
    if(hit>=1&&st.prog>=q.c){st.step++;st.prog=0;changed=true;
      if(st.step>=M.s.length){S.misDone[cid]=true;achQ.push({kind:"MISSION COMPLETE",ic:"\uD83C\uDF96",n:M.n+"! New Lab Tale"});}

  else if(f.id==="silly"){ctx.font="34px sans-serif";ctx.fillText("😜",x+60,y);}
  else if(f.id==="friend"){ctx.font="30px sans-serif";ctx.fillText("🤝",x+60,y);}
}

var last=performance.now(),acc=0;
function frame(now){
  var dt=Math.min(100,now-last);last=now;
  if($("play").classList.contains("on")){
    acc+=dt;while(acc>=16.67){if(HS>0)HS--;else if(P.phase==="fly")step();else if(P.hatFly||P.birds.length||P.tumble)stepFx();acc-=16.67;}
    draw(now);
  }else acc=0;
  requestAnimationFrame(frame);
}
function draw(t){
  ctx.save();if(P.shake>0.5){ctx.translate(rnd(-P.shake,P.shake),rnd(-P.shake,P.shake));P.shake*=0.88;}else P.shake=0;
  drawScene(t);drawSeason(t);
  if(cur.rig==="catapult")drawCatapult();else if(cur.rig==="cannon")drawCannon();else if(cur.rig==="rocket")drawRocket(t);else if(cur.rig==="seesaw")drawSeesaw(t);else drawBalloonRig(t);
  // character
  var cx=95,cy=G;ctx.save();
  if(P.tumble>0){ctx.translate(cx,cy-30);ctx.rotate(-(P.tumble<25?P.tumble*0.056:P.tumble<80?1.4:Math.max(0,1.4-(P.tumble-80)*0.042)));ctx.translate(-cx,-(cy-30));}
  if(P.mood==="mad"&&P.op==="pip"){cy=G+30;} // pouting in hole
  drawCharO(ctx,P.op,cx,cy,1,P.mood,t,!!P.hatFly,P.squash||0);ctx.restore();if(P.squash){P.squash*=0.82;if(Math.abs(P.squash)<0.005)P.squash=0;}
  if(P.mood==="mad"&&P.op==="pip"){ell(95,G+4,46,10,"#3a2414");}
  if(P.helper){var hxT=P.walk?150:32;P.hx+=(hxT-P.hx)*0.08;drawCharO(ctx,P.helper,P.hx,G,0.72,P.mood==="happy"?"happy":(P.walk?"calm":"idle"),t+900,false,0);}
  if(P.hatFly){ctx.save();ctx.translate(P.hatFly.x,P.hatFly.y);ctx.rotate(P.hatFly.r);ctx.fillStyle="#ffcc00";ctx.beginPath();ctx.arc(0,0,14,Math.PI,0);ctx.fill();ctx.fillRect(-18,-2,36,5);ctx.restore();}
  if(P.mood==="mad"){drawStorm(t,95,G-200);
    if(P.op==="sprocket"){for(var i=0;i<3;i++){var k=((t*0.05+i*20)%60);ctx.globalAlpha=1-k/60;ell(70-k*0.3,G-90-k,8+k*0.2,6+k*0.2,"#e8eef3");ell(120+k*0.3,G-90-k,8+k*0.2,6+k*0.2,"#e8eef3");}ctx.globalAlpha=1;}
    if(P.op==="honk"){ctx.fillStyle="#ffdd33";ctx.font="bold 30px Trebuchet MS, Verdana, sans-serif";ctx.textAlign="center";ctx.fillText("HONK!",170,G-140+Math.sin(t*0.03)*4);}
    if(P.op==="nib"){ctx.strokeStyle="#4fa3ff";ctx.lineWidth=2;ctx.fillStyle="#e8f1fb";ctx.fillRect(130,G-60,60,44);ctx.beginPath();for(var j=0;j<10;j++){ctx.lineTo(135+Math.random()*50,G-55+Math.random()*34);}ctx.stroke();}
  }
  drawToolFx(t);
  // projectile
  var b=P.ball;if(b&&b.mode!=="moonwait"){
    if(b.mode==="splat"){var s=Math.min(9,b.s);circ(W/2,H/2,12*s,{turkey:"#a0522d",snowball:"#ffffff",pumpkin:"#ff8c1a",pie:"#fff3d6",melon:"#e04f5f",chicken:"#ffe066",jelly:"#b07cff"}[P.ammo]||"#e04f5f");}
    else{ctx.globalAlpha=0.3;b.trail.forEach(function(p,i){circ(p.x,p.y,b.r*(i/b.trail.length),cur.rig==="cannon"?"#3b3b45":"#e04f5f");});ctx.globalAlpha=1;
      drawAmmo(b,t);}}
  if(P.duck){var d=P.duck;d.x+=d.vx;d.y+=d.vy;d.vy+=0.35;d.r+=0.15;ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.r);ell(0,0,12,8,"#ffcc00");circ(8,-8,7,"#ffcc00");ctx.restore();}
  P.birds.forEach(drawBird);
  drawFx(t);
  if(P.splat){ctx.fillStyle="rgba(224,79,95,.85)";for(var q=0;q<10;q++){var a2=q*0.63;ell(W/2+Math.cos(a2)*170,H/2+Math.sin(a2)*120,60,40,"rgba(224,79,95,.85)");}circ(W/2,H/2,150,"rgba(224,79,95,.9)");}
  if(cur.rig==="catapult"||cur.rig==="cannon"){if(P.phase==="aim"){ // aim guide
    var rad=P.ang*Math.PI/180,L=LX[cur.rig];ctx.strokeStyle="rgba(255,255,255,.5)";ctx.setLineDash([6,8]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(L.x,L.y);ctx.lineTo(L.x+Math.cos(rad)*(40+P.pow),L.y-Math.sin(rad)*(40+P.pow));ctx.stroke();ctx.setLineDash([]);}}
  if(P.phase==="aim"&&((S.rigTries&&S.rigTries[cur.rig])||0)<3){var hx2=cur.rig==="balloon"?800:P.tx,hy2=cur.rig==="balloon"?LEDGE.y-20:(cur.rig==="cannon"?tankTop-40:cur.rig==="seesaw"?G-90:G-90),bob2=Math.abs(Math.sin(t*0.006))*12;
    ctx.fillStyle="#ffdd33";ctx.strokeStyle="#13202f";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(hx2,hy2+bob2);ctx.lineTo(hx2-14,hy2-18+bob2);ctx.lineTo(hx2-5,hy2-18+bob2);ctx.lineTo(hx2-5,hy2-38+bob2);ctx.lineTo(hx2+5,hy2-38+bob2);ctx.lineTo(hx2+5,hy2-18+bob2);ctx.lineTo(hx2+14,hy2-18+bob2);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.font="bold 16px Trebuchet MS, Verdana, sans-serif";ctx.textAlign="center";ctx.lineWidth=4;ctx.strokeText("GOAL",hx2,hy2-46+bob2);ctx.fillText("GOAL",hx2,hy2-46+bob2);}
  if(P.ring){var rg=P.ring;rg.r+=9;rg.life--;ctx.strokeStyle="rgba(255,226,122,"+(rg.life/30)+")";ctx.lineWidth=6;ctx.beginPath();ctx.arc(rg.x,rg.y,rg.r,0,7);ctx.stroke();if(rg.life<=0)P.ring=null;}
  if(P.flash>0){ctx.fillStyle="rgba(255,255,255,"+(P.flash*0.16)+")";ctx.fillRect(-20,-20,W+40,H+40);P.flash--;}
  if(P.speech&&now()<P.speech.until)bubble(P.speech.text,60,G-(P.mood==="mad"?250:150));
  if(P.helper&&P.speech2&&now()<P.speech2.until)bubble(P.speech2.text,Math.max(10,P.hx+20),G-(P.speech&&now()<P.speech.until?(P.mood==="mad"?330:240):120));
  ctx.restore();
}
function now(){return performance.now();}

/* update checker: auto-refresh on first load, banner after that */
var updShown=false;
function checkUpdate(boot){try{if(location.protocol.indexOf("http")!==0)return;
  fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"}).then(function(r){return r.text();}).then(function(tx){var m=tx.match(/name="build" content="([^"]+)"/);if(!m||m[1]===VERSION)return;
    var key="oops.bust."+m[1];
    if(boot&&!sessionStorage.getItem(key)){sessionStorage.setItem(key,"1");location.replace(location.pathname+"?v="+m[1]);return;}
    if(updShown)return;updShown=true;var el=$("updBar");el.innerHTML="<b>New Oops Lab update ready! (v"+m[1]+")</b><button id='updGo'>Update now</button>";el.classList.add("on");
    $("updGo").onclick=function(){location.replace(location.pathname+"?v="+m[1]);};
    var hb2=$("updBar");if(!document.getElementById("play").classList.contains("on")){toast("New Oops Lab update ready! Open the game to update.");}
  }).catch(function(){});}catch(e){}}
setTimeout(function(){checkUpdate(true);},1500);
setInterval(function(){checkUpdate(false);},5*60*1000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")checkUpdate(false);});

try{regMyCards();}catch(e){}
renderHome();updBadgeBtn();
requestAnimationFrame(frame);
window.__oops={fin:function(id){finish(id);},S:S,P:function(){return P;},cur:cur,CARDS:CARDS};
})();
