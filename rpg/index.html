<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d1611">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="game.css">
<title>Untitled Adventure</title>
</head>
<body>
<header class="top">
  <h1 id="title">Untitled Adventure</h1>
  <nav class="nav">
    <button class="navbtn on" data-screen="adventure-screen" type="button">Adventure</button>
    <button class="navbtn" data-screen="tray-screen" type="button">Dice</button>
    <button class="navbtn" data-screen="gallery-screen" type="button">Heroes &amp; Monsters</button>
  </nav>
  <button id="badge" class="badge" type="button">v0.4.1</button>
</header>

<main id="adventure-screen" class="screen adv">
  <section class="adv-stage">
    <div class="hero-stage"><canvas id="adv-sprite" width="32" height="40"></canvas></div>
    <div id="adv-say" class="say-box" aria-live="polite"></div>
  </section>
  <section id="adv-panel" class="panel adv-panel"></section>
</main>

<main id="story-screen" class="screen adv story hidden">
  <section class="adv-stage">
    <div id="story-stage" class="hero-stage story-stage"><canvas id="story-face" width="32" height="40"></canvas></div>
    <div id="story-chapter" class="story-chapter"></div>
  </section>
  <section class="panel adv-panel story-panel">
    <div id="story-name" class="story-name"></div>
    <div id="story-say" class="say-box story-say" aria-live="polite"></div>
    <div id="story-act" class="story-act"></div>
  </section>
</main>

<main id="battle-screen" class="screen battle hidden">
  <section id="board-wrap" class="board-wrap"><canvas id="board" aria-label="Battle map"></canvas></section>
  <aside class="panel bpanel">
    <div class="row brow"><span id="round-num" class="round-num"></span><button id="b-legend" class="btn small" type="button">Flags?</button></div>
    <div id="turnstrip" class="turnstrip"></div>
    <div class="bsay">
      <canvas id="bsay-face" class="bsay-face" width="32" height="40"></canvas>
      <div class="bsay-text"><div id="bsay-name" class="bsay-name"></div><div id="bsay" class="say-box" aria-live="polite"></div></div>
    </div>
    <div id="bact" class="bact"></div>
  </aside>
  <div id="bdice-pop" class="bdice-pop hidden">
    <div class="bdice-box"><div id="bdice" class="tray bdice"></div><div id="bresult" class="bresult"></div></div>
  </div>
</main>

<main id="tray-screen" class="screen hidden">
  <section class="tray-wrap">
    <div id="tray" class="tray"></div>
    <div id="result" class="result" aria-live="polite"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button class="tab act on" data-tab="check" type="button">Skill check</button>
      <button class="tab act" data-tab="bag" type="button">Dice bag</button>
    </div>

    <div id="tab-check" class="tabbody">
      <div class="row">
        <span class="lbl">Your skill</span>
        <button class="q" data-explain="skill" type="button" aria-label="What is a skill?">?</button>
        <span id="skill-val" class="big">50%</span>
      </div>
      <input id="skill" class="slider act" type="range" min="1" max="95" value="50" aria-label="Skill percent">

      <div class="row">
        <span class="lbl">What each roll means</span>
        <button class="q" data-explain="chart" type="button" aria-label="What is the chart?">?</button>
      </div>
      <div id="chart" class="chart"></div>
      <div class="ticks"><span>1</span><span>50</span><span>100</span></div>

      <button id="roll" class="btn big-btn act" type="button">Roll the dice</button>

      <div class="row chances">
        <div class="chance">
          <div class="row">
            <span class="lbl">Luck</span>
            <button class="q" data-explain="luck" type="button" aria-label="What is luck?">?</button>
            <span id="luck-pips" class="pips"></span>
          </div>
          <button id="use-luck" class="btn act" type="button" disabled>Use Luck: roll again</button>
        </div>
        <div class="chance">
          <div class="row">
            <span class="lbl">Flips</span>
            <button class="q" data-explain="flip" type="button" aria-label="What is flipping?">?</button>
            <span id="flip-pips" class="pips"></span>
          </div>
          <button id="use-flip" class="btn act" type="button" disabled>Flip the dice</button>
        </div>
      </div>
      <button id="rest" class="btn small act" type="button">Rest (refill Luck and Flips)</button>
      <button class="btn small linkish" data-explain="percentile" type="button">How do percentile dice work?</button>
    </div>

    <div id="tab-bag" class="tabbody hidden">
      <div class="row">
        <span class="lbl">Tap a die to add it</span>
        <button class="q" data-explain="dicebag" type="button" aria-label="What is the dice bag?">?</button>
      </div>
      <div id="die-picker" class="die-picker"></div>
      <div class="row">
        <span class="lbl">In the bag</span>
        <span id="bag-notation" class="notation"></span>
      </div>
      <div id="bag" class="bag"></div>
      <div class="row two">
        <button id="bag-roll" class="btn big-btn act" type="button" disabled>Roll the bag</button>
        <button id="bag-clear" class="btn act" type="button" disabled>Empty</button>
      </div>
    </div>

    <label class="toggle">
      <input id="mode-3d" type="checkbox" class="act" checked>
      <span>3D dice (turn off on slow tablets)</span>
    </label>
  </aside>
</main>

<main id="gallery-screen" class="screen gallery hidden">
  <section class="hero-wrap">
    <div class="hero-stage"><canvas id="hero-canvas" width="32" height="40"></canvas></div>
    <div class="row two">
      <button id="hero-attack" class="btn big-btn" type="button">Swing!</button>
      <button id="hero-random" class="btn" type="button">Surprise me</button>
    </div>
    <div id="hero-gear" class="hero-gear"></div>
  </section>
  <section class="panel hero-opts">
    <h2 class="sec">Dress your hero</h2>
    <div id="hero-options"></div>
    <h2 class="sec">The first adventure's cast</h2>
    <div id="cast" class="cast"></div>
  </section>
</main>

<div id="card" class="card-wrap hidden" role="dialog" aria-modal="true">
  <div class="card">
    <canvas id="card-sprite" class="card-sprite hidden" width="32" height="40"></canvas>
    <h2 id="card-title"></h2>
    <p id="card-body"></p>
    <div id="card-extra" class="card-extra"></div>
    <p id="card-prereq" class="prereq"></p>
    <button id="card-ok" class="btn big-btn" type="button">Got it</button>
  </div>
</div>
<div id="codebox" class="card-wrap hidden" role="dialog" aria-modal="true">
  <div class="card">
    <h2 id="code-title"></h2>
    <p id="code-help"></p>
    <textarea id="code-text" class="code-text" rows="5" spellcheck="false"></textarea>
    <div class="row two">
      <button id="code-go" class="btn big-btn" type="button">Copy</button>
      <button id="code-close" class="btn" type="button">Close</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<button id="update-pill" class="update-pill hidden" type="button">New version ready. Tap to refresh.</button>

<script type="module" src="ui.js"></script>
</body>
</html>
