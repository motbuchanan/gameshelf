<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1d1611">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="game.css">
<title>Untitled Adventure</title>
</head>
<body>
<header class="top">
  <h1 id="title">Untitled Adventure</h1>
  <button id="badge" class="badge" type="button">v0.1.0</button>
</header>

<main id="tray-screen" class="screen">
  <section class="tray-wrap">
    <div id="tray" class="tray"></div>
    <div id="result" class="result" aria-live="polite"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button class="tab act on" data-tab="check" type="button">Skill check</button>
      <button class="tab act" data-tab="bag" type="button">Dice bag</button>
    </div>

    <div id="tab-check" class="tabbody">
      <div class="row">
        <span class="lbl">Your skill</span>
        <button class="q" data-explain="skill" type="button" aria-label="What is a skill?">?</button>
        <span id="skill-val" class="big">50%</span>
      </div>
      <input id="skill" class="slider act" type="range" min="1" max="95" value="50" aria-label="Skill percent">

      <div class="row">
        <span class="lbl">What each roll means</span>
        <button class="q" data-explain="chart" type="button" aria-label="What is the chart?">?</button>
      </div>
      <div id="chart" class="chart"></div>
      <div class="ticks"><span>1</span><span>50</span><span>100</span></div>

      <button id="roll" class="btn big-btn act" type="button">Roll the dice</button>

      <div class="row chances">
        <div class="chance">
          <div class="row">
            <span class="lbl">Luck</span>
            <button class="q" data-explain="luck" type="button" aria-label="What is luck?">?</button>
            <span id="luck-pips" class="pips"></span>
          </div>
          <button id="use-luck" class="btn act" type="button" disabled>Use Luck: roll again</button>
        </div>
        <div class="chance">
          <div class="row">
            <span class="lbl">Flips</span>
            <button class="q" data-explain="flip" type="button" aria-label="What is flipping?">?</button>
            <span id="flip-pips" class="pips"></span>
          </div>
          <button id="use-flip" class="btn act" type="button" disabled>Flip the dice</button>
        </div>
      </div>
      <button id="rest" class="btn small act" type="button">Rest (refill Luck and Flips)</button>
      <button class="btn small linkish" data-explain="percentile" type="button">How do percentile dice work?</button>
    </div>

    <div id="tab-bag" class="tabbody hidden">
      <div class="row">
        <span class="lbl">Tap a die to add it</span>
        <button class="q" data-explain="dicebag" type="button" aria-label="What is the dice bag?">?</button>
      </div>
      <div id="die-picker" class="die-picker"></div>
      <div class="row">
        <span class="lbl">In the bag</span>
        <span id="bag-notation" class="notation"></span>
      </div>
      <div id="bag" class="bag"></div>
      <div class="row two">
        <button id="bag-roll" class="btn big-btn act" type="button" disabled>Roll the bag</button>
        <button id="bag-clear" class="btn act" type="button" disabled>Empty</button>
      </div>
    </div>

    <label class="toggle">
      <input id="mode-3d" type="checkbox" class="act" checked>
      <span>3D dice (turn off on slow tablets)</span>
    </label>
  </aside>
</main>

<div id="card" class="card-wrap hidden" role="dialog" aria-modal="true">
  <div class="card">
    <h2 id="card-title"></h2>
    <p id="card-body"></p>
    <p id="card-prereq" class="prereq"></p>
    <button id="card-ok" class="btn big-btn" type="button">Got it</button>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<button id="update-pill" class="update-pill hidden" type="button">New version ready. Tap to refresh.</button>

<script type="module" src="ui.js"></script>
</body>
</html>
