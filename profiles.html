<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Players</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:system-ui,sans-serif;color:#22303a;min-height:100vh;display:flex;flex-direction:column;align-items:center;
    background:repeating-linear-gradient(#f2f6f8 0 27px,#d8e4ec 27px 28px);}
  #bar{width:100%;max-width:620px;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#f2f6f8;border-bottom:2px solid #4f9b6e;}
  #bar a{color:#3a566e;text-decoration:none;font-size:14px;border:1.5px solid #9ab4c8;border-radius:999px;padding:6px 12px;background:#fff;}
  #title{font-weight:800;font-size:20px;flex:1;}
  #wrap{width:min(96vw,620px);padding:12px 16px 48px;}
  .owner{background:rgba(255,255,255,.8);border-radius:12px;padding:10px 14px;margin:6px 0 16px;
    box-shadow:0 1px 3px rgba(40,60,80,.15);display:flex;align-items:center;gap:10px;font-size:14px;}
  .owner b{color:#2f7d4f;}
  h2{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#5a7a5e;margin:14px 0 8px;}
  .tok{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;
    box-shadow:0 1px 3px rgba(0,0,0,.25) inset,0 1px 2px rgba(0,0,0,.2);overflow:hidden;}
  .tok img{width:100%;height:100%;object-fit:cover;}
  .row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.85);border-radius:12px;padding:10px 14px;margin-bottom:8px;
    box-shadow:0 1px 3px rgba(40,60,80,.15);cursor:pointer;border:2px solid transparent;}
  .row.isowner{border-color:#4f9b6e;}
  .row .nm{font-weight:700;font-size:16px;flex:1;}
  .row .sub{font-size:12px;color:#7a8a98;}
  .row .crown{font-size:14px;color:#2f7d4f;}
  .add{display:block;width:100%;margin-top:6px;padding:12px;border:2px dashed #9ab4c8;border-radius:12px;background:rgba(255,255,255,.55);
    color:#3a566e;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer;}
  /* editor overlay */
  #ov{position:fixed;inset:0;background:rgba(20,32,28,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:10;}
  #ov.show{display:flex;}
  .card{background:#fbfdfb;border-radius:16px;width:min(440px,94vw);max-height:92vh;overflow:auto;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.4);}
  .card h3{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
  .fld{margin-bottom:14px;}
  .fld label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#7a8a98;margin-bottom:5px;}
  .fld input{width:100%;font-size:17px;font-family:inherit;padding:10px 12px;border:1.5px solid #c0d0da;border-radius:10px;}
  .grid{display:flex;flex-wrap:wrap;gap:8px;}
  .sw{width:38px;height:38px;border-radius:50%;cursor:pointer;border:3px solid transparent;}
  .sw.sel{border-color:#22303a;transform:scale(1.08);}
  .prev{display:flex;justify-content:center;margin:2px 0 12px;}
  .tabs{display:flex;gap:6px;margin-bottom:8px;}
  .tab{flex:1;font-family:inherit;font-weight:700;font-size:13px;padding:8px;border-radius:9px;border:1.5px solid #c0d0da;background:#fff;color:#3a566e;cursor:pointer;}
  .tab.on{background:#2f7d4f;color:#fff;border-color:#2f7d4f;}
  .iconGrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .ico{width:48px;height:48px;border-radius:12px;cursor:pointer;border:3px solid transparent;display:flex;align-items:center;justify-content:center;}
  .ico.sel{border-color:#22303a;}
  .avSetLabel{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:#8aa0ad;margin:10px 2px 5px;text-align:left;font-weight:700;}
  .avSetLabel:first-child{margin-top:2px;}
  .photoBtn{display:inline-block;padding:10px 14px;border-radius:10px;background:#eef3f1;color:#2a3a30;font-weight:700;cursor:pointer;font-size:14px;}
  .photoBtn input{display:none;}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .btn{flex:1;min-width:120px;font-family:inherit;font-weight:800;font-size:15px;padding:11px;border-radius:10px;border:none;cursor:pointer;}
  .btn.primary{background:#2f7d4f;color:#fff;}
  .btn.ghost{background:#eef3f1;color:#2a3a30;}
  .btn.owner{background:#dff0e6;color:#2f7d4f;border:1.5px solid #2f7d4f;}
  .btn.danger{background:#fbe7e4;color:#b23a2e;}
  .statbox{background:#eef3f1;border-radius:10px;padding:10px 12px;margin:10px 0 4px;font-size:13.5px;}
  .statbox table{width:100%;border-collapse:collapse;}
  .statbox td{padding:3px 0;}
  .statbox td.r{text-align:right;font-variant-numeric:tabular-nums;color:#3a566e;font-weight:700;}
  .statempty{color:#7a8a98;font-style:italic;}
  .note{font-size:12px;color:#7a8a98;font-style:italic;margin-top:18px;line-height:1.5;}
  .wheelwrap{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:9px;}
  .wcanvas{position:relative;line-height:0;}
  #ewheel{border-radius:50%;touch-action:none;cursor:crosshair;box-shadow:0 2px 10px rgba(0,0,0,.18),inset 0 0 0 1px rgba(0,0,0,.08);width:160px;height:160px;}
  .wmarker{position:absolute;width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none;display:none;}
  .lslider{width:160px;accent-color:#2f7d4f;}
  .wlabel{font-size:11.5px;color:#7a8a98;font-style:italic;}
  .layer{border:1px solid rgba(255,255,255,.14);border-radius:12px;margin-top:10px;overflow:hidden}
  .layer>summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;
       align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.05)}
  .layer>summary::-webkit-details-marker{display:none}
  .layer>summary::after{content:"\203A";opacity:.5;font-size:18px;transform:rotate(90deg);transition:transform .18s}
  .layer[open]>summary::after{transform:rotate(-90deg)}
  .lyt{font-weight:700;font-size:14px}
  .lyc{font-size:12px;opacity:.55;margin-left:auto;margin-right:4px}
  .lyc.on{opacity:.95}
  .lyb{padding:4px 13px 13px}
  .abt{border-top:1px solid rgba(255,255,255,.14);margin-top:14px;padding-top:12px}
  .zod{font-size:13px;opacity:.85;margin-top:6px;min-height:18px;line-height:1.45}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);
        border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:5px 9px;font-size:13px}
  .chip b{cursor:pointer;opacity:.7;font-weight:700}
  .chip b:hover{opacity:1}
  .rowin{display:flex;gap:8px}
  .rowin input{flex:1;min-width:0}
  .tog{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9;margin-top:10px}
  .note{font-size:12px;opacity:.65;margin-top:4px;line-height:1.4}
</style></head><body>
<div id="bar"><a href="index.html">&#8962; Shelf</a><div id="title">&#128101; Players</div></div>
<div id="wrap">
  <div class="owner" id="ownerBox"></div>
  <h2>Everyone on this shelf</h2>
  <div id="list"></div>
  <button class="add" id="addBtn">&#43; Add a player</button>
  <div class="note">A profile keeps that player's stats and (for whoever owns this device) their preferences.
    Picking <b>Make this device's owner</b> sets whose preferences this phone uses &mdash; everyone's stats are still tracked.
    Custom icons and photos are coming next.</div>
</div>

<div id="ov"><div class="card" id="card"></div></div>

<script src="gamenight.js?v=12"></script>
<script>
const $=id=>document.getElementById(id);
let editId=null, pickColor=null, pickAvatar=null, avMode="color"; // editor state

function tokenHTML(p,size){return GN.tokenHTML(p,size||40);}
function statLine(p){
  const ks=Object.keys(p.stats||{});
  if(!ks.length)return "no games yet";
  let plays=0,wins=0;ks.forEach(k=>{plays+=p.stats[k].plays||0;wins+=p.stats[k].wins||0;});
  return plays+" game"+(plays===1?"":"s")+" \u00b7 "+wins+" win"+(wins===1?"":"s");
}
const TITLES={yahtzee:"Yahtzee",farkle:"Farkle",shutbox:"Shut the Box",chess:"Chess",onecardleft:"One Card Left!",
  checkers:"Checkers",connect4:"Connect 4",reversi:"Reversi",mancala:"Mancala",dots:"Dots & Boxes",
  ur:"Royal Game of Ur",trouble:"Trouble",snakes:"Snakes & Ladders",war:"War",sorry:"Sorry!"};

function render(){
  const owner=GN.profiles.owner();
  $("ownerBox").innerHTML = owner
    ? ('This device&rsquo;s owner: '+tokenHTML(owner,28)+'<b>'+esc(owner.name)+'</b>')
    : 'No owner set for this device yet &mdash; tap a player and choose <b>Make owner</b>.';
  const list=$("list");list.innerHTML="";
  GN.profiles.list().forEach(p=>{
    const row=document.createElement("div");row.className="row"+(owner&&owner.id===p.id?" isowner":"");
    row.innerHTML=tokenHTML(p,44)
      +'<div style="flex:1;min-width:0;"><div class="nm">'+esc(p.name)+(owner&&owner.id===p.id?' <span class="crown">&#9733; this device</span>':'')+'</div>'
      +'<div class="sub">'+statLine(p)+'</div></div>';
    row.onclick=()=>openEditor(p.id);
    list.appendChild(row);
  });
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function openEditor(id){
  editId=id;
  const isNew=!id;
  const p=isNew?{name:"",...GN.palette()[ firstFreeColorIdx() ],avatar:{kind:"color"},stats:{}}:GN.profiles.get(id);
  const per=id?GN.people.get(id):{born:"",interests:[],notes:"",rel:[],contact:{phone:"",email:""}};
  peoDraft=JSON.parse(JSON.stringify(per||{}));
  if(peoDraft.contact){ /* migrate the v1 nested shape up to flat schema keys */
    if(!peoDraft.phone&&peoDraft.contact.phone)peoDraft.phone=peoDraft.contact.phone;
    if(!peoDraft.email&&peoDraft.contact.email)peoDraft.email=peoDraft.contact.email;
    delete peoDraft.contact;
  }
  pickColor={color:p.color,light:p.light,dark:p.dark};
  pickAvatar=p.avatar?JSON.parse(JSON.stringify(p.avatar)):{kind:"color"};
  avMode=pickAvatar.kind||"color";
  const card=$("card");
  let h='<h3 id="eh">'+(isNew?"New player":"Edit player")+'</h3>';
  h+='<div class="prev" id="eprev"></div>';
  h+='<div class="fld"><label>Name</label><input id="enm" maxlength="16" placeholder="Name" value="'+esc(p.name)+'"></div>';
  h+='<div class="fld"><label>Look</label><div class="tabs">'
    +'<button class="tab" data-m="color">Initial</button>'
    +'<button class="tab" data-m="icon">Icon</button>'
    +'<button class="tab" data-m="photo">Photo</button></div><div id="eav"></div></div>';
  h+='<div class="fld"><label>Color</label><div class="grid" id="egrid"></div>'
    +'<div class="wheelwrap"><div class="wcanvas"><canvas id="ewheel" width="160" height="160"></canvas><div class="wmarker" id="ewmarker"></div></div>'
    +'<input type="range" id="elight" min="24" max="78" value="52" class="lslider"><div class="wlabel">Tap the wheel for any custom color</div></div></div>';
  h+='<div class="abt"><div id="eabt"></div>';
  h+='<label class="tog"><input type="checkbox" id="econtoggle"'+(GN.people.contactsOn()?" checked":"")+'> Show phone &amp; email fields</label>';
  h+='<div class="note">Everything in here stays on this device. Never uploaded, never synced. '
    +'Fill in as much or as little as you like \u2014 a name on its own is a perfectly good profile.</div>';
  h+='</div>';
  if(!isNew)h+='<div class="fld"><label>Stats</label><div class="statbox" id="estats"></div></div>';
  h+='<div class="btns">';
  h+='<button class="btn primary" id="esave">'+(isNew?"Create":"Save")+'</button>';
  if(!isNew)h+='<button class="btn owner" id="eowner">Make this device&rsquo;s owner</button>';
  h+='<button class="btn ghost" id="ecancel">Cancel</button>';
  if(!isNew)h+='<button class="btn danger" id="eremove">Remove</button>';
  h+='</div>';
  card.innerHTML=h;
  // color grid
  const grid=card.querySelector("#egrid");
  GN.palette().forEach(pal=>{
    const sw=document.createElement("div");sw.className="sw"+(pal.color===pickColor.color?" sel":"");
    sw.style.background="radial-gradient(circle at 35% 30%,"+pal.light+","+pal.color+" 62%,"+pal.dark+")";
    sw.onclick=()=>{pickColor={color:pal.color,light:pal.light,dark:pal.dark};
      [...grid.children].forEach(c=>c.classList.remove("sel"));sw.classList.add("sel");
      renderAvSection();updatePreview();};
    grid.appendChild(sw);
  });
  buildWheel(card,grid);
  // avatar tabs
  [...card.querySelectorAll(".tab")].forEach(t=>t.onclick=()=>{avMode=t.dataset.m;
    if(avMode==="color")pickAvatar={kind:"color"};renderAvSection();updatePreview();});
  renderAvSection();updatePreview();
  card.querySelector("#enm").addEventListener("input",updatePreview);
  if(!isNew)renderStats(card.querySelector("#estats"),p);
  buildAbout();
  card.querySelector("#econtoggle").onchange=function(){GN.people.setContactsOn(this.checked);buildAbout();};
  card.querySelector("#esave").onclick=saveEditor;
  card.querySelector("#ecancel").onclick=closeEditor;
  if(!isNew){
    card.querySelector("#eowner").onclick=()=>{GN.profiles.setOwner(id);closeEditor();render();};
    card.querySelector("#eremove").onclick=()=>removeProfile(id,p.name);
  }
  $("ov").classList.add("show");
  setTimeout(()=>{const i=card.querySelector("#enm");if(i&&isNew)i.focus();},30);
}
function hslRGB(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12;const a=s*Math.min(l,1-l);const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return [Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)];}
function hsl2hex(h,s,l){const c=hslRGB(h,s,l),to=x=>x.toString(16).padStart(2,"0");return "#"+to(c[0])+to(c[1])+to(c[2]);}
function drawWheel(cv,L){const ctx=cv.getContext("2d"),W=cv.width,R=W/2,img=ctx.createImageData(W,W),d=img.data;
  for(let y=0;y<W;y++)for(let x=0;x<W;x++){const dx=x-R,dy=y-R,dist=Math.hypot(dx,dy),i=(y*W+x)*4;
    if(dist>R+0.5){d[i+3]=0;continue;}
    let hu=Math.atan2(dy,dx)*180/Math.PI;if(hu<0)hu+=360;
    const s=Math.min(1,dist/R)*100,c=hslRGB(hu,s,L);d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;}
  ctx.putImageData(img,0,0);}
function buildWheel(card,grid){
  const cv=card.querySelector("#ewheel"),sl=card.querySelector("#elight"),mk=card.querySelector("#ewmarker");
  if(!cv||!sl||!mk)return;let L=+sl.value;drawWheel(cv,L);
  function pick(ev){ev.preventDefault();const r=cv.getBoundingClientRect(),sx=cv.width/r.width,sy=cv.height/r.height;
    const cx=(ev.touches?ev.touches[0].clientX:ev.clientX),cy=(ev.touches?ev.touches[0].clientY:ev.clientY);
    const W=cv.width,R=W/2;let dx=(cx-r.left)*sx-R,dy=(cy-r.top)*sy-R,dist=Math.hypot(dx,dy);
    if(dist>R){dx*=R/dist;dy*=R/dist;dist=R;}
    let hu=Math.atan2(dy,dx)*180/Math.PI;if(hu<0)hu+=360;const s=Math.min(1,dist/R)*100;
    pickColor={color:hsl2hex(hu,s,L),light:hsl2hex(hu,s,Math.min(L+16,92)),dark:hsl2hex(hu,s,Math.max(L-20,8))};
    [...grid.children].forEach(c=>c.classList.remove("sel"));
    mk.style.display="block";mk.style.left=(100*(R+dx)/W)+"%";mk.style.top=(100*(R+dy)/W)+"%";mk.style.background=pickColor.color;
    renderAvSection();updatePreview();}
  let drag=false;
  cv.addEventListener("pointerdown",e=>{drag=true;pick(e);});
  cv.addEventListener("pointermove",e=>{if(drag)pick(e);});
  window.addEventListener("pointerup",()=>{drag=false;});
  sl.addEventListener("input",()=>{L=+sl.value;drawWheel(cv,L);});}
function curProfile(){const nm=(($("card").querySelector("#enm")||{}).value||"").trim();
  return {name:nm||"?",color:pickColor.color,light:pickColor.light,dark:pickColor.dark,avatar:pickAvatar};}
function updatePreview(){const prev=$("card").querySelector("#eprev");if(prev)prev.innerHTML=GN.tokenHTML(curProfile(),60);}
function renderAvSection(){
  const card=$("card");[...card.querySelectorAll(".tab")].forEach(t=>t.classList.toggle("on",t.dataset.m===avMode));
  const box=card.querySelector("#eav");if(!box)return;
  box.style.maxHeight="";box.style.overflow="";
  if(avMode==="color"){box.innerHTML='<div style="font-size:13px;color:#7a8a98;text-align:center;padding:4px;">Shows your first initial on your color.</div>';return;}
  if(avMode==="icon"){
    box.innerHTML="";box.style.maxHeight="300px";box.style.overflow="auto";
    GN.avatarSets().forEach(grp=>{
      const h=document.createElement("div");h.className="avSetLabel";h.textContent=grp.set;box.appendChild(h);
      const g=document.createElement("div");g.className="iconGrid";box.appendChild(g);
      grp.icons.forEach(a=>{const d=document.createElement("div");
        const sel=pickAvatar&&pickAvatar.kind==="icon"&&pickAvatar.icon===a.id;
        d.className="ico"+(sel?" sel":"");d.title=a.id;
        d.innerHTML=GN.tokenHTML({name:"?",color:pickColor.color,light:pickColor.light,dark:pickColor.dark,avatar:{kind:"icon",icon:a.id}},40);
        d.onclick=()=>{pickAvatar={kind:"icon",icon:a.id};renderAvSection();updatePreview();};
        g.appendChild(d);});
    });
    return;
  }
  // photo
  const has=pickAvatar&&pickAvatar.kind==="photo"&&pickAvatar.photo;
  box.innerHTML='<div style="text-align:center;"><label class="photoBtn">'+(has?"Change photo":"Choose a photo")
    +'<input type="file" accept="image/*" id="ephoto"></label>'
    +(has?' <button class="photoBtn" id="ephotoRm" style="background:#fbe7e4;color:#b23a2e;">Remove</button>':'')
    +'<div style="font-size:11.5px;color:#7a8a98;margin-top:8px;">Stored on this device, shrunk to a small square.</div></div>';
  const inp=box.querySelector("#ephoto");if(inp)inp.onchange=e=>{const fl=e.target.files&&e.target.files[0];if(fl)handlePhoto(fl);};
  const rm=box.querySelector("#ephotoRm");if(rm)rm.onclick=()=>{pickAvatar={kind:"color"};avMode="color";renderAvSection();updatePreview();};
}
function handlePhoto(file){
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();
    img.onload=()=>{let data=fr.result;
      try{const sz=128,cv=document.createElement("canvas");cv.width=cv.height=sz;const ctx=cv.getContext("2d");
        const s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;
        ctx.drawImage(img,sx,sy,s,s,0,0,sz,sz);data=cv.toDataURL("image/jpeg",0.7);}catch(e){}
      pickAvatar={kind:"photo",photo:data};avMode="photo";renderAvSection();updatePreview();};
    img.onerror=()=>{pickAvatar={kind:"photo",photo:fr.result};renderAvSection();updatePreview();};
    img.src=fr.result;};
  fr.readAsDataURL(file);
}
function renderStats(box,p){
  const ks=Object.keys(p.stats||{});
  if(!ks.length){box.innerHTML='<span class="statempty">No games recorded yet.</span>';return;}
  let h='<table>';
  ks.sort().forEach(k=>{const s=p.stats[k];
    h+='<tr><td>'+(TITLES[k]||k)+'</td><td class="r">'+(s.plays||0)+' played \u00b7 '+(s.wins||0)+' won'
      +(s.best!=null?' \u00b7 best '+s.best:'')+'</td></tr>';});
  h+='</table>';box.innerHTML=h;
}
function firstFreeColorIdx(){
  const used=new Set(GN.profiles.list().map(p=>p.color));
  const pal=GN.palette();for(let i=0;i<pal.length;i++)if(!used.has(pal[i].color))return i;
  return GN.profiles.list().length%pal.length;
}
let peoDraft={born:"",interests:[],notes:"",contact:{phone:"",email:""}};
function buildAbout(){
  const host=$("card").querySelector("#eabt"); if(!host)return;
  GN.fields.build(host,GN.schema.get("people"),peoDraft,{gates:{contacts:GN.people.contactsOn()}});
}
function saveEditor(){
  const name=($("card").querySelector("#enm").value||"").trim();
  if(!name){$("card").querySelector("#enm").focus();return;}
  let id=editId;
  if(id){GN.profiles.rename(id,name);GN.profiles.recolor(id,pickColor);}
  else{const np=GN.profiles.add(name,pickColor);if(!np){closeEditor();return;}id=np.id;GN.profiles.recolor(id,pickColor);}
  GN.profiles.setAvatar(id,pickAvatar||{kind:"color"});
  GN.people.set(id,peoDraft);
  closeEditor();render();
}
function removeProfile(id,name){
  if(GN.profiles.list().length<=1){alert("You need at least one player.");return;}
  if(confirm("Remove "+name+"? Their stats will be deleted. This can\u2019t be undone."))
    {GN.people.forget(id);GN.profiles.remove(id);closeEditor();render();}
}
function closeEditor(){$("ov").classList.remove("show");editId=null;}
$("addBtn").onclick=()=>openEditor(null);
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))closeEditor();});
render();
</script>
</body></html>
