<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Spot the Difference</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#1b120b;color:#e6ddd0;
    background-image:radial-gradient(ellipse at 50% -10%,#2a1c10,#1b120b 70%);min-height:100vh;}
  #bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#15100c;border-bottom:1px solid #3a2a1a;}
  #bar a{color:#e6ddd0;text-decoration:none;font-size:13px;border:1px solid #6e5f50;background:#2a241e;border-radius:999px;padding:6px 12px;}
  #title{font-weight:800;font-size:17px;}
  #prog{margin-left:auto;font-size:13px;color:#c9ab85;font-weight:700;}
  #wrap{max-width:520px;margin:0 auto;padding:12px;}
  #pager{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 10px;}
  #pager button{font-family:inherit;cursor:pointer;border:1px solid #6e5f50;background:#2a241e;color:#e6ddd0;border-radius:10px;padding:8px 14px;font-size:15px;font-weight:700;}
  #label{font-weight:800;font-size:18px;color:#f4c542;text-align:center;min-width:150px;}
  #found{text-align:center;font-weight:800;color:#7fd49a;margin:2px 0 8px;font-size:15px;}
  .gridlbl{text-align:center;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#c9ab85;margin:8px 0 4px;}
  .sgrid{margin:0 auto;width:max-content;background:#f3e6c7;border:3px solid #6b4f2c;border-radius:10px;
    box-shadow:0 5px 14px rgba(0,0,0,.4);padding:6px;display:grid;gap:3px;touch-action:manipulation;user-select:none;}
  .sc{background:#fbf3df;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;}
  .sc:active{transform:scale(.94);}
  .sc.found{background:#bfead0;box-shadow:inset 0 0 0 3px #2e9e5b;}
  .sc.nope{animation:nope .3s;}
  @keyframes nope{0%,100%{background:#fbf3df;}50%{background:#f3c4bb;}}
  #msg{text-align:center;color:#cfc4b4;font-size:13.5px;min-height:18px;margin:12px 4px 4px;}
  #tools{max-width:300px;margin:8px auto 0;display:flex;gap:8px;}
  #tools button{flex:1;font-family:inherit;font-weight:700;font-size:14px;padding:11px 0;border-radius:10px;
    border:1px solid #6e5f50;background:#2a241e;color:#e6ddd0;cursor:pointer;}
  .ov{position:fixed;inset:0;background:rgba(16,12,8,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:60;text-align:center;padding:22px;}
  .ov.show{display:flex;}
  .ov h1{font-size:26px;margin:0;}
  .ov p{color:#cfc4b4;max-width:330px;font-size:15px;}
  .act{font-family:inherit;font-size:15px;font-weight:bold;padding:11px 20px;border-radius:10px;border:none;
    background:#46b06a;color:#0c2014;box-shadow:0 4px 0 #1e6038;cursor:pointer;}
  html.gn-easy #title,html.gn-easy #label,html.gn-easy #found{font-size:21px;}
</style>
</head>
<body>
<div id="bar"><a href="index.html">&#8962; Shelf</a><div id="title">Spot the Difference</div><div id="prog"></div></div>
<div id="wrap">
  <div id="pager"><button id="prev">&#8249; Prev</button><div id="label"></div><button id="next">Next &#8250;</button></div>
  <div id="found"></div>
  <div class="gridlbl">Top picture</div>
  <div class="sgrid" id="gA"></div>
  <div class="gridlbl">Bottom &mdash; tap what changed</div>
  <div class="sgrid" id="gB"></div>
  <div id="msg">Tap the squares that differ between the two pictures.</div>
  <div id="tools"><button id="reset">&#8634; Start this one over</button></div>
</div>
<div class="ov" id="overlay"><div style="font-size:48px;">&#128064;</div><h1 id="ovTitle">All found!</h1><p id="ovText"></p>
  <button class="act" id="ovBtn">Next picture</button>
  <a href="index.html" style="font-size:14px;padding:9px 16px;border-radius:10px;border:1px solid #6e5f50;background:#2a241e;color:#e6ddd0;text-decoration:none;">Back to shelf</a></div>
<script src="gamenight.js?v=12"></script>
<script src="sfx.js?v=5"></script>
<script>
const COUNT=15, PKEY="shelf_spot";
const POOLS=[
 ["\uD83D\uDC36","\uD83D\uDC31","\uD83D\uDC2D","\uD83D\uDC39","\uD83D\uDC30","\uD83E\uDD8A","\uD83D\uDC3B","\uD83D\uDC3C","\uD83D\uDC28","\uD83D\uDC2F"],
 ["\uD83C\uDF4E","\uD83C\uDF4A","\uD83C\uDF4B","\uD83C\uDF4C","\uD83C\uDF49","\uD83C\uDF47","\uD83C\uDF53","\uD83E\uDED0","\uD83C\uDF51","\uD83C\uDF52"],
 ["\uD83D\uDE00","\uD83D\uDE03","\uD83D\uDE04","\uD83D\uDE01","\uD83D\uDE06","\uD83D\uDE42","\uD83D\uDE09","\uD83D\uDE0A","\uD83D\uDE0E","\uD83E\uDD29"],
 ["\uD83C\uDF38","\uD83C\uDF3C","\uD83C\uDF3B","\uD83C\uDF39","\uD83C\uDF37","\uD83C\uDF32","\uD83C\uDF33","\uD83C\uDF34","\uD83C\uDF35","\uD83C\uDF40"],
 ["\u2B50","\uD83C\uDF19","\u2600\uFE0F","\u26C5","\uD83C\uDF08","\u2744\uFE0F","\uD83D\uDD25","\uD83D\uDCA7","\u26A1","\u2601\uFE0F"]
];
function S(n){try{window.GNS&&GNS.play(n);}catch(e){}}
const gAEl=document.getElementById("gA"),gBEl=document.getElementById("gB"),
      labelEl=document.getElementById("label"),progEl=document.getElementById("prog"),foundEl=document.getElementById("found"),msgEl=document.getElementById("msg");

let pi=0,R=4,C=4,gA=[],gB=[],diffs=new Set(),found=new Set();

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function loadAll(){try{return JSON.parse(localStorage.getItem(PKEY))||{};}catch(e){return{};}}
function saveAll(o){try{localStorage.setItem(PKEY,JSON.stringify(o));}catch(e){}}

function build(seed){
  const rnd=mulberry32(seed*2654435761>>>0);
  const pool=POOLS[pi%POOLS.length];
  C=4+Math.floor(pi/3); if(C>6)C=6;
  R=4+Math.floor(pi/4); if(R>6)R=6;
  let ndiff=3+Math.floor(pi/2); if(ndiff>8)ndiff=8; // 3..8
  gA=[];for(let i=0;i<R*C;i++)gA.push(pool[Math.floor(rnd()*pool.length)]);
  gB=gA.slice();
  diffs=new Set();
  let guard=0;
  while(diffs.size<ndiff&&guard<500){guard++;
    const i=Math.floor(rnd()*R*C);
    if(diffs.has(i))continue;
    let e=pool[Math.floor(rnd()*pool.length)];let g2=0;
    while(e===gA[i]&&g2<20){e=pool[Math.floor(rnd()*pool.length)];g2++;}
    if(e===gA[i])continue;
    gB[i]=e;diffs.add(i);
  }
  found=new Set();
}
function load(i){
  pi=((i%COUNT)+COUNT)%COUNT;
  build(pi+1);
  const saved=(loadAll().f||{})[pi];
  if(saved)saved.forEach(x=>{if(diffs.has(x))found.add(x);});
  render();
}
function cellSize(){return Math.max(34,Math.min(54,Math.floor(330/C)));}
function paintGrid(el,arr){
  const sz=cellSize();
  el.style.gridTemplateColumns="repeat("+C+","+sz+"px)";el.innerHTML="";
  for(let i=0;i<R*C;i++){
    const c=document.createElement("div");c.className="sc";c.style.width=sz+"px";c.style.height=sz+"px";
    c.style.fontSize=Math.floor(sz*0.62)+"px";c.textContent=arr[i];
    if(found.has(i))c.classList.add("found");
    c.addEventListener("click",()=>tap(i,c));
    el.appendChild(c);
  }
}
function render(){
  paintGrid(gAEl,gA);paintGrid(gBEl,gB);
  const solved=Object.keys(loadAll().s||{}).length;
  labelEl.textContent="Picture "+(pi+1);
  progEl.textContent=solved+"/"+COUNT;
  foundEl.textContent="Found "+found.size+" of "+diffs.size;
  msgEl.textContent="Tap the squares that differ between the two pictures.";
}
function save(){const a=loadAll();a.pi=pi;a.f=a.f||{};a.f[pi]=[...found];a.s=a.s||{};if(found.size===diffs.size)a.s[pi]=true;saveAll(a);}
function tap(i,el){
  if(found.has(i))return;
  if(diffs.has(i)){found.add(i);S("place");save();render();
    if(found.size===diffs.size)win();
  }else{S("err");el.classList.remove("nope");void el.offsetWidth;el.classList.add("nope");}
}
function win(){
  S("win");save();
  const solved=Object.keys(loadAll().s||{}).length;progEl.textContent=solved+"/"+COUNT;
  document.getElementById("ovText").textContent="You found all "+diffs.size+" differences! "+(solved>=COUNT?"Every picture done \u2014 sharp eyes!":(solved+" of "+COUNT+" done."));
  document.getElementById("overlay").classList.add("show");
}

document.getElementById("prev").addEventListener("click",()=>{document.getElementById("overlay").classList.remove("show");load(pi-1);});
document.getElementById("next").addEventListener("click",()=>{document.getElementById("overlay").classList.remove("show");load(pi+1);});
document.getElementById("reset").addEventListener("click",()=>{found=new Set();save();render();});
document.getElementById("ovBtn").addEventListener("click",()=>{document.getElementById("overlay").classList.remove("show");load(pi+1);});

window.__spot=function(){return{R:R,C:C,diffs:[...diffs],found:[...found]};};
load(loadAll().pi||0);
</script>
</body>
</html>
