<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gem Match</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#120f1c;color:#e7e1f2;
    background-image:radial-gradient(ellipse at 50% -10%,#241a38,#120f1c 70%);min-height:100vh;}
  #bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0d0b15;border-bottom:1px solid #2e2546;}
  #bar a{color:#e7e1f2;text-decoration:none;font-size:13px;border:1px solid #5a4a86;background:#201a33;border-radius:999px;padding:6px 12px;}
  #title{font-weight:800;font-size:17px;}
  #who{margin-left:auto;font-size:12.5px;color:#c3b1e8;border:1px solid #4a3a72;background:#1b1530;border-radius:999px;padding:5px 11px;cursor:pointer;}
  #wrap{max-width:520px;margin:0 auto;padding:12px;}
  #hud{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 12px;}
  .stat{background:#1b1530;border:1px solid #352a52;border-radius:10px;padding:7px 14px;font-size:16px;font-weight:800;color:#e7defc;min-width:78px;text-align:center;}
  .stat small{display:block;font-size:10px;color:#a892d6;font-weight:700;letter-spacing:.5px;}
  #board{margin:0 auto;background:#241c3a;border:3px solid #5a4a86;border-radius:10px;
    box-shadow:0 6px 18px rgba(0,0,0,.5);position:relative;overflow:hidden;touch-action:manipulation;user-select:none;}
  .gem{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;border-radius:9px;cursor:pointer;font-weight:900;
    transition:left .19s cubic-bezier(.34,1.15,.64,1), top .26s cubic-bezier(.30,1.25,.5,1), transform .14s ease, opacity .16s ease;
    box-shadow:inset 0 2px 3px rgba(255,255,255,.35),inset 0 -3px 4px rgba(0,0,0,.3);}
  .gem.sel{outline:3px solid #fff;outline-offset:-3px;transform:scale(.84);z-index:6;}
  .gem.pop{transform:scale(.18) rotate(35deg);opacity:0;}
  .gem.pwL{box-shadow:inset 0 0 0 2px #fff,0 0 9px 1px rgba(255,255,255,.75);animation:pulseL 1s ease-in-out infinite;}
  .gem.pwB{box-shadow:inset 0 0 0 3px rgba(20,8,0,.55),0 0 10px 2px rgba(255,140,50,.8);animation:pulseB 1s ease-in-out infinite;}
  .gem.pwC{background:conic-gradient(from 0deg,#e0573a,#f4c542,#46b06a,#3a86e0,#9b5ad6,#e88fb0,#e0573a)!important;
    box-shadow:0 0 12px 2px rgba(255,255,255,.65);animation:shineC 1.6s linear infinite;}
  @keyframes pulseL{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}
  @keyframes pulseB{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
  @keyframes shineC{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.35) saturate(1.4)}}
  #flash{position:absolute;inset:0;pointer-events:none;}
  .spark{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0));pointer-events:none;
    animation:sparkFade .42s ease-out forwards;}
  @keyframes sparkFade{from{transform:scale(.3);opacity:.9}to{transform:scale(1.6);opacity:0}}
  #msg{text-align:center;color:#c5bce0;font-size:13.5px;min-height:18px;margin:12px 4px 4px;}
  #ctrl{max-width:320px;margin:12px auto 0;display:flex;gap:8px;}
  #ctrl button{flex:1;font-family:inherit;font-weight:700;font-size:14px;padding:12px 0;border-radius:10px;border:1px solid #5a4a86;background:#201a33;color:#e7e1f2;cursor:pointer;}
  .ov{position:fixed;inset:0;background:rgba(10,8,18,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:60;text-align:center;padding:22px;}
  .ov.show{display:flex;}
  .ov h1{font-size:26px;margin:0;}
  .ov p{color:#c5bce0;max-width:330px;font-size:15px;}
  .act{font-family:inherit;font-size:15px;font-weight:bold;padding:11px 20px;border-radius:10px;border:none;background:#b07ae0;color:#1a1024;box-shadow:0 4px 0 #6e3fa0;cursor:pointer;}
  html.gn-easy #title{font-size:21px;}html.gn-easy .stat{font-size:18px;}
</style>
</head>
<body>
<div id="bar"><a href="index.html">&#8962; Shelf</a><div id="title">Gem Match</div><div id="who">1 player</div></div>
<div id="wrap">
  <div id="hud">
    <div class="stat"><small>SCORE</small><span id="score">0</span></div>
    <div class="stat"><small>MOVES</small><span id="moves">20</span></div>
    <div class="stat"><small>BEST</small><span id="best">0</span></div>
  </div>
  <div id="board"><div id="flash"></div></div>
  <div id="msg">Swap two touching gems to line up three or more.</div>
  <div id="ctrl"><button id="newg">&#128260; New game</button></div>
</div>
<div class="ov" id="overlay"><div style="font-size:46px;">&#128142;</div><h1 id="ovTitle">Out of moves!</h1><p id="ovText"></p>
  <button class="act" id="ovBtn">Play again</button>
  <a href="index.html" style="font-size:14px;padding:9px 16px;border-radius:10px;border:1px solid #5a4a86;background:#201a33;color:#e7e1f2;text-decoration:none;">Back to shelf</a></div>
<script src="gamenight.js?v=12"></script>
<script src="sfx.js?v=5"></script>
<script>
const KEY="gemmatch_games", N=8, START_MOVES=20;
const COLORS=[
 {bg:"#e0573a",sym:"\u25CF"},{bg:"#3a86e0",sym:"\u25B2"},{bg:"#46b06a",sym:"\u25C6"},
 {bg:"#f4c542",sym:"\u2605"},{bg:"#9b5ad6",sym:"\u25A0"},{bg:"#e88fb0",sym:"\u271A"}
];
const POP_MS=190, FALL_MS=270;
function S(n){try{window.GNS&&GNS.play(n);}catch(e){}}
const boardEl=document.getElementById("board"),flashEl=document.getElementById("flash"),msgEl=document.getElementById("msg");
let gems=[], els=[], sel=-1, score=0, moves=START_MOVES, busy=false, over=false, best=0, who="";
let sz=40, step=43, pad=5, lastSwap=null;

function rc(i){return [Math.floor(i/N),i%N];}
function inb(r,c){return r>=0&&r<N&&c>=0&&c<N;}
function rnd(){return Math.floor(Math.random()*COLORS.length);}
function colorOf(g){return g?(g.p==="C"?-1:g.c):-2;}        // -2 empty, -1 colorbomb (matches nothing)
function readBest(){let b=0;const recs=(window.GN&&GN.readGames?GN.readGames(KEY):[])||[];for(const r of recs)if((r.score||0)>b)b=r.score;return b;}

/* ---------- match / power-up analysis ---------- */
function analyzeBoard(){
  const matched=new Set(), hRuns=[], vRuns=[];
  for(let r=0;r<N;r++){let c=0;while(c<N){const v=colorOf(gems[r*N+c]);if(v<0){c++;continue;}
    let k=c+1;while(k<N&&colorOf(gems[r*N+k])===v)k++;const len=k-c;
    if(len>=3){const cells=[];for(let x=c;x<k;x++){cells.push(r*N+x);matched.add(r*N+x);}hRuns.push({cells,len});}c=k;}}
  for(let c=0;c<N;c++){let r=0;while(r<N){const v=colorOf(gems[r*N+c]);if(v<0){r++;continue;}
    let k=r+1;while(k<N&&colorOf(gems[k*N+c])===v)k++;const len=k-r;
    if(len>=3){const cells=[];for(let x=r;x<k;x++){cells.push(x*N+c);matched.add(x*N+c);}vRuns.push({cells,len});}r=k;}}
  return {matched,hRuns,vRuns};
}
function pickCell(run){return (lastSwap!=null&&run.cells.includes(lastSwap))?lastSwap:run.cells[Math.floor(run.cells.length/2)];}
function planCreations(an){
  const creations=new Map();
  for(const run of an.hRuns.concat(an.vRuns)) if(run.len>=5) creations.set(pickCell(run),"C");
  const hc=new Set(),vc=new Set();
  an.hRuns.forEach(r=>r.cells.forEach(i=>hc.add(i)));
  an.vRuns.forEach(r=>r.cells.forEach(i=>vc.add(i)));
  for(const i of hc) if(vc.has(i)&&!creations.has(i)) creations.set(i,"B");
  for(const run of an.hRuns.concat(an.vRuns)) if(run.len===4){
    if(!run.cells.some(c=>creations.get(c)==="C"||creations.get(c)==="B")) creations.set(pickCell(run),"L");}
  return creations;
}
function dominantColor(){const cnt={};let best=0,bc=0;for(let k=0;k<N*N;k++){const v=colorOf(gems[k]);if(v>=0){cnt[v]=(cnt[v]||0)+1;if(cnt[v]>best){best=cnt[v];bc=v;}}}return bc;}
function expandClear(initial){
  const clear=new Set(initial), q=[...initial];
  while(q.length){const i=q.shift();const g=gems[i];if(!g||!g.p)continue;
    const [r,c]=rc(i);let blast=[];
    if(g.p==="L"){for(let x=0;x<N;x++){blast.push(r*N+x);blast.push(x*N+c);}}
    else if(g.p==="B"){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(inb(r+dr,c+dc))blast.push((r+dr)*N+(c+dc));}
    else if(g.p==="C"){const col=dominantColor();for(let k=0;k<N*N;k++)if(colorOf(gems[k])===col)blast.push(k);}
    for(const b of blast)if(!clear.has(b)){clear.add(b);q.push(b);}}
  return clear;
}

/* ---------- board setup ---------- */
function hasMove(){for(let i=0;i<N*N;i++){const [r,c]=rc(i);
  if(c<N-1){sw(i,i+1);const ok=analyzeBoard().matched.size>0;sw(i,i+1);if(ok)return true;}
  if(r<N-1){sw(i,i+N);const ok=analyzeBoard().matched.size>0;sw(i,i+N);if(ok)return true;}}return false;}
function sw(i,j){const t=gems[i];gems[i]=gems[j];gems[j]=t;}
function newBoard(){do{gems=new Array(N*N);for(let i=0;i<N*N;i++)gems[i]={c:rnd(),p:0};}while(analyzeBoard().matched.size>0||!hasMove());}

/* ---------- rendering (positioned tiles) ---------- */
function layout(){sz=Math.max(30,Math.min(40,Math.floor(330/N)));step=sz+3;const px=N*sz+(N-1)*3+2*pad;boardEl.style.width=px+"px";boardEl.style.height=px+"px";}
function place(el,r,c){el.style.left=(pad+c*step)+"px";el.style.top=(pad+r*step)+"px";}
function styleGem(el,g){
  el.className="gem";el.style.width=sz+"px";el.style.height=sz+"px";el.style.fontSize=Math.floor(sz*0.5)+"px";
  if(!g){el.style.background="transparent";el.textContent="";return;}
  if(g.p==="C"){el.classList.add("pwC");el.textContent="\u2756";}
  else{el.style.background=COLORS[g.c].bg;
    if(g.p==="L"){el.classList.add("pwL");el.textContent="\u2726";}
    else if(g.p==="B"){el.classList.add("pwB");el.textContent="\u2738";}
    else el.textContent=COLORS[g.c].sym;}
  el.style.color="rgba(255,255,255,.95)";
}
function makeEl(g){const el=document.createElement("div");styleGem(el,g);el.addEventListener("click",()=>{const i=els.indexOf(el);if(i>=0)tap(i);});return el;}
function buildAll(){
  // remove old gems (keep #flash)
  [...boardEl.querySelectorAll(".gem")].forEach(e=>e.remove());
  els=new Array(N*N);
  for(let i=0;i<N*N;i++){const [r,c]=rc(i);const el=makeEl(gems[i]);els[i]=el;place(el,r,c);boardEl.appendChild(el);}
}
function showSel(){for(let i=0;i<N*N;i++)if(els[i])els[i].classList.toggle("sel",i===sel);}
function sparkAt(i){const [r,c]=rc(i);const s=document.createElement("div");s.className="spark";s.style.width=sz+"px";s.style.height=sz+"px";s.style.left=(pad+c*step)+"px";s.style.top=(pad+r*step)+"px";flashEl.appendChild(s);setTimeout(()=>s.remove(),430);}

function updateHud(){document.getElementById("score").textContent=score;document.getElementById("moves").textContent=moves;document.getElementById("best").textContent=best;}
function newGame(){score=0;moves=START_MOVES;sel=-1;over=false;busy=false;lastSwap=null;best=readBest();layout();newBoard();buildAll();updateHud();msgEl.textContent="Match 3+ to clear. Match 4 \u2192 line blast, 5 \u2192 color bomb, L-shape \u2192 bomb!";}

/* ---------- interaction ---------- */
function adjacent(a,b){const [ra,ca]=rc(a),[rb,cb]=rc(b);return Math.abs(ra-rb)+Math.abs(ca-cb)===1;}
function tap(i){
  if(busy||over||!gems[i])return;
  if(sel<0){sel=i;showSel();S("tap");return;}
  if(i===sel){sel=-1;showSel();return;}
  if(!adjacent(sel,i)){sel=i;showSel();S("tap");return;}
  const a=sel;sel=-1;showSel();trySwap(a,i);
}
function swapCells(a,b){const tg=gems[a];gems[a]=gems[b];gems[b]=tg;const te=els[a];els[a]=els[b];els[b]=te;
  const [ra,ca]=rc(a),[rb,cb]=rc(b);if(els[a])place(els[a],ra,ca);if(els[b])place(els[b],rb,cb);}
function trySwap(a,b){
  busy=true;swapCells(a,b);
  const ga=gems[a],gb=gems[b],aC=ga&&ga.p==="C",bC=gb&&gb.p==="C";
  if(aC||bC){
    let seed=new Set();
    if(aC&&bC){for(let k=0;k<N*N;k++)if(gems[k])seed.add(k);}
    else{const bombCell=aC?a:b,other=aC?b:a,col=colorOf(gems[other]);
      for(let k=0;k<N*N;k++)if(colorOf(gems[k])===(col<0?dominantColor():col))seed.add(k);seed.add(bombCell);}
    lastSwap=b;moves--;S("place");resolve(seed);return;
  }
  const aP=ga&&(ga.p==="L"||ga.p==="B"),bP=gb&&(gb.p==="L"||gb.p==="B");
  const hasMatch=analyzeBoard().matched.size>0;
  if(hasMatch||aP||bP){
    let seed=new Set();if(aP)seed.add(a);if(bP)seed.add(b);
    lastSwap=b;moves--;S("place");resolve(seed.size?seed:null);return;
  }
  // invalid: slide there, then bounce back
  setTimeout(()=>{swapCells(a,b);busy=false;S("err");msgEl.textContent="No match there \u2014 try another swap.";},200);
}

/* ---------- resolve with animation ---------- */
function resolve(seed){
  busy=true;let chain=0;
  function step(){
    const an=analyzeBoard();
    const matched=new Set(an.matched);
    if(seed)seed.forEach(i=>matched.add(i));
    const creations=planCreations(an);
    const clear=expandClear(matched);
    creations.forEach((p,cell)=>clear.delete(cell));
    if(clear.size===0&&creations.size===0){busy=false;updateHud();afterResolve();return;}
    chain++;score+=clear.size*10*chain+creations.size*40;
    creations.forEach((p,cell)=>{const base=gems[cell];const color=p==="C"?0:(base?Math.max(0,colorOf(base)):0);gems[cell]={c:color,p};if(els[cell])styleGem(els[cell],gems[cell]);});
    clear.forEach(i=>{if(els[i])els[i].classList.add("pop");sparkAt(i);});
    S(chain>1?"chime":"place");updateHud();
    setTimeout(()=>{
      clear.forEach(i=>{if(els[i]){els[i].remove();els[i]=null;}gems[i]=null;});
      gravity();lastSwap=null;seed=null;
      setTimeout(step,FALL_MS);
    },POP_MS);
  }
  step();
}
function gravity(){
  for(let c=0;c<N;c++){
    let write=N-1;
    for(let r=N-1;r>=0;r--){const i=r*N+c;if(gems[i]){const w=write*N+c;
      if(w!==i){gems[w]=gems[i];els[w]=els[i];gems[i]=null;els[i]=null;if(els[w])place(els[w],write,c);}write--;}}
    let sp=1;
    for(let r=write;r>=0;r--){const i=r*N+c;const g={c:rnd(),p:0};gems[i]=g;const el=makeEl(g);els[i]=el;
      place(el,-sp,c);boardEl.appendChild(el);sp++;
      (function(e,rr,cc){setTimeout(()=>place(e,rr,cc),18);})(el,r,c);}
  }
}
function afterResolve(){
  if(moves<=0){endGame();return;}
  if(!hasMove()){newBoard();buildAll();msgEl.textContent="No moves left \u2014 board reshuffled!";}
}
function endGame(){
  over=true;const prevBest=best;
  const rec={start:Date.now(),end:Date.now(),durationMs:0,score:score,solo:true,winner:null,draw:true};
  try{if(window.GN&&GN.recordGame)GN.recordGame(KEY,rec);}catch(e){}
  best=readBest();updateHud();
  document.getElementById("ovText").textContent="You scored "+score+(score>=best&&score>prevBest?" \u2014 new best!":(". Best "+best+"."));
  document.getElementById("overlay").classList.add("show");
}

document.getElementById("newg").addEventListener("click",()=>{document.getElementById("overlay").classList.remove("show");newGame();});
document.getElementById("ovBtn").addEventListener("click",()=>{document.getElementById("overlay").classList.remove("show");newGame();});
function pickPlayer(){if(window.GN&&GN.soloStart){GN.soloStart(function(name){who=name;if(GN.whoBadge)GN.whoBadge(document.getElementById("who"),name,pickPlayer);else document.getElementById("who").textContent=name;newGame();},{title:"Gem Match"});}else newGame();}
document.getElementById("who").addEventListener("click",pickPlayer);

/* ---------- test hooks ---------- */
window.__m3=function(){return{N:N,gems:gems.map(g=>g?{c:g.c,p:g.p}:null),score:score,moves:moves,over:over,busy:busy};};
window.__setGems=function(a){gems=a.map(x=>x==null?null:(typeof x==="number"?{c:x,p:0}:{c:x.c,p:x.p||0}));sel=-1;layout();buildAll();};
window.__swap=function(a,b){trySwap(a,b);};
window.__analyze=function(){const an=analyzeBoard();return{matched:[...an.matched],creations:[...planCreations(an)]};};
window.__newGame=newGame;
pickPlayer();
</script>
</body>
</html>
