<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mazes</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#1b120b;color:#e6ddd0;
    background-image:radial-gradient(ellipse at 50% -10%,#2a1c10,#1b120b 70%);min-height:100vh;}
  #bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#15100c;border-bottom:1px solid #3a2a1a;}
  #bar a{color:#e6ddd0;text-decoration:none;font-size:13px;border:1px solid #6e5f50;background:#2a241e;border-radius:999px;padding:6px 12px;}
  #title{font-weight:800;font-size:17px;}
  #prog{margin-left:auto;font-size:13px;color:#c9ab85;font-weight:700;}
  #wrap{max-width:520px;margin:0 auto;padding:12px;}
  #pager{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 12px;}
  #pager button{font-family:inherit;cursor:pointer;border:1px solid #6e5f50;background:#2a241e;color:#e6ddd0;border-radius:10px;padding:8px 14px;font-size:15px;font-weight:700;}
  #label{font-weight:800;font-size:18px;color:#f4c542;text-align:center;min-width:160px;}
  #boardWrap{max-width:460px;margin:0 auto;background:#f3e6c7;border:3px solid #6b4f2c;border-radius:10px;
    box-shadow:0 6px 18px rgba(0,0,0,.45);padding:8px;touch-action:none;}
  canvas{display:block;width:100%;height:auto;border-radius:4px;}
  #msg{text-align:center;color:#cfc4b4;font-size:14px;min-height:20px;margin:12px 4px 6px;}
  #dpad{max-width:300px;margin:8px auto 0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;}
  #dpad button{font-family:inherit;font-weight:800;font-size:22px;padding:14px 0;border-radius:12px;
    border:1px solid #6e5f50;background:#efe2c4;color:#2a1c0c;cursor:pointer;}
  #dpad button:active{transform:translateY(1px);}
  #dpad .sp{visibility:hidden;}
  #tools{max-width:300px;margin:10px auto 0;display:flex;gap:8px;}
  #tools button{flex:1;font-family:inherit;font-weight:700;font-size:14px;padding:11px 0;border-radius:10px;
    border:1px solid #6e5f50;background:#2a241e;color:#e6ddd0;cursor:pointer;}
  #tools button:active{transform:translateY(1px);}
  .ov{position:fixed;inset:0;background:rgba(16,12,8,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:60;text-align:center;padding:22px;}
  .ov.show{display:flex;}
  .ov h1{font-size:26px;margin:0;}
  .ov p{color:#cfc4b4;max-width:330px;font-size:15px;}
  .act{font-family:inherit;font-size:15px;font-weight:bold;padding:11px 20px;border-radius:10px;border:none;
    background:#46b06a;color:#0c2014;box-shadow:0 4px 0 #1e6038;cursor:pointer;}
  html.gn-easy #title,html.gn-easy #label{font-size:21px;}
  html.gn-easy #dpad button{font-size:26px;}
</style>
</head>
<body>
<div id="bar"><a href="index.html">&#8962; Shelf</a><div id="title">Mazes</div><div id="prog"></div></div>
<div id="wrap">
  <div id="pager"><button id="prev">&#8249; Prev</button><div id="label"></div><button id="next">Next &#8250;</button></div>
  <div id="boardWrap"><canvas id="cv" width="460" height="460"></canvas></div>
  <div id="msg">Swipe or use the arrows to reach the flag.</div>
  <div id="dpad">
    <button class="sp"></button><button data-d="up">&#9650;</button><button class="sp"></button>
    <button data-d="left">&#9664;</button><button class="sp"></button><button data-d="right">&#9654;</button>
    <button class="sp"></button><button data-d="down">&#9660;</button><button class="sp"></button>
  </div>
  <div id="tools"><button id="reset">&#8634; Restart this maze</button></div>
</div>
<div class="ov" id="overlay"><div style="font-size:48px;">&#127881;</div><h1 id="ovTitle">Out!</h1><p id="ovText"></p>
  <button class="act" id="ovBtn">Next maze</button>
  <a href="index.html" style="font-size:14px;padding:9px 16px;border-radius:10px;border:1px solid #6e5f50;background:#2a241e;color:#e6ddd0;text-decoration:none;">Back to shelf</a></div>
<script src="gamenight.js?v=12"></script>
<script src="sfx.js?v=5"></script>
<script>
const COUNT=16, PKEY="shelf_maze";
function S(n){try{window.GNS&&GNS.play(n);}catch(e){}}
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),
      labelEl=document.getElementById("label"),progEl=document.getElementById("prog"),msgEl=document.getElementById("msg");

let pi=0;            // current maze
let N=9;             // grid size
let cells=[];        // wall bits per cell: bit1=N,2=E,4=S,8=W (1 means OPEN)
let px=0,py=0;       // player
let trail=[];        // visited path
let won=false;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function loadAll(){try{return JSON.parse(localStorage.getItem(PKEY))||{};}catch(e){return{};}}
function saveAll(o){try{localStorage.setItem(PKEY,JSON.stringify(o));}catch(e){}}
function markSolved(){const a=loadAll();a.pi=pi;a.s=a.s||{};a.s[pi]=true;saveAll(a);}

function idx(x,y){return y*N+x;}
function gen(seed){               // recursive backtracker
  const rnd=mulberry32(seed*2654435761>>>0);
  cells=new Array(N*N).fill(0);
  const seen=new Array(N*N).fill(false);
  const stack=[[0,0]];seen[0]=true;
  const DIRS=[[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]]; // dx,dy,openBitFromCur,openBitFromNext
  while(stack.length){
    const [x,y]=stack[stack.length-1];
    const opts=[];
    for(const [dx,dy,b,nb] of DIRS){const nx=x+dx,ny=y+dy;
      if(nx>=0&&nx<N&&ny>=0&&ny<N&&!seen[idx(nx,ny)])opts.push([nx,ny,b,nb]);}
    if(!opts.length){stack.pop();continue;}
    const [nx,ny,b,nb]=opts[Math.floor(rnd()*opts.length)];
    cells[idx(x,y)]|=b; cells[idx(nx,ny)]|=nb; seen[idx(nx,ny)]=true; stack.push([nx,ny]);
  }
}
function load(i){
  pi=((i%COUNT)+COUNT)%COUNT;
  N=Math.min(18,9+pi);          // grows, capped at 18x18
  gen(pi+1);
  px=0;py=0;trail=[[0,0]];won=false;
  draw();
  const solved=Object.keys(loadAll().s||{}).length;
  labelEl.textContent="Maze "+(pi+1)+"  \u00b7  "+N+"\u00d7"+N;
  progEl.textContent=solved+"/"+COUNT;
  msgEl.textContent="Swipe or use the arrows to reach the flag.";
}
function open(x,y,b){return (cells[idx(x,y)]&b)!==0;}
function tryMove(dir){
  if(won)return false;
  let nx=px,ny=py,b=0;
  if(dir==="up"){ny--;b=1;} else if(dir==="right"){nx++;b=2;} else if(dir==="down"){ny++;b=4;} else if(dir==="left"){nx--;b=8;}
  if(nx<0||nx>=N||ny<0||ny>=N)return false;
  if(!open(px,py,b)){S("err");return false;}
  px=nx;py=ny;
  // trail: pop if backtracking, else push
  if(trail.length>=2&&trail[trail.length-2][0]===px&&trail[trail.length-2][1]===py)trail.pop();
  else trail.push([px,py]);
  S("tap");
  draw();
  if(px===N-1&&py===N-1)win();
  return true;
}
function draw(){
  const SZ=Math.min(460, 40*N+8);
  const inner=SZ-2; const cell=inner/N;
  cv.width=SZ;cv.height=SZ;
  ctx.clearRect(0,0,SZ,SZ);
  // trail
  ctx.strokeStyle="rgba(70,160,106,.5)";ctx.lineWidth=Math.max(3,cell*0.34);ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();
  trail.forEach((p,k)=>{const cx=1+p[0]*cell+cell/2,cy=1+p[1]*cell+cell/2;if(k===0)ctx.moveTo(cx,cy);else ctx.lineTo(cx,cy);});
  ctx.stroke();
  // walls
  ctx.strokeStyle="#3a2a18";ctx.lineWidth=Math.max(1.5,cell*0.09);ctx.lineCap="square";
  ctx.beginPath();
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const X=1+x*cell,Y=1+y*cell;
    if(!open(x,y,1)){ctx.moveTo(X,Y);ctx.lineTo(X+cell,Y);}        // N
    if(!open(x,y,2)){ctx.moveTo(X+cell,Y);ctx.lineTo(X+cell,Y+cell);} // E
    if(!open(x,y,4)){ctx.moveTo(X,Y+cell);ctx.lineTo(X+cell,Y+cell);} // S
    if(!open(x,y,8)){ctx.moveTo(X,Y);ctx.lineTo(X,Y+cell);}        // W
  }
  ctx.stroke();
  // exit flag
  ctx.font=Math.floor(cell*0.7)+"px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("\uD83C\uDFC1",1+(N-1)*cell+cell/2,1+(N-1)*cell+cell/2);
  // player
  ctx.fillStyle="#c0271f";
  ctx.beginPath();ctx.arc(1+px*cell+cell/2,1+py*cell+cell/2,cell*0.28,0,7);ctx.fill();
}
function win(){
  won=true;S("win");markSolved();
  const solved=Object.keys(loadAll().s||{}).length;
  progEl.textContent=solved+"/"+COUNT;
  document.getElementById("ovText").textContent="Maze "+(pi+1)+" cleared! "+(solved>=COUNT?"Every maze solved \u2014 amazing.":(solved+" of "+COUNT+" done."));
  document.getElementById("overlay").classList.add("show");
}

// arrows
document.querySelectorAll("#dpad button[data-d]").forEach(b=>b.addEventListener("click",()=>tryMove(b.dataset.d)));
// swipe
let sx=0,sy=0,st=0;
const bw=document.getElementById("boardWrap");
bw.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();},{passive:true});
bw.addEventListener("touchend",e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
  if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?"right":"left");else tryMove(dy>0?"down":"up");},{passive:true});
// keyboard (desktop)
document.addEventListener("keydown",e=>{const m={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};if(m[e.key]){e.preventDefault();tryMove(m[e.key]);}});

document.getElementById("prev").addEventListener("click",()=>{document.getElementById("overlay").classList.remove("show");load(pi-1);});
document.getElementById("next").addEventListener("click",()=>{document.getElementById("overlay").classList.remove("show");load(pi+1);});
document.getElementById("reset").addEventListener("click",()=>{document.getElementById("overlay").classList.remove("show");px=0;py=0;trail=[[0,0]];won=false;draw();});
document.getElementById("ovBtn").addEventListener("click",()=>{document.getElementById("overlay").classList.remove("show");load(pi+1);});

window.__maze=function(){return{N:N,px:px,py:py,cells:cells,won:won};};
load(loadAll().pi||0);
</script>
</body>
</html>
