<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--accent:#b0d235;--accentSh:#7e9a1f;--text:#e8f0e4;}
  html,body{height:100%;}
  body{font-family:system-ui,sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;overflow:hidden;
    background:
      radial-gradient(80% 55% at 50% 38%,rgba(255,240,200,.05),rgba(0,0,0,0) 60%),
      repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,rgba(0,0,0,0) 1px 3px),
      repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,rgba(0,0,0,0) 1px 3px),
      radial-gradient(110% 80% at 50% 20%,#21392b 0%,#0b130e 80%);}
  #bar{width:100%;max-width:560px;display:flex;align-items:center;gap:10px;padding:10px 14px 4px;}
  #bar a{color:#cfe6d8;text-decoration:none;font-size:13px;border:1px solid #3a5a47;background:#15241b;border-radius:999px;padding:6px 12px;}
  #title{font-weight:800;font-size:17px;}
  #turn{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;}
  #dot{width:14px;height:14px;border-radius:50%;animation:dp 1.8s ease-in-out infinite;}
  @keyframes dp{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
  #wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:6px 10px;position:relative;}
  canvas{display:block;touch-action:none;}
  #domeBase{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:20%;pointer-events:none;
    background:radial-gradient(circle at 50% 38%,#cfd6de 0%,#9aa4b0 42%,#5d6873 70%,#39424c 100%);
    box-shadow:0 6px 14px rgba(0,0,0,.55),inset 0 2px 2px rgba(255,255,255,.65),inset 0 -3px 6px rgba(0,0,0,.45);}
  #domeBase::after{content:"";position:absolute;inset:7%;border-radius:16%;
    background:radial-gradient(circle at 50% 60%,#39434e 0%,#46525e 55%,#222b33 100%);
    box-shadow:inset 0 4px 10px rgba(0,0,0,.8),inset 0 -1px 2px rgba(255,255,255,.12);}
  #dome{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:none;cursor:pointer;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 50% 115%,rgba(60,110,80,.14),rgba(0,0,0,0) 55%),
      radial-gradient(circle at 38% 26%,rgba(255,255,255,.40) 0%,rgba(240,246,252,.14) 24%,rgba(215,228,240,.05) 45%,rgba(190,205,222,.04) 68%,rgba(140,160,185,.16) 88%,rgba(95,115,140,.30));
    box-shadow:inset 0 -6px 14px rgba(40,60,90,.35),inset 0 4px 8px rgba(255,255,255,.7),0 8px 18px rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;}
  #dome::before{content:"";position:absolute;left:16%;top:8%;width:36%;height:24%;border-radius:50%;z-index:3;
    background:radial-gradient(ellipse at center,rgba(255,255,255,.98),rgba(255,255,255,0) 68%);pointer-events:none;
    transform:rotate(-18deg);}
  #dome::after{content:"";position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;
    box-shadow:
      inset 0 0 0 1.5px rgba(255,255,255,.40),
      inset -6px -10px 18px rgba(30,42,58,.24),
      inset 5px 8px 14px rgba(255,255,255,.24),
      inset 0 -22px 26px -16px rgba(15,24,38,.34);
    background:
      radial-gradient(ellipse 30% 12% at 66% 78%,rgba(255,255,255,.28),rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 60% 24% at 50% 96%,rgba(120,200,160,.10),rgba(0,0,0,0) 70%);}
  #dieWrap{z-index:1;}
  #dieWrap{position:relative;will-change:transform;perspective:520px;}
  #die{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;
    transform:rotateX(-9deg) rotateY(11deg);}
  .df{position:absolute;inset:0;border-radius:11%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);
    padding:11%;backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(120,100,60,.25);}
  .dfF{background:linear-gradient(150deg,#fbf8ef 0%,#efe9da 65%,#ded6c2 100%);transform:translateZ(var(--dh));}
  .dfT{background:linear-gradient(150deg,#ffffff 0%,#f8f4ea 70%,#ece5d4 100%);transform:rotateX(90deg) translateZ(var(--dh));}
  .dfR{background:linear-gradient(150deg,#e2dac6 0%,#d2c8b0 70%,#bfb499 100%);transform:rotateY(90deg) translateZ(var(--dh));}
  .df i{border-radius:50%;background:radial-gradient(circle at 38% 32%,#3a4458,#10151f 70%);visibility:hidden;
    box-shadow:inset 0 1.5px 2px rgba(0,0,0,.55),0 .5px 0 rgba(255,255,255,.35);}
  #msg{min-height:20px;font-size:14px;color:#cfe6d8;text-align:center;padding:2px 12px;}
  #foot{padding:0 10px 14px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;max-width:540px;}
  button.act{font-family:inherit;font-size:15px;font-weight:bold;padding:9px 16px;border-radius:10px;border:none;color:#1c2b16;background:var(--accent);cursor:pointer;box-shadow:0 4px 0 var(--accentSh),0 5px 10px rgba(0,0,0,.4);}
  button.act.ghost{background:#15241b;color:#cfe6d8;box-shadow:0 4px 0 #0b160f;border:1px solid #3a5a47;font-size:13px;padding:8px 12px;white-space:nowrap;}
  #score{font-size:13px;color:#9fbdac;}
  .ov{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;background:rgba(7,12,9,.88);}
  .ov.show{display:flex;}
  .ov h1{font-size:34px;}
  #confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .cfp{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;opacity:.95;animation-name:cfall;animation-timing-function:linear;animation-fill-mode:forwards;}
  @keyframes cfall{0%{transform:translateY(-20px) rotate(0deg);}100%{transform:translateY(108vh) rotate(680deg);}}
  #ovTrophy{font-size:58px;line-height:1;}
  .ov.show #ovTrophy,.ov.show h1{animation:winpop .65s cubic-bezier(.2,1.5,.4,1) both;}
  @keyframes winpop{0%{transform:scale(.25);opacity:0;}100%{transform:scale(1);opacity:1;}}
</style>

<body>
<div id="bar"><a href="index.html">&#8962; Shelf</a><div id="title">Trouble</div><div id="turn"><div id="dot"></div><span id="turnName"></span></div></div>
<div id="wrap"><canvas id="board"></canvas><div id="domeBase"></div><button id="dome" aria-label="Pop the die"><div id="dieWrap"><div id="die"><div class="df dfF"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="df dfT"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="df dfR"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div></button></div>
<div id="msg"></div>
<div id="foot"><button class="act" id="newBtn">New game</button><div id="score"></div></div>
<div class="ov" id="overlay"><div id="confetti"></div><div id="ovTrophy">&#127942;</div><h1 id="ovTitle"></h1><p id="ovText"></p><button class="act" id="ovBtn">Play again</button><a href="index.html" style="font-size:14px;padding:9px 16px;border-radius:10px;border:1px solid #3a5a47;background:#15241b;color:#cfe6d8;text-decoration:none;">Back to shelf</a></div>

<script src="bot.js?v=1"></script>
<script src="sfx.js?v=5"></script>
<script>
const TRACK=28,FIN=4;
// Finish-lane radii as fraction of R. Innermost must clear the dome base rim (~0.52R). Tune by screenshot.
const FIN_OUTER=0.84, FIN_INNER=0.62;
let P={red:{name:"Mot",main:"#d8312b",light:"#f06a60",dark:"#8d1d19",entry:0},
         blue:{name:"Kathy",main:"#2f6fd0",light:"#6fa0ec",dark:"#194182",entry:14}};
const canvas=document.getElementById("board"),ctx=canvas.getContext("2d");
let SZ=320,R=130,pegs=[],turn="blue",die=0,phase="roll",movable=[],animFly=null,pulsing=false,GS=null,extra=false;
const KEY="trouble_games";let _mem=[];
function S(n,o){window.GNS&&GNS.play(n,0,o);}
let botLevel=null,botKey="",sixStreak=0;
const Store={load(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return _mem.slice();}},
  save(l){try{localStorage.setItem(KEY,JSON.stringify(l));}catch(e){_mem=l.slice();}}};
const PULSE=()=>0.5+0.5*Math.sin(performance.now()/280);
function fit(){SZ=Math.floor(Math.min(window.innerWidth-24,window.innerHeight-170,520));
  canvas.width=SZ;canvas.height=SZ;R=SZ*0.33; // track radius (board scaled to free corners for home trays)
  const dome=document.getElementById("dome"),d=SZ*0.30;
  dome.style.width=d+"px";dome.style.height=d+"px";
  const base=document.getElementById("domeBase");
  base.style.width=(d*1.22)+"px";base.style.height=(d*1.22)+"px";
  const dw=document.getElementById("dieWrap"),ds=d*0.46;
  dw.style.width=ds+"px";dw.style.height=ds+"px";
  dw.style.setProperty("--dh",(ds/2)+"px");
  render();}
function holeXY(i){const a=-Math.PI/2+i/TRACK*2*Math.PI;return{x:SZ/2+R*Math.cos(a),y:SZ/2+R*Math.sin(a)};}
function finXY(color,i){const e=P[color].entry,a=-Math.PI/2+e/TRACK*2*Math.PI;
  const rr=R*(FIN_OUTER-(FIN_OUTER-FIN_INNER)*i/(FIN-1));return{x:SZ/2+rr*Math.cos(a),y:SZ/2+rr*Math.sin(a)};}
// Home pocket: 2x2 cluster beside each player's entry. Tune HOME_ANG (how far around
// from the entry), HOME_R (cluster center radius), HOME_GAP (peg spacing) by screenshot.
// Off-board home trays in the canvas corners. Tunables:
const HOME_POS={red:[0.115,0.115],blue:[0.885,0.885]}; // tray centers (fraction of SZ)
const HOME_GAP=0.075, TRAY_S=0.175;                    // peg spacing, tray size
function homeXY(color,i){const hp=HOME_POS[color],cx=SZ*hp[0],cy=SZ*hp[1];
  const col=i%2,row=(i/2)|0,g=SZ*HOME_GAP;
  return{x:cx+(col-0.5)*g,y:cy+(row-0.5)*g};}
function drawHomeTray(color){const hp=HOME_POS[color],cx=SZ*hp[0],cy=SZ*hp[1],ts=SZ*TRAY_S;
  ctx.save();
  // tray shadow + molded slate pad
  ctx.fillStyle="rgba(0,0,0,.38)";rr(cx-ts/2+SZ*0.008,cy-ts/2+SZ*0.012,ts,ts,ts*0.22);ctx.fill();
  const g=ctx.createLinearGradient(cx,cy-ts/2,cx,cy+ts/2);
  g.addColorStop(0,"#39434d");g.addColorStop(0.5,"#2b343d");g.addColorStop(1,"#1c2329");
  ctx.fillStyle=g;rr(cx-ts/2,cy-ts/2,ts,ts,ts*0.22);ctx.fill();
  ctx.lineWidth=1.4;ctx.strokeStyle="rgba(255,255,255,.18)";rr(cx-ts/2,cy-ts/2,ts,ts,ts*0.22);ctx.stroke();
  // player-color inner accent
  ctx.lineWidth=2;ctx.strokeStyle=P[color].main;ctx.globalAlpha=0.55;
  rr(cx-ts/2+3,cy-ts/2+3,ts-6,ts-6,ts*0.18);ctx.stroke();ctx.globalAlpha=1;
  // four dimple wells
  for(let i=0;i<4;i++){const w=homeXY(color,i);drawHole(w.x,w.y,SZ*0.026,null);}
  ctx.restore();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function pegXY(p){if(p.loc.state==="home")return homeXY(p.color,p.hi);
  if(p.loc.state==="track")return holeXY(p.loc.idx);return finXY(p.color,p.loc.i);}
function seatFrom(p,seat){return Object.assign({},seat,{name:p.name,main:p.color,light:p.light,dark:p.dark});}
function newGame(){pegs=[];for(const c of["red","blue"])for(let i=0;i<4;i++)pegs.push({color:c,hi:i,t:0,loc:{state:"home"}});
  die=0;phase="over";movable=[];animFly=null;extra=false;
  document.getElementById("overlay").classList.remove("show");document.getElementById("confetti").innerHTML="";render();
  GN.matchStart(function(m){P={red:seatFrom(m.a,P.red),blue:seatFrom(m.b,P.blue)};
    botLevel=m.vsComputer?(m.bot||"medium"):null;botKey="";
    turn=(m.first===m.a)?"red":"blue";phase="roll";
    GS={start:Date.now(),flipWinner:m.first.name,pops:{},bumps:{}};
    GS.pops[m.a.name]=0;GS.pops[m.b.name]=0;GS.bumps[m.a.name]=0;GS.bumps[m.b.name]=0;
    updateBar();setMessage(P[turn].name+" pops first");render();},{bot:true});}
function setMessage(t){document.getElementById("msg").textContent=t;}
function updateBar(){const pc=P[turn];document.getElementById("turnName").textContent=pc.name+"'s turn";
  const d=document.getElementById("dot");
  d.style.background="radial-gradient(circle at 35% 30%,"+pc.light+","+pc.main+" 70%,"+pc.dark+")";
  d.style.boxShadow="0 0 0 3px rgba(255,255,255,.15),0 0 14px "+pc.main;
  const g=Store.load();let m=0,k=0;for(const r of g){if(r.winner===P.red.name)m++;else if(r.winner===P.blue.name)k++;}
  document.getElementById("score").textContent="Mot "+m+" \u00b7 "+k+" Kathy";}
function occTrack(idx){return pegs.find(p=>p.loc.state==="track"&&p.loc.idx===idx)||null;}
function moveOf(p,n){ // returns {to,bump}|null
  if(p.loc.state==="fin"){const j=p.loc.i+n;if(j>=FIN)return null;
    if(pegs.find(q=>q.color===p.color&&q.loc.state==="fin"&&q.loc.i===j))return null;
    return{to:{state:"fin",i:j},bump:null,t:TRACK+j};}
  if(p.loc.state==="home"){if(n!==6)return null;const idx=P[p.color].entry,o=occTrack(idx);
    if(o&&o.color===p.color)return null;return{to:{state:"track",idx},bump:o,t:0};}
  const t=p.t+n;
  if(t<TRACK){const idx=(P[p.color].entry+t)%TRACK,o=occTrack(idx);
    if(o&&o.color===p.color)return null;return{to:{state:"track",idx},bump:o,t};}
  const f=t-TRACK;if(f>=FIN)return null;
  if(pegs.find(q=>q.color===p.color&&q.loc.state==="fin"&&q.loc.i===f))return null;
  return{to:{state:"fin",i:f},bump:null,t};}
function rollDie(){if(phase!=="roll"||animFly)return;
  const dome=document.getElementById("dome"),dieEl=document.getElementById("die");
  GS.pops[P[turn].name]++;S("pop");
  // dome: press down, spring back with overshoot
  dome.animate([
    {transform:"translate(-50%,-50%) scale(1,1)"},
    {transform:"translate(-50%,-50%) scale(1.04,0.82)",offset:0.18},
    {transform:"translate(-50%,-50%) scale(0.97,1.08)",offset:0.5},
    {transform:"translate(-50%,-50%) scale(1.02,0.98)",offset:0.74},
    {transform:"translate(-50%,-50%) scale(1,1)"}
  ],{duration:560,easing:"cubic-bezier(.3,.7,.3,1)"});
  // wrap jumps; cube inside tumbles in 3D — randomized every pop
  const wrap=document.getElementById("dieWrap");
  const H=wrap.offsetHeight,jump=-(H*(0.8+Math.random()*0.5));
  const drift=(Math.random()*2-1)*H*0.34;
  const sgn=()=>Math.random()<0.5?-1:1;
  const RX=sgn()*(360+Math.floor(Math.random()*2)*360),RY=sgn()*(360+Math.floor(Math.random()*2)*360);
  wrap.animate([
    {transform:"translate(0,0) scale(1,1)"},
    {transform:"translate(0,"+(H*0.16)+"px) scale(1.12,0.72)",offset:0.12},
    {transform:"translate("+drift+"px,"+jump+"px) scale(0.96,1.04)",offset:0.44,easing:"cubic-bezier(.2,.9,.4,1)"},
    {transform:"translate("+(drift*0.4)+"px,0) scale(1.1,0.86)",offset:0.7,easing:"cubic-bezier(.5,0,.8,.4)"},
    {transform:"translate(0,"+(jump*0.16)+"px) scale(1,1)",offset:0.85},
    {transform:"translate(0,0) scale(1,1)"}
  ],{duration:640,easing:"linear"});
  dieEl.animate([
    {transform:"rotateX(-9deg) rotateY(11deg)"},
    {transform:"rotateX("+(-9+RX*0.55)+"deg) rotateY("+(11+RY*0.55)+"deg)",offset:0.45,easing:"cubic-bezier(.25,.8,.5,1)"},
    {transform:"rotateX("+(-9+RX)+"deg) rotateY("+(11+RY)+"deg)",offset:0.86,easing:"cubic-bezier(.3,.7,.4,1)"},
    {transform:"rotateX("+(-9+RX)+"deg) rotateY("+(11+RY)+"deg)"}
  ],{duration:640,easing:"linear"});
  let n=0;const iv=setInterval(()=>{showDie(1+Math.floor(Math.random()*6));if(++n>=9){clearInterval(iv);
    die=1+Math.floor(Math.random()*6);showDie(die);if(!GN.friendly)GN.g.addDice([die]);afterRoll();}},58);}
const DRING={1:[2,3],2:[1,4],3:[1,2],4:[1,5],5:[1,3],6:[2,4]};
const PIPON={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function faceSet(face,v){const els=face.querySelectorAll("i"),on=PIPON[v];
  els.forEach((p,idx)=>{p.style.visibility=on.includes(idx)?"visible":"hidden";});}
function showDie(v){
  faceSet(document.querySelector(".dfF"),v);
  faceSet(document.querySelector(".dfT"),DRING[v][0]);
  faceSet(document.querySelector(".dfR"),DRING[v][1]);}
function afterRoll(){extra=(die===6);
  if(die===6){sixStreak++;S("six",sixStreak-1);}
  movable=pegs.filter(p=>p.color===turn&&moveOf(p,die));
  if(!movable.length){setMessage(P[turn].name+" rolled "+die+" \u2014 no moves");S("womp");
    setTimeout(()=>{if(extra){phase="roll";setMessage(P[turn].name+" rolled 6, pop again!");}else passTurn();},900);
    phase="wait";render();return;}
  phase="move";setMessage(P[turn].name+" rolled "+die+" \u2014 tap a glowing peg");render();ensurePulse();}
function passTurn(){turn=turn==="red"?"blue":"red";die=0;phase="roll";movable=[];sixStreak=0;
  updateBar();setMessage(P[turn].name+" \u2014 pop the die");render();}
function doMove(p){const mv=moveOf(p,die);if(!mv)return;S("move");
  phase="anim";const from=pegXY(p),to=(mv.to.state==="track")?holeXY(mv.to.idx):finXY(p.color,mv.to.i);
  animFly={p,from,to,k:0};const t0=performance.now();
  (function step(ts){animFly.k=Math.min(1,(ts-t0)/300);render();
    if(animFly.k<1){requestAnimationFrame(step);return;}
    if(mv.bump){S("bump");mv.bump.loc={state:"home"};mv.bump.t=0;GS.bumps[P[turn].name]++;if(!GN.friendly)GN.g.addSentHome(1);setMessage(P[turn].name+" bumped "+P[mv.bump.color].name+"!");}
    if(mv.to.state==="fin")S("chime");
    p.loc=mv.to;p.t=mv.t;animFly=null;
    if(pegs.filter(q=>q.color===turn&&q.loc.state==="fin").length===4){gameOver(turn);return;}
    if(extra){phase="roll";setMessage(P[turn].name+" rolled 6 \u2014 pop again!");render();return;}
    passTurn();})(t0);}
function drawHole(x,y,r,fill){
  // surface AO halo
  const halo=ctx.createRadialGradient(x,y,r*0.7,x,y,r*1.45);
  halo.addColorStop(0,"rgba(50,45,35,.34)");halo.addColorStop(1,"rgba(0,0,0,0)");
  ctx.beginPath();ctx.arc(x,y,r*1.6,0,7);ctx.fillStyle=halo;ctx.fill();
  // bore: deep at top-left wall (light from top-left), wall catches light at bottom-right
  const g=ctx.createRadialGradient(x-r*0.28,y-r*0.32,r*0.1,x,y,r);
  g.addColorStop(0,"rgba(4,5,7,.94)");g.addColorStop(0.6,fill?fill:"rgba(16,18,22,.78)");g.addColorStop(1,"rgba(34,36,40,.55)");
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=g;ctx.fill();
  // inner-wall light catch (lower-right crescent)
  ctx.strokeStyle="rgba(255,245,220,.30)";ctx.lineWidth=r*0.22;
  ctx.beginPath();ctx.arc(x,y,r*0.82,Math.PI*0.12,Math.PI*0.62);ctx.stroke();
  // crisp top edge
  ctx.strokeStyle="rgba(60,45,25,.45)";ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();}
function drawPeg(x,y,color,glow){const pc=P[color],r=SZ*0.030;
  ctx.save();
  if(glow!==undefined){ctx.shadowColor="#f7f3da";ctx.shadowBlur=SZ*0.03*glow;}
  // grounded shadow: tight dark core + soft spread, offset by the key light
  ctx.beginPath();ctx.ellipse(x+r*0.45,y+r*1.18,r*1.15,r*0.42,0,0,7);ctx.fillStyle="rgba(0,0,0,.16)";ctx.fill();
  ctx.beginPath();ctx.ellipse(x+r*0.2,y+r*1.12,r*0.75,r*0.3,0,0,7);ctx.fillStyle="rgba(0,0,0,.34)";ctx.fill();
  // body cone
  const g=ctx.createLinearGradient(x-r,y,x+r,y);
  g.addColorStop(0,pc.dark);g.addColorStop(0.32,pc.main);g.addColorStop(0.48,pc.light);g.addColorStop(0.66,pc.main);g.addColorStop(1,pc.dark);
  ctx.beginPath();ctx.moveTo(x-r*0.8,y+r);ctx.quadraticCurveTo(x-r*0.5,y-r*0.2,x-r*0.34,y-r*0.7);
  ctx.lineTo(x+r*0.34,y-r*0.7);ctx.quadraticCurveTo(x+r*0.5,y-r*0.2,x+r*0.8,y+r);ctx.closePath();
  ctx.fillStyle=g;ctx.fill();
  // base ellipse (foot of the cone)
  ctx.beginPath();ctx.ellipse(x,y+r,r*0.8,r*0.22,0,0,7);
  const bg2=ctx.createLinearGradient(x-r,y,x+r,y);
  bg2.addColorStop(0,pc.dark);bg2.addColorStop(0.5,pc.main);bg2.addColorStop(1,pc.dark);
  ctx.fillStyle=bg2;ctx.fill();
  // vertical sheen on the lit flank
  ctx.beginPath();ctx.moveTo(x-r*0.38,y+r*0.7);ctx.quadraticCurveTo(x-r*0.28,y-r*0.1,x-r*0.2,y-r*0.62);
  ctx.lineTo(x-r*0.1,y-r*0.62);ctx.quadraticCurveTo(x-r*0.16,y-r*0.05,x-r*0.22,y+r*0.7);ctx.closePath();
  ctx.fillStyle="rgba(255,255,255,.34)";ctx.fill();
  // head sphere with hotspot + core shading
  const hg=ctx.createRadialGradient(x-r*0.22,y-r*1.16,r*0.06,x,y-r*0.95,r*0.58);
  hg.addColorStop(0,"#ffffff");hg.addColorStop(0.18,pc.light);hg.addColorStop(0.62,pc.main);hg.addColorStop(1,pc.dark);
  ctx.beginPath();ctx.arc(x,y-r*0.95,r*0.55,0,7);ctx.fillStyle=hg;ctx.fill();
  // rim light on shadow side of head
  ctx.strokeStyle="rgba(255,240,210,.30)";ctx.lineWidth=r*0.09;
  ctx.beginPath();ctx.arc(x,y-r*0.95,r*0.5,Math.PI*0.15,Math.PI*0.55);ctx.stroke();
  ctx.restore();}
function render(){ctx.clearRect(0,0,SZ,SZ);
  const CX=SZ/2,CY=SZ/2;
  // cast shadow on the table
  ctx.fillStyle="rgba(0,0,0,.42)";
  ctx.beginPath();ctx.ellipse(CX+SZ*0.012,CY+SZ*0.022,SZ*0.43,SZ*0.425,0,0,7);ctx.fill();
  // outer rim: molded slate plastic
  const rimO=SZ*0.43,rimI=SZ*0.389;
  const rg=ctx.createRadialGradient(CX,CY,rimI,CX,CY,rimO);
  rg.addColorStop(0,"#262e36");rg.addColorStop(0.45,"#3e4a55");rg.addColorStop(0.8,"#2c353e");rg.addColorStop(1,"#171d23");
  ctx.beginPath();ctx.arc(CX,CY,rimO,0,7);ctx.arc(CX,CY,rimI,0,7,true);
  ctx.fillStyle=rg;ctx.fill("evenodd");
  // rim specular arc (key light top-left) + shade arc
  ctx.lineWidth=(rimO-rimI)*0.5;ctx.lineCap="round";
  ctx.strokeStyle="rgba(255,255,255,.22)";
  ctx.beginPath();ctx.arc(CX,CY,(rimO+rimI)/2,Math.PI*1.05,Math.PI*1.55);ctx.stroke();
  ctx.strokeStyle="rgba(0,0,0,.30)";
  ctx.beginPath();ctx.arc(CX,CY,(rimO+rimI)/2,Math.PI*0.08,Math.PI*0.5);ctx.stroke();
  // rim edges
  ctx.lineWidth=1.4;ctx.strokeStyle="rgba(255,255,255,.28)";
  ctx.beginPath();ctx.arc(CX,CY,rimO,0,7);ctx.stroke();
  ctx.strokeStyle="rgba(0,0,0,.5)";
  ctx.beginPath();ctx.arc(CX,CY,rimI,0,7);ctx.stroke();
  // deck: warm plastic with machining rings
  const g=ctx.createRadialGradient(CX-SZ*0.08,CY-SZ*0.12,SZ*0.08,CX,CY,rimI);
  g.addColorStop(0,"#f7f3ea");g.addColorStop(0.55,"#ece4d3");g.addColorStop(0.85,"#dcd2bc");g.addColorStop(1,"#c4b89e");
  ctx.beginPath();ctx.arc(CX,CY,rimI,0,7);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle="rgba(120,100,70,.10)";ctx.lineWidth=1;
  for(let q=1;q<=4;q++){ctx.beginPath();ctx.arc(CX,CY,rimI*q/4.6,0,7);ctx.stroke();}
  // texture: fine concentric lathe grain + faint radial brush strokes
  ctx.strokeStyle="rgba(110,92,64,.05)";
  for(let q=0;q<14;q++){ctx.beginPath();ctx.arc(CX,CY,rimI*(0.18+0.058*q),0,7);ctx.stroke();}
  ctx.strokeStyle="rgba(90,75,50,.045)";
  for(let q=0;q<36;q++){const a=q/36*Math.PI*2+0.07;
    ctx.beginPath();ctx.moveTo(CX+rimI*0.24*Math.cos(a),CY+rimI*0.24*Math.sin(a));
    ctx.lineTo(CX+rimI*0.97*Math.cos(a),CY+rimI*0.97*Math.sin(a));ctx.stroke();}
  // AO where deck meets rim
  const ao=ctx.createRadialGradient(CX,CY,rimI*0.86,CX,CY,rimI);
  ao.addColorStop(0,"rgba(0,0,0,0)");ao.addColorStop(1,"rgba(60,40,15,.30)");
  ctx.beginPath();ctx.arc(CX,CY,rimI,0,7);ctx.fillStyle=ao;ctx.fill();
  // colored quadrants near entries
  for(const c of["red","blue"]){const pc=P[c],e=pc.entry;
    ctx.save();ctx.beginPath();ctx.arc(SZ/2,SZ/2,SZ*0.389,-Math.PI/2+(e-3.4)/TRACK*2*Math.PI,-Math.PI/2+(e+3.4)/TRACK*2*Math.PI);
    ctx.arc(SZ/2,SZ/2,R*0.62,-Math.PI/2+(e+3.4)/TRACK*2*Math.PI,-Math.PI/2+(e-3.4)/TRACK*2*Math.PI,true);
    ctx.closePath();
    const wg=ctx.createRadialGradient(SZ/2,SZ/2,R*0.62,SZ/2,SZ/2,SZ*0.389);
    wg.addColorStop(0,pc.light+"2e");wg.addColorStop(0.6,pc.main+"4a");wg.addColorStop(1,pc.main+"30");
    ctx.fillStyle=wg;ctx.fill();
    ctx.globalAlpha=0.5;ctx.strokeStyle=pc.main;ctx.lineWidth=1.4;ctx.stroke();
    ctx.globalAlpha=0.14;ctx.fillStyle="#ffffff";
    ctx.beginPath();ctx.arc(SZ/2,SZ/2,SZ*0.389,-Math.PI/2+(e-3.4)/TRACK*2*Math.PI,-Math.PI/2+(e-1.2)/TRACK*2*Math.PI);
    ctx.arc(SZ/2,SZ/2,R*0.78,-Math.PI/2+(e-1.2)/TRACK*2*Math.PI,-Math.PI/2+(e-3.4)/TRACK*2*Math.PI,true);
    ctx.closePath();ctx.fill();
    ctx.restore();}
  drawHomeTray("red");drawHomeTray("blue");
  // track holes
  for(let i=0;i<TRACK;i++){const h=holeXY(i);
    const isEntry=(i===P.red.entry)?P.red:(i===P.blue.entry)?P.blue:null;
    drawHole(h.x,h.y,SZ*0.026,isEntry?isEntry.main+"55":null);}
  // finish + home holes
  for(const c of["red","blue"]){for(let i=0;i<FIN;i++){const f=finXY(c,i);drawHole(f.x,f.y,SZ*0.024,P[c].main+"44");}
    for(let i=0;i<4;i++){const h=homeXY(c,i);drawHole(h.x,h.y,SZ*0.024,P[c].main+"33");}}
  // pegs
  const pu=PULSE();
  for(const p of pegs){if(animFly&&animFly.p===p)continue;const xy=pegXY(p);
    const mv=(phase==="move"&&movable.includes(p));
    drawPeg(xy.x,xy.y,p.color,mv?pu*1.4:undefined);
    if(mv){ctx.save();ctx.strokeStyle="#f7f3da";ctx.globalAlpha=0.5+0.45*pu;
      ctx.lineWidth=Math.max(2,SZ*0.008);ctx.beginPath();ctx.arc(xy.x,xy.y-SZ*0.012,SZ*(0.042+0.005*pu),0,7);ctx.stroke();ctx.restore();}}
  if(animFly){const a=animFly.from,b=animFly.to,k=animFly.k,e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    drawPeg(a.x+(b.x-a.x)*e,a.y+(b.y-a.y)*e-Math.sin(k*Math.PI)*SZ*0.04,animFly.p.color);}}
function ensurePulse(){if(pulsing)return;pulsing=true;
  (function tick(){if(phase!=="move"){pulsing=false;render();return;}render();requestAnimationFrame(tick);})();}
canvas.addEventListener("pointerup",e=>{if(phase!=="move")return;
  if(botLevel&&turn==="blue")return;
  const rect=canvas.getBoundingClientRect(),f=canvas.width/rect.width;
  const x=(e.clientX-rect.left)*f,y=(e.clientY-rect.top)*f;
  let best=null,bd=1e9;
  for(const p of movable){const xy=pegXY(p),d=Math.hypot(x-xy.x,y-xy.y);
    if(d<SZ*0.09&&d<bd){bd=d;best=p;}}
  if(best)doMove(best);});
document.getElementById("dome").addEventListener("click",()=>{if(botLevel&&turn==="blue")return;rollDie();});
// ---------- computer opponent (drives the blue seat) ----------
function botPick(){
  const opts=movable.map(p=>({p,mv:moveOf(p,die)})).filter(o=>o.mv);
  if(!opts.length)return null;
  if(botLevel==="easy")return opts[Math.floor(Math.random()*opts.length)].p;
  let best=null,bs=-1e9;
  for(const o of opts){let s=0;
    if(o.mv.bump)s+=100;
    if(o.mv.to.state==="fin"&&o.p.loc.state!=="fin")s+=80;
    if(o.p.loc.state==="home")s+=40;
    s+=o.p.t;
    if(o.mv.to.state==="fin")s+=10+o.mv.to.i*2;
    if(botLevel==="hard"&&o.mv.to.state==="track"){
      let danger=false;
      for(const q of pegs)if(q.color==="red"&&q.loc.state==="track"){
        const d=(o.mv.to.idx-q.loc.idx+TRACK)%TRACK;if(d>=1&&d<=6)danger=true;}
      if(danger)s-=20;else s+=25;}
    s+=Math.random()*3;
    if(s>bs){bs=s;best=o.p;}}
  return best;}
setInterval(()=>{
  if(!botLevel||turn!=="blue"||animFly||phase==="over"||phase==="anim"||phase==="wait")return;
  const k=phase+":"+die+":"+pegs.map(p=>p.t+p.loc.state+(p.loc.i||0)+(p.loc.idx||0)).join(",");
  if(k===botKey)return;botKey=k;
  if(phase==="roll")setTimeout(()=>{if(phase==="roll"&&turn==="blue"&&botLevel)rollDie();},700);
  else if(phase==="move")setTimeout(()=>{if(phase==="move"&&turn==="blue"&&botLevel){const p=botPick();if(p)doMove(p);}},750);
},250);
function gameOver(winColor){phase="over";S("fanfare");
  const rec={start:GS.start,end:Date.now(),durationMs:Date.now()-GS.start,
    winner:P[winColor].name,loser:P[winColor==="red"?"blue":"red"].name,flipWinner:GS.flipWinner,pops:GS.pops,bumps:GS.bumps};
  GN.recordGame(KEY,rec);
  document.getElementById("ovTitle").textContent=P[winColor].name+" wins!";
  document.getElementById("ovTitle").style.color=P[winColor].main;
  document.getElementById("ovText").textContent="All four pegs home \u00b7 "+GS.bumps[P[winColor].name]+" bumps dealt";
  spawnConfetti(winColor);updateBar();
  setTimeout(()=>document.getElementById("overlay").classList.add("show"),500);}
function spawnConfetti(color){const box=document.getElementById("confetti");box.innerHTML="";const pc=P[color];
  const cols=[pc.main,pc.light,"#f4c542","#ffffff"];
  for(let i=0;i<90;i++){const d=document.createElement("div");d.className="cfp";
    d.style.left=(Math.random()*100)+"%";d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2.4+Math.random()*1.8)+"s";d.style.animationDelay=(Math.random()*0.9)+"s";
    d.style.transform="rotate("+Math.floor(Math.random()*360)+"deg)";box.appendChild(d);}}
document.getElementById("newBtn").addEventListener("click",newGame);
GN.rulesButton(document.getElementById("foot"),{title:"Trouble",sections:[
 {h:"Goal",t:"Race all four of your pegs from your home tray, once around the track, and up your finish lane. First player to get all four pegs into the finish wins."},
 {h:"The Pop-O-Matic",t:"Tap the dome in the middle to pop the die \u2014 that's your roll. No dice to lose under the couch since 1965."},
 {h:"Getting out",t:"Pegs start OFF the board in your corner tray. You need to pop a 6 to bring a peg out onto your starting spot. No 6 and no pegs on the track? Your turn is lost.",
  ex:"You pop a 4 but all four pegs are still in your tray \u2014 nothing can move, turn over. Pop a 6 and a peg comes out AND you pop again!"},
 {h:"Pop a 6",t:"Every 6 gives you another pop after you move. Chain them \u2014 the celebration sound gets bigger with every 6 in a row."},
 {h:"Bumping",svg:'<svg viewBox="0 0 280 70"><circle cx="40" cy="35" r="14" fill="#2f6fd0"/><circle cx="140" cy="35" r="14" fill="#d8312b"/><path d="M62 35 H112" stroke="#f4c542" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f4c542"/></marker></defs><path d="M150 28 Q190 0 232 24" stroke="#d8312b" stroke-width="2.5" fill="none" stroke-dasharray="4 4"/><polygon points="228,16 238,26 224,28" fill="#d8312b"/><text x="196" y="62" fill="#cfe6d8" font-size="11" font-family="system-ui">bumped back to the tray!</text></svg>',
  t:"Land exactly on an opponent's peg and it gets bumped all the way back to their home tray \u2014 they'll need a 6 to come out again. You can never land on your OWN peg."},
 {h:"The finish lane",t:"After a full lap, your pegs turn up your colored finish lane. You need the exact count to step into each finish spot \u2014 overshooting isn't allowed, so a peg can be stuck waiting for the right roll."},
 {h:"vs Computer",t:"The vs Computer button lets the computer take the second player's seat: Easy plays loose (great for learning), Medium plays solid priorities, Hard also dodges your likely bumps."}]});
GN.statsButton(document.getElementById("foot"),{title:"Trouble",key:KEY,specials:[
  {label:"Bumps dealt",of:(r,n)=>r.reduce((a,x)=>a+((x.bumps&&x.bumps[n])||0),0)},
  {label:"Pops taken",of:(r,n)=>r.reduce((a,x)=>a+((x.pops&&x.pops[n])||0),0)},
  {label:"Coin flips won",of:(r,n)=>r.filter(x=>x.flipWinner===n).length}]});
/* difficulty is now chosen in the player picker (vs Computer) */
if(window.GNS)GNS.button(document.getElementById("foot"));

window.addEventListener("resize",fit);
fit();newGame();showDie(6);
