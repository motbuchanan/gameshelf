<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Buzz</title>
<style>
  :root{ --ink:#1c1f26; --bg:#f2f0ea; --accent:#e0533d; --ok:#2f9e6f; --line:#cdd3da; --armed:#2f9e6f; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:22px;text-align:center;gap:16px;overflow:hidden}
  #ver{position:fixed;top:10px;right:10px;font-size:11px;font-weight:700;color:#8a919b;
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 9px;cursor:pointer}
  h1{font-size:16px;font-weight:800;letter-spacing:.28em;margin:0;color:#8a919b}

  /* name screen */
  #nameScreen{display:flex;flex-direction:column;gap:16px;align-items:center;width:100%;max-width:320px}
  #nameInput{font-size:20px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;
    width:100%;text-align:center;background:#fff;color:var(--ink)}
  #joinBtn{border:none;border-radius:14px;background:var(--ink);color:#fff;font-size:19px;
    font-weight:800;padding:16px 34px;cursor:pointer;width:100%}
  .tip{font-size:12.5px;color:#5a636e;line-height:1.4}

  /* game screen */
  #gameScreen{display:none;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:360px}
  #buzzBtn{border:none;border-radius:50%;width:230px;height:230px;font-size:40px;font-weight:900;
    letter-spacing:.06em;color:#fff;background:var(--armed);cursor:pointer;
    box-shadow:0 12px 30px #0003, inset 0 -8px 0 #0002;transition:transform .06s, background .15s}
  #buzzBtn:active{transform:scale(.96)}
  #buzzBtn.locked{background:#9aa2ac;box-shadow:0 6px 18px #0002}
  #winner{font-size:26px;font-weight:900;min-height:34px;line-height:1.1}
  #winner.you{color:var(--ok)}
  #winner.them{color:var(--accent)}
  #resetBtn{border:none;border-radius:12px;background:#fff;border:2px solid var(--ink);color:var(--ink);
    font-size:16px;font-weight:800;padding:12px 26px;cursor:pointer}
  .meta{font-size:12px;color:#8a919b;display:flex;gap:14px}
  #status{font-size:12px;color:#8a919b;min-height:18px;max-width:340px;line-height:1.35}
  #status.err{color:var(--accent);font-weight:700}
  @media (prefers-reduced-motion: reduce){#buzzBtn{transition:none}}
</style>
</head>
<body>
  <div id="ver">Buzz v0.3</div>
  <h1>B U Z Z</h1>

  <div id="nameScreen">
    <div class="tip">Type your name, then Join. Do this on every phone that plays.</div>
    <input id="nameInput" placeholder="your name" maxlength="14" autocomplete="off">
    <button id="joinBtn">Join</button>
    <div class="tip">Everyone on this link plays the same round.</div>
  </div>

  <div id="gameScreen">
    <div id="winner"></div>
    <button id="buzzBtn">BUZZ</button>
    <button id="resetBtn">New round</button>
    <div class="meta"><span id="youAre"></span><span id="roundNo"></span></div>
    <div id="status">Connecting...</div>
  </div>

<script type="module">
  // ============================================================
  //  Buzz - first tap wins, everyone else locks out.
  //  Shared data model: one document buzz/room = { winner, round }
  //    winner "" (empty) = armed, first to write their name wins
  //    round = a counter the host bumps to start a fresh round
  //  New concept here vs the toy: a TRANSACTION. It reads winner
  //  and only sets it if still empty, so two taps at once can't
  //  both win - the database settles the race for us.
  // ============================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, updateDoc, onSnapshot, runTransaction, increment }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDcpaqD2ea9djDSlj4EHUXkbYlglklUn5E",
    authDomain: "buzz-836cf.firebaseapp.com",
    projectId: "buzz-836cf",
    storageBucket: "buzz-836cf.firebasestorage.app",
    messagingSenderId: "256049583657",
    appId: "1:256049583657:web:460a83b22eb02380edee38"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  const roomRef = doc(db, "buzz", "room");

  // elements
  const nameScreen = document.getElementById("nameScreen");
  const gameScreen = document.getElementById("gameScreen");
  const nameInput  = document.getElementById("nameInput");
  const joinBtn    = document.getElementById("joinBtn");
  const buzzBtn    = document.getElementById("buzzBtn");
  const resetBtn   = document.getElementById("resetBtn");
  const winnerEl   = document.getElementById("winner");
  const statusEl   = document.getElementById("status");
  const youAre     = document.getElementById("youAre");
  const roundNo    = document.getElementById("roundNo");
  function setStatus(m,k){ statusEl.textContent=m; statusEl.className=k||""; }

  document.getElementById("ver").addEventListener("click", function(){ setStatus("Buzz v0.3 \u00b7 first tap wins"); });

  let myName = "";
  let authReady = false;
  let lastWinnerBeeped = "";

  // remember the name on this device
  try{ const s = localStorage.getItem("buzz_name"); if(s) nameInput.value = s; }catch(e){}

  // ---- sound (Web Audio, no files). Safari needs a tap to unlock, so we do it on Join. ----
  let audioCtx = null;
  function unlockAudio(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
    }catch(e){}
  }
  function beep(){
    if(!audioCtx) return;
    try{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "square"; g.gain.value = 0.14;
      o.frequency.setValueAtTime(440, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.2);
    }catch(e){}
  }

  // ---- auth, then make sure the room exists, then listen ----
  signInAnonymously(auth).catch(e => setStatus("Sign-in failed: " + e.message, "err"));
  onAuthStateChanged(auth, async (user) => {
    if(!user) return;
    try{
      await setDoc(roomRef, { winner: "", round: 1 }, { merge: true });
    }catch(e){ setStatus("Setup write blocked: " + e.message, "err"); return; }
    authReady = true;
    setStatus("Connected.");
    onSnapshot(roomRef, snap => render(snap.data()), err => setStatus("Listener error: " + err.message, "err"));
  });

  function render(data){
    if(!data) return;
    const winner = data.winner || "";
    roundNo.textContent = "round " + (data.round || 1);

    if(winner === ""){
      buzzBtn.classList.remove("locked");
      buzzBtn.textContent = "BUZZ";
      buzzBtn.disabled = false;
      winnerEl.textContent = "";
      winnerEl.className = "";
      lastWinnerBeeped = "";
      setStatus("Armed. First to buzz wins.");
    } else {
      buzzBtn.classList.add("locked");
      buzzBtn.textContent = "LOCKED";
      buzzBtn.disabled = true;
      if(winner === myName){ winnerEl.textContent = "You got it!"; winnerEl.className = "you"; }
      else { winnerEl.textContent = winner + " buzzed first"; winnerEl.className = "them"; }
      if(lastWinnerBeeped !== winner){ lastWinnerBeeped = winner; beep(); }
      setStatus("Locked. Tap New round to go again.");
    }
  }

  // ---- join ----
  joinBtn.addEventListener("click", () => {
    const n = nameInput.value.trim();
    if(!n){ nameInput.focus(); return; }
    myName = n;
    try{ localStorage.setItem("buzz_name", myName); }catch(e){}
    unlockAudio();
    nameScreen.style.display = "none";
    gameScreen.style.display = "flex";
    youAre.textContent = "you: " + myName;
  });
  nameInput.addEventListener("keydown", e => { if(e.key === "Enter") joinBtn.click(); });

  // ---- buzz: only claims the win if no one has it yet ----
  buzzBtn.addEventListener("click", async () => {
    if(!authReady || !myName) return;
    unlockAudio();
    try{
      await runTransaction(db, async (tx) => {
        const s = await tx.get(roomRef);
        const w = (s.data() && s.data().winner) || "";
        if(w === "") tx.update(roomRef, { winner: myName });
      });
    }catch(e){ setStatus("Buzz error: " + e.message, "err"); }
  });

  // ---- new round: clear the winner, bump the round, everyone re-arms ----
  resetBtn.addEventListener("click", async () => {
    if(!authReady) return;
    try{ await updateDoc(roomRef, { winner: "", round: increment(1) }); }
    catch(e){ setStatus("Reset error: " + e.message, "err"); }
  });
</script>
</body>
</html>
