  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{font-family:system-ui,sans-serif;color:#f0e6d6;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;
    background:
      radial-gradient(120% 90% at 50% 0%,rgba(255,214,150,.14),rgba(0,0,0,0) 55%),
      repeating-linear-gradient(90deg,rgba(255,235,200,.022) 0 2px,rgba(0,0,0,0) 2px 7px),
      repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,rgba(0,0,0,0) 1px 5px),
      linear-gradient(180deg,#352314 0%,#2a1c12 40%,#1e1308 100%);}
  header{text-align:center;padding:30px 16px 12px;}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:clamp(24px,6.4vw,38px);letter-spacing:.5px;
    line-height:1.04;display:inline-block;margin:0;padding:15px 30px 17px;border-radius:15px;color:#edca84;
    background:
      radial-gradient(circle at 15px 13px,#f6dfa6 0 1.4px,#5e441e 2px 3px,transparent 3.4px),
      radial-gradient(circle at calc(100% - 15px) 13px,#f6dfa6 0 1.4px,#5e441e 2px 3px,transparent 3.4px),
      radial-gradient(circle at 15px calc(100% - 13px),#f6dfa6 0 1.4px,#5e441e 2px 3px,transparent 3.4px),
      radial-gradient(circle at calc(100% - 15px) calc(100% - 13px),#f6dfa6 0 1.4px,#5e441e 2px 3px,transparent 3.4px),
      repeating-linear-gradient(91deg,rgba(0,0,0,.05) 0 2px,rgba(255,236,200,.02) 2px 5px),
      linear-gradient(180deg,#4a2e1b 0%,#33200f 56%,#241507 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,224,170,.20),
      inset 0 0 0 2px rgba(214,176,106,.30),
      inset 0 -7px 15px rgba(0,0,0,.5),
      0 11px 26px -7px rgba(0,0,0,.62);
    text-shadow:0 1px 0 rgba(255,238,205,.22),0 -1px 1px rgba(0,0,0,.7),0 4px 12px rgba(0,0,0,.4);}
  .sub{margin-top:13px;color:#cdb088;font-size:14px;font-style:italic;}
  .tally{margin-top:10px;display:inline-flex;align-items:center;gap:10px;font-size:13px;color:#e8d4b4;
    background:rgba(0,0,0,.25);border:1px solid rgba(255,220,170,.15);border-radius:999px;padding:6px 14px;}
  .tally b{font-size:16px;} .tally .m{color:#ff8d86;} .tally .k{color:#8fb8ff;}
  /* Easy View (per-device): larger shelf text & tap targets */
  html.gn-easy .tally{font-size:16px;} html.gn-easy .tally b{font-size:19px;}
  html.gn-easy .sub{font-size:17px;}
  html.gn-easy .name{font-size:20px;}
  html.gn-easy .tag{font-size:14px;}
  html.gn-easy .players{font-size:13px;}
  html.gn-easy #bookLabel{font-size:16px;} html.gn-easy .bkT{font-size:16px;}
  #shelves{max-width:560px;margin:8px auto 44px;padding:0 14px;}
.sec{display:flex;align-items:center;gap:14px;margin:26px 4px 4px;}
.sec h2{font-family:system-ui;font-weight:800;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#d6b06a;white-space:nowrap;}
.sec .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(214,176,106,.5),rgba(214,176,106,0));}
.recess{position:relative;border-radius:5px;padding:18px 10px 8px;background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.05) 60%);}
.vrec{padding:34px 10px 6px;}
.shelfrow{display:flex;align-items:flex-end;justify-content:center;gap:12px;flex-wrap:wrap;}
.shelfrow:not(.cards):not(.board){display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px;align-items:start;justify-items:center;}
.shelfrow.cards{flex-wrap:nowrap;gap:12px;}
.shelfrow.board{gap:12px;}
.shelfrow.board .cbox{flex:0 0 30%;}
.shelfrow.board.top .cbox{flex:0 0 31%;}
.cardrec{padding:14px 8px 6px;}
.plank{height:18px;border-radius:2px 2px 3px 3px;margin:0 -2px;background:repeating-linear-gradient(91deg,rgba(60,32,8,.34) 0 3px,rgba(0,0,0,0) 3px 12px,rgba(255,215,160,.08) 12px 14px,rgba(0,0,0,0) 14px 27px),linear-gradient(180deg,#b07e46,#8a5c30 40%,#6e4421 70%,#46280f);box-shadow:0 11px 20px rgba(0,0,0,.6),inset 0 1.5px 0 rgba(255,230,190,.5),inset 0 -3px 4px rgba(0,0,0,.45);}
.plank::after{content:"";display:block;height:6px;border-radius:2px 2px 0 0;background:linear-gradient(180deg,rgba(255,232,190,.5),transparent);}

/* board cover */
.cbox{position:relative;display:block;cursor:pointer;text-decoration:none;color:inherit;perspective:640px;}
.cbox .cface{position:relative;border-radius:6px 10px 10px 6px;overflow:hidden;display:flex;flex-direction:column;aspect-ratio:.82;
  transform:rotateY(-6deg);transform-origin:left center;transform-style:preserve-3d;transition:transform .18s ease,box-shadow .18s ease;
  box-shadow:6px 8px 16px rgba(0,0,0,.55),14px 18px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.10),inset 0 2px 1px rgba(255,255,255,.14),inset 0 -3px 6px rgba(0,0,0,.32),inset -4px 0 8px rgba(0,0,0,.18);}
.shelfrow.board .cbox:nth-child(odd) .cface{transform:rotateY(-6deg) rotateZ(-.4deg);}
.shelfrow.board .cbox:nth-child(even) .cface{transform:rotateY(-6deg) rotateZ(.3deg);}
.cface::before{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,rgba(0,0,0,0) 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 1px,rgba(0,0,0,0) 1px 3px),radial-gradient(120% 90% at 30% 12%,rgba(255,255,255,.10),rgba(0,0,0,0) 50%);}
.cface::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:inherit;background:linear-gradient(118deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,.05) 22%,rgba(255,255,255,0) 42%,rgba(0,0,0,.10) 72%,rgba(0,0,0,.26) 100%),linear-gradient(118deg,rgba(0,0,0,0) 30%,rgba(255,255,255,.09) 40%,rgba(0,0,0,0) 48%);}
.cbox .lidtop{position:absolute;top:0;left:0;right:0;height:6px;z-index:6;border-radius:6px 10px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));}
.cedge{position:absolute;top:0;bottom:0;right:0;width:9%;z-index:2;border-radius:0 10px 10px 0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 2px,rgba(0,0,0,0) 2px 5px),linear-gradient(90deg,rgba(0,0,0,.30),rgba(0,0,0,.58));mix-blend-mode:multiply;}
.cart{position:relative;z-index:1;flex:0 0 58%;}
.cart svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.32));}
.cart::after{content:"";position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 36%,rgba(0,0,0,0) 56%,rgba(0,0,0,.26) 100%);}
.cband{position:relative;z-index:2;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:4px 5px 6px;font-family:'Fraunces',Georgia,serif;font-weight:800;line-height:1.02;letter-spacing:.2px;font-size:clamp(10.5px,3.1vw,13.5px);overflow-wrap:break-word;word-break:break-word;text-shadow:0 1px 0 rgba(255,255,255,.14),0 -1px 1px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.4);background:linear-gradient(0deg,rgba(0,0,0,.32),rgba(0,0,0,.04));}
.cband .pl{font-family:system-ui;font-weight:800;font-size:8px;letter-spacing:.5px;text-transform:uppercase;opacity:.92;margin-top:5px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.3);}
.cbox:active .cface{transform:rotateY(-3deg) translateY(-7px);box-shadow:8px 16px 26px rgba(0,0,0,.6),18px 26px 40px rgba(0,0,0,.4);}
.cbox.tp .cface{box-shadow:0 1px 0 rgba(0,0,0,.35),5px 12px 22px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,225,150,.35),inset 0 -4px 7px rgba(0,0,0,.34),0 0 14px rgba(214,176,106,.25);}
.cbox.tp .cface::before{box-shadow:inset 0 0 0 2px rgba(214,176,106,.4);}
.cbox.soon{opacity:.62;}

/* spiral book (approved) */
.book{display:block;text-decoration:none;width:100%;max-width:124px;cursor:pointer;}
.book .cover{position:relative;border-radius:6px 12px 12px 6px;aspect-ratio:.8;box-shadow:5px 12px 22px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08),inset -6px 0 12px rgba(0,0,0,.28);transition:transform .15s;}

// ---- sort toggle: Shelf (curated) / Most played / A-Z ----
const SORTS=["shelf","played","az"],SORT_LABEL={shelf:"Shelf",played:"Most played",az:"A\u2013Z"};
function sortMode(){try{const m=localStorage.getItem("shelf_sort");return SORTS.includes(m)?m:"played";}catch(e){return "shelf";}}
function playCount(g){try{return (JSON.parse(localStorage.getItem(g.key))||[]).length;}catch(e){return 0;}}
function sortedGames(){const m=sortMode(),gs=GAMES.slice();
  if(m==="az")gs.sort((a,b)=>a.name.localeCompare(b.name));
  else if(m==="played"){const idx=new Map(GAMES.map((g,i)=>[g.id,i]));
    gs.sort((a,b)=>(playCount(b)-playCount(a))||(idx.get(a.id)-idx.get(b.id)));}
  return gs;}

function build(){
  shelves.innerHTML=boardSection()+cardSection()+BOOKS_HTML+gamesBoxSection()+toysBinSection();
  var rc=document.getElementById('ruleCount');if(rc)rc.textContent='all '+GAMES.filter(function(g){return !ARCADE_H.includes(g.href);}).length+' games';
  shelves.querySelectorAll('.shelf.expandable:not(.vbox):not(.tbin)').forEach(sh=>{
    sh.addEventListener('click',function(e){if(e.target.closest('a'))return;sh.classList.toggle('open');});
  });
  var vb=shelves.querySelector('.shelf.vbox');
  if(vb){var slot=vb.querySelector('.boxslot'),obx=vb.querySelector('.openbox');
    vb.addEventListener('click',function(e){if(e.target.closest('a'))return;
      var opening=!vb.classList.contains('open');
      vb.classList.toggle('open');
      if(opening){slot.style.height=obx.offsetHeight+'px';}
      else{slot.style.height='';}
    });
  }
  var tb=shelves.querySelector('.shelf.tbin');
  if(tb){var tslot=tb.querySelector('.boxslot'),tobx=tb.querySelector('.openbox');
    tb.addEventListener('click',function(e){if(e.target.closest('a'))return;
      var opening=!tb.classList.contains('open');
      tb.classList.toggle('open');
      if(opening){tslot.style.height=tobx.offsetHeight+'px';}
      else{tslot.style.height='';}
    });
  }
}

(function(){const b=document.getElementById("syncBtn");
  function label(){try{b.textContent=GN.sync.status()==="on"?"Household sync: ON \u2713 (tap to turn off)":"Sync this device to the household";}catch(e){}}
  label();
  b.addEventListener("click",function(){
    if(GN.sync.status()==="on"){if(confirm("Turn off household sync on this device? Stats stay saved locally."))GN.sync.disable();label();return;}
    const code=prompt("Household passcode (same on every family device):");
    if(code&&GN.sync.enable(code)){alert("Synced! Stats now flow to the household record.");location.reload();}});})();
document.getElementById("resetStats").addEventListener("click",function(){

  ov.style.cssText="position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,6,2,.85);";
  ov.innerHTML='<div style="max-width:340px;background:linear-gradient(180deg,#3a2614,#241608);border:1px solid rgba(255,220,170,.25);border-radius:14px;padding:22px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.6);">'+
    '<div style="font-weight:800;font-size:18px;color:#f6e7c8;margin-bottom:8px;">Erase all stats?</div>'+
    '<div style="font-size:13px;color:#d8c3a4;line-height:1.5;margin-bottom:16px;">Every game record and the global ledger on this device will be wiped. Players and settings are kept. This cannot be undone.</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;">'+
    '<button id="rsNo" style="font-family:inherit;font-size:15px;font-weight:bold;padding:10px 18px;border-radius:10px;border:1px solid #6b4a28;background:#241608;color:#e8d4b4;cursor:pointer;">Keep stats</button>'+
    '<button id="rsYes" style="font-family:inherit;font-size:15px;font-weight:bold;padding:10px 18px;border-radius:10px;border:none;background:#c0392b;color:#fff;cursor:pointer;box-shadow:0 4px 0 #7e221a;">Erase everything</button>'+
    '</div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#rsNo").onclick=()=>ov.remove();
  ov.addEventListener("click",e=>{if(e.target===ov)ov.remove();});
  ov.querySelector("#rsYes").onclick=function(){ov.remove();
  try{
    for(const g of GAMES)localStorage.removeItem(g.key);
    localStorage.removeItem("sorry_skunks");
    localStorage.removeItem("gn_global");
  }catch(e){}
  try{if(GN.sync.status()==="on")GN.sync.resetCloud();}catch(e){}
  setTimeout(()=>location.reload(),400);};});

  function refresh(){const on=GN.easyView.on();
    st.textContent=on?"On":"Off";btn.style.background=on?"rgba(176,210,53,.18)":"rgba(0,0,0,.25)";}
  btn.addEventListener("click",()=>{GN.easyView.toggle();refresh();});
  refresh();})();
/* 🎮 Controller help overlay */
(function(){const btn=document.getElementById("padHelp");if(!btn)return;
  function statusText(){return (window.GN&&GN.pad&&GN.pad.connected&&GN.pad.connected())?["\u2713 Controller connected","#9fd6a0"]:["Waiting for a controller\u2026","#c9a87a"];}
  function open(){
    const ov=document.createElement("div");
    ov.style.cssText="position:fixed;inset:0;z-index:9998;background:rgba(8,5,2,.82);display:flex;align-items:center;justify-content:center;padding:20px;";
    const s0=statusText();
    ov.innerHTML='<div style="max-width:380px;width:100%;background:linear-gradient(160deg,#241608,#160d04);border:1px solid #6b4a28;border-radius:16px;padding:22px 22px 18px;color:#e8d4b4;box-shadow:0 20px 60px rgba(0,0,0,.6);">'
      +'<div style="font-size:21px;font-weight:800;color:#f4c542;margin-bottom:6px;">\ud83c\udfae Play with a controller</div>'
      +'<div style="font-size:13px;line-height:1.55;color:#d8c3a4;">Any Bluetooth game controller works \u2014 Xbox, PlayStation, or generic.</div>'
      +'<ol style="margin:12px 0 8px;padding-left:20px;font-size:13.5px;line-height:1.6;">'
        +'<li>Open your phone or tablet\u2019s <b>Bluetooth settings</b> and pair the controller.</li>'
        +'<li>Come back here and <b>press any button</b> on it.</li>'
        +'<li>A gold ring appears \u2014 you\u2019re in!</li></ol>'
      +'<div style="display:flex;gap:16px;justify-content:center;margin:12px 0 4px;font-size:13px;color:#d8c3a4;flex-wrap:wrap;">'
        +'<span>\u271b move</span><span><b style="color:#f4c542;">\u24b6</b> select</span><span><b style="color:#f4c542;">\u24b7</b> back</span></div>'
      +'<div id="padStatus" style="text-align:center;font-size:13px;font-weight:700;margin:10px 0 14px;color:'+s0[1]+';">'+s0[0]+'</div>'
      +'<button id="padClose" style="width:100%;font-family:inherit;font-size:15px;font-weight:bold;padding:11px;border-radius:10px;border:none;background:#f4c542;color:#3a2a05;cursor:pointer;">Got it</button>'
      +'</div>';
    document.body.appendChild(ov);
    const t=setInterval(()=>{const s=ov.querySelector("#padStatus");if(!s)return;const st=statusText();s.textContent=st[0];s.style.color=st[1];},600);
    function close(){clearInterval(t);ov.remove();}
    ov.querySelector("#padClose").onclick=close;
    ov.addEventListener("click",e=>{if(e.target===ov)close();});
  }
  btn.addEventListener("click",open);
})();
// (all-games tally removed from the shelf; stats will live on the Bookshelf)
/* ---------- first-launch onboarding: who owns this device? ---------- */
(function(){
  if(!window.GN||!GN.profiles||!GN.profiles.needsOwner())return;
  function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function token(p,s){return '<span style="flex:none;width:'+s+'px;height:'+s+'px;border-radius:50%;display:inline-flex;'
    +'align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:'+Math.round(s*0.42)+'px;'
    +'box-shadow:0 1px 3px rgba(0,0,0,.4) inset;background:radial-gradient(circle at 35% 30%,'+p.light+','+p.color+' 62%,'+p.dark+');">'
    +esc((p.name||"?").charAt(0).toUpperCase())+'</span>';}
  function firstFree(){const used=new Set(GN.profiles.list().map(p=>p.color));const pal=GN.palette();
    for(let i=0;i<pal.length;i++)if(!used.has(pal[i].color))return i;return 0;}
  let pick=GN.palette()[firstFree()], pickIcon=null;
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#3a2615,#180f06);"
    +"color:#f3e7d0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;"
    +"padding:34px 20px;font-family:system-ui,sans-serif;text-align:center;";
  document.body.appendChild(ov);document.body.style.overflow="hidden";
  const BTN="font-family:inherit;cursor:pointer;border-radius:12px;font-weight:800;";
  function rowBtn(inner){const b=document.createElement("button");
    b.style.cssText=BTN+"display:flex;align-items:center;gap:12px;width:min(360px,86vw);text-align:left;font-size:17px;"
      +"padding:12px 16px;margin:6px 0;border:1.5px solid #6b4a2a;background:rgba(255,255,255,.06);color:#f3e7d0;";
    b.innerHTML=inner;return b;}
  function chooser(){
    ov.innerHTML='<div style="font-size:27px;font-weight:800;color:#f4c542;margin-bottom:6px;">Welcome to the Game Shelf</div>'
      +'<div style="font-size:14.5px;color:#d8c4a0;max-width:340px;line-height:1.5;margin-bottom:20px;">'
      +'Who owns this device? We&rsquo;ll use their preferences here &mdash; everyone&rsquo;s scores are still tracked.</div>';
    const box=document.createElement("div");box.style.cssText="display:flex;flex-direction:column;align-items:center;";
    GN.profiles.list().forEach(p=>{const b=rowBtn(token(p,38)+'<span style="flex:1;">'+esc(p.name)+'</span><span style="color:#f4c542;font-size:13px;">this is me</span>');
      b.onclick=()=>claim(p.id);box.appendChild(b);});
    const nb=document.createElement("button");
    nb.style.cssText=BTN+"width:min(360px,86vw);font-size:16px;padding:12px;margin:12px 0 0;border:1.5px dashed #f4c542;background:none;color:#f4c542;";
    nb.innerHTML="&#43; New player";nb.onclick=create;box.appendChild(nb);
    ov.appendChild(box);
  }
  function create(){
    pickIcon=null;
    ov.innerHTML='<div style="font-size:24px;font-weight:800;color:#f4c542;margin-bottom:10px;">Create your profile</div>';
    const wrap=document.createElement("div");wrap.style.cssText="width:min(360px,86vw);display:flex;flex-direction:column;align-items:stretch;gap:12px;";
    const prev=document.createElement("div");prev.style.cssText="display:flex;justify-content:center;";wrap.appendChild(prev);
    const inp=document.createElement("input");inp.maxLength=16;inp.placeholder="Your name";
    inp.style.cssText="font-family:inherit;font-size:18px;padding:12px 14px;border-radius:10px;border:1.5px solid #6b4a2a;background:rgba(255,255,255,.95);color:#22303a;text-align:center;";
    wrap.appendChild(inp);
    function curP(){return {name:(inp.value||"").trim()||"?",color:pick.color,light:pick.light,dark:pick.dark,
      avatar:pickIcon?{kind:"icon",icon:pickIcon}:{kind:"color"}};}
    function up(){prev.innerHTML=GN.tokenHTML(curP(),64);}
    inp.addEventListener("input",up);
    const clabel=document.createElement("div");clabel.textContent="pick a color";
    clabel.style.cssText="font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#b89a6e;text-align:center;";wrap.appendChild(clabel);
    const grid=document.createElement("div");grid.style.cssText="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;";
    let iconGrid;
    function paintIcons(){if(!iconGrid)return;iconGrid.innerHTML="";
      GN.avatarSets().forEach(grp=>{
        const lab=document.createElement("div");lab.textContent=grp.set;
        lab.style.cssText="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#b89a6e;margin:8px 0 3px;align-self:flex-start;";
        iconGrid.appendChild(lab);
        const row=document.createElement("div");row.style.cssText="display:flex;flex-wrap:wrap;gap:7px;justify-content:center;";
        grp.icons.forEach(a=>{const d=document.createElement("div");
          d.style.cssText="width:42px;height:42px;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;border:3px solid "+(pickIcon===a.id?"#f4c542":"transparent")+";";
          d.title=a.id;d.innerHTML=GN.tokenHTML({name:"?",color:pick.color,light:pick.light,dark:pick.dark,avatar:{kind:"icon",icon:a.id}},36);
          d.onclick=()=>{pickIcon=(pickIcon===a.id)?null:a.id;paintIcons();up();};row.appendChild(d);});
        iconGrid.appendChild(row);});}
    GN.palette().forEach(pal=>{const sw=document.createElement("div");
      sw.style.cssText="width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid "+(pal.color===pick.color?"#f4c542":"transparent")+";"
        +"background:radial-gradient(circle at 35% 30%,"+pal.light+","+pal.color+" 62%,"+pal.dark+");";
      sw.onclick=()=>{pick=pal;[...grid.children].forEach(c=>c.style.borderColor="transparent");sw.style.borderColor="#f4c542";paintIcons();up();};
      grid.appendChild(sw);});
    wrap.appendChild(grid);
    const ilabel=document.createElement("div");ilabel.textContent="or add an icon";
    ilabel.style.cssText="font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#b89a6e;text-align:center;";wrap.appendChild(ilabel);
    iconGrid=document.createElement("div");iconGrid.style.cssText="display:flex;flex-direction:column;align-items:stretch;gap:1px;width:100%;max-height:210px;overflow:auto;";wrap.appendChild(iconGrid);paintIcons();
    const go=document.createElement("button");go.textContent="Create & start playing";
    go.style.cssText=BTN+"font-size:17px;padding:13px;border:none;background:#f4c542;color:#3a2a05;margin-top:4px;";
    go.onclick=()=>{const name=(inp.value||"").trim();if(!name){inp.focus();return;}
      const p=GN.profiles.add(name,pick);if(p){GN.profiles.recolor(p.id,pick);
        GN.profiles.setAvatar(p.id,pickIcon?{kind:"icon",icon:pickIcon}:{kind:"color"});claim(p.id);}};
    wrap.appendChild(go);
    const back=document.createElement("button");back.textContent="\u2329 back";
    back.style.cssText=BTN+"background:none;border:none;color:#b89a6e;font-size:14px;padding:6px;";back.onclick=chooser;
    wrap.appendChild(back);
    ov.appendChild(wrap);up();setTimeout(()=>inp.focus(),40);
  }
  function claim(id){GN.profiles.setOwner(id);document.body.style.overflow="";ov.remove();}
  chooser();
})();
</script>
</body>
</html>
