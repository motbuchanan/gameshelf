<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:system-ui,sans-serif;color:#f0e6d6;overflow-x:hidden;
    background:
      radial-gradient(120% 90% at 50% 0%,rgba(255,214,150,.14),rgba(0,0,0,0) 55%),
      repeating-linear-gradient(90deg,rgba(255,235,200,.022) 0 2px,rgba(0,0,0,0) 2px 7px),
      repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,rgba(0,0,0,0) 1px 5px),
      linear-gradient(180deg,#352314 0%,#2a1c12 40%,#1e1308 100%);}
  header{text-align:center;padding:26px 16px 10px;}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:clamp(26px,7vw,40px);letter-spacing:.5px;
    color:#f6e7c8;text-shadow:0 3px 14px rgba(0,0,0,.6);}
  .sub{margin-top:6px;color:#c9ab85;font-size:14px;}
  .tally{margin-top:10px;display:inline-flex;align-items:center;gap:10px;font-size:13px;color:#e8d4b4;
    background:rgba(0,0,0,.25);border:1px solid rgba(255,220,170,.15);border-radius:999px;padding:6px 14px;}
  .tally b{font-size:16px;} .tally .m{color:#ff8d86;} .tally .k{color:#8fb8ff;}
  /* Easy View (per-device): larger shelf text & tap targets */
  html.gn-easy .tally{font-size:16px;} html.gn-easy .tally b{font-size:19px;}
  html.gn-easy .sub{font-size:17px;}
  html.gn-easy .name{font-size:20px;}
  html.gn-easy .tag{font-size:14px;}
  html.gn-easy .players{font-size:13px;}
  html.gn-easy #bookLabel{font-size:16px;} html.gn-easy .bkT{font-size:16px;}
  #shelves{max-width:760px;margin:8px auto 60px;padding:0 14px;}
  .row{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:0 10px 0;align-items:end;}
  @media(min-width:560px){.row{grid-template-columns:repeat(3,1fr);}}
  .plank{height:16px;margin:0 2px 30px;border-radius:3px;position:relative;
    background:
      repeating-linear-gradient(92deg,rgba(60,32,8,.32) 0 3px,rgba(0,0,0,0) 3px 11px,rgba(255,215,160,.07) 11px 13px,rgba(0,0,0,0) 13px 26px),
      repeating-linear-gradient(88deg,rgba(0,0,0,.12) 0 7px,rgba(0,0,0,0) 7px 19px),
      linear-gradient(180deg,#a57542 0%,#8a5c30 35%,#6e4421 62%,#4c2c13 100%);
    box-shadow:0 10px 18px rgba(0,0,0,.55),0 3px 5px rgba(0,0,0,.4),inset 0 1.5px 0 rgba(255,230,190,.45),inset 0 -2px 3px rgba(0,0,0,.4);}
  .plank .ao{position:absolute;left:0;right:0;top:-13px;height:13px;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.34));}
  .plank::before,.plank::after{content:"";position:absolute;top:14px;width:10px;height:14px;background:linear-gradient(180deg,#3c2410,#2a1709);border-radius:0 0 3px 3px;}
  .plank::before{left:8%;} .plank::after{right:8%;}
  .box{position:relative;display:block;border:none;background:none;color:inherit;font-family:inherit;cursor:pointer;
    aspect-ratio:3/3.6;perspective:600px;text-align:left;padding:0;transform:translateY(4px);}
  .face{position:absolute;inset:0;border-radius:6px 10px 10px 6px;overflow:hidden;
    transform:rotateY(-7deg);transform-origin:left center;transform-style:preserve-3d;
    box-shadow:6px 8px 16px rgba(0,0,0,.55),14px 18px 30px rgba(0,0,0,.35),
      inset 0 0 0 1px rgba(255,255,255,.10),inset 0 2px 1px rgba(255,255,255,.14),
      inset 0 -3px 6px rgba(0,0,0,.32),inset -4px 0 8px rgba(0,0,0,.18);
    transition:transform .18s ease,box-shadow .18s ease;}
  .face::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:
      repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,rgba(0,0,0,0) 1px 3px),
      repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 1px,rgba(0,0,0,0) 1px 3px),
      radial-gradient(120% 90% at 30% 12%,rgba(255,255,255,.10),rgba(0,0,0,0) 50%);}
  .face::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;
    background:
      linear-gradient(118deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,.05) 22%,rgba(255,255,255,0) 42%,rgba(0,0,0,.10) 72%,rgba(0,0,0,.26) 100%),
      linear-gradient(118deg,rgba(0,0,0,0) 30%,rgba(255,255,255,.09) 40%,rgba(0,0,0,0) 48%);}
  .cover{z-index:1;}
  .row .box:nth-child(3n+1) .face{transform:rotateY(-7deg) rotateZ(-.5deg);}
  .row .box:nth-child(3n) .face{transform:rotateY(-7deg) rotateZ(.4deg);}
  .box:active .face{transform:rotateY(-3deg) translateY(-8px);box-shadow:8px 16px 26px rgba(0,0,0,.6),18px 26px 40px rgba(0,0,0,.4);}
  .edge{position:absolute;top:0;bottom:0;right:0;width:9%;z-index:2;border-radius:0 10px 10px 0;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 2px,rgba(0,0,0,0) 2px 5px),
      linear-gradient(90deg,rgba(0,0,0,.30),rgba(0,0,0,.58));mix-blend-mode:multiply;}
  .cover{position:absolute;inset:0;display:flex;flex-direction:column;}
  .cover .name{font-family:Georgia,'Times New Roman',serif;font-weight:800;letter-spacing:.4px;line-height:1.04;
    padding:10px 10px 4px;font-size:clamp(17px,4.6vw,24px);
    text-shadow:0 1px 0 rgba(255,255,255,.18),0 -1px 1px rgba(0,0,0,.5),0 2px 5px rgba(0,0,0,.4);}
  .cover .tag{padding:0 10px;font-size:10.5px;opacity:.85;letter-spacing:.4px;text-transform:uppercase;}
  .cover .players{margin:3px 10px 0;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    align-self:flex-start;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.32);
    border:1px solid rgba(255,255,255,.35);opacity:.95;}
  .art{flex:1;position:relative;}
  .art svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.30));}
  .art::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 105% at 50% 42%,rgba(0,0,0,0) 58%,rgba(0,0,0,.24) 100%);}
  .soon .face{filter:saturate(.35) brightness(.62);}
  .soon{cursor:default;}
  .soon:active .face{transform:rotateY(-7deg);box-shadow:6px 8px 16px rgba(0,0,0,.55),14px 18px 30px rgba(0,0,0,.35);}
  .sticker{position:absolute;top:8px;right:2px;z-index:3;background:#f4c542;color:#3a2a05;font-size:10px;font-weight:800;
    letter-spacing:.6px;padding:4px 9px;border-radius:3px;transform:rotate(8deg);box-shadow:0 2px 6px rgba(0,0,0,.5);}
  footer{text-align:center;color:#8d6f50;font-size:12px;padding:0 0 28px;}
  @media (prefers-reduced-motion:reduce){.face{transition:none;}}
  #bookCorner{width:min(96vw,560px);margin:26px auto 4px;display:flex;flex-direction:column;align-items:center;}
  #bookLabel{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#b89a72;opacity:.8;margin-bottom:10px;}
  #bookPile{display:flex;flex-direction:column-reverse;align-items:center;}
  .bk{position:relative;display:flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;
    width:var(--w);height:44px;border-radius:7px 10px 10px 7px;transform:rotate(var(--rot));
    background:linear-gradient(175deg,var(--c1),var(--c2));
    box-shadow:0 4px 8px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 5px rgba(0,0,0,.3);
    margin-top:-4px;z-index:calc(3 - var(--lift));transition:transform .15s;}
  .bk:active{transform:rotate(var(--rot)) translateY(2px);}
  .bk.thin{height:36px;}
  .bkSpine{position:absolute;left:9px;top:6px;bottom:6px;width:3px;border-radius:2px;background:rgba(255,255,255,.25);}
  .bk.hard::after{content:"";position:absolute;right:5px;top:4px;bottom:4px;width:7px;border-radius:0 6px 6px 0;
    background:repeating-linear-gradient(#f4ecd8 0 2px,#d8ccae 2px 3.5px);}
  .bk.spiral .rings{position:absolute;left:6px;top:5px;bottom:5px;width:10px;
    background:repeating-linear-gradient(rgba(255,255,255,.0) 0 3px,rgba(230,238,244,.85) 3px 6px,rgba(255,255,255,0) 6px 9px);
    border-radius:5px;}
  .bkT{font-weight:800;font-size:14.5px;color:#f4ecd8;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap;}
  .bkN{font-size:11px;color:rgba(244,236,216,.75);white-space:nowrap;}
  #bookShelfPlank{width:min(86vw,420px);height:13px;border-radius:4px;margin-top:2px;
    background:linear-gradient(180deg,#9a6a3c,#6e4424);box-shadow:0 5px 9px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.22);}
</style>
</head>

<header>
  <h1>The Game Shelf</h1>
  <div class="sub">Pick a box. Loser racks up the next one.</div>
  <div style="margin-top:10px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;"><button id="tvToggle" class="tally" style="cursor:pointer;border:1px solid rgba(255,220,170,.25);font-family:inherit;">📺 TV mode: <b id="tvState">Off</b></button><button id="sortToggle" class="tally" style="cursor:pointer;border:1px solid rgba(255,220,170,.25);font-family:inherit;">🔀 Sort: <b id="sortState">Shelf</b></button><button id="easyToggle" class="tally" style="cursor:pointer;border:1px solid rgba(255,220,170,.25);font-family:inherit;">🔎 Easy view: <b id="easyState">Off</b></button></div>
</header>

<div id="shelves"></div>
<div id="bookCorner">
  <div id="bookLabel">the bookshelf &mdash; a collection begins</div>
  <div id="bookPile">
    <a class="bk hard" href="rules.html" style="--w:240px;--rot:-1.2deg;--c1:#7a3b2e;--c2:#5a281e;--lift:0;">
      <span class="bkSpine"></span><span class="bkT">&#128214; The Rulebook</span><span class="bkN">all 26 games</span></a>
    <a class="bk spiral" href="records.html" style="--w:206px;--rot:1.6deg;--c1:#3a6e8c;--c2:#2a4f66;--lift:1;">
      <span class="rings"></span><span class="bkT">&#128211; The Record Book</span><span class="bkN">household stats</span></a>
    <a class="bk hard thin" href="howto.html" style="--w:178px;--rot:-2.4deg;--c1:#4a6e3a;--c2:#33502a;--lift:2;">
      <span class="bkSpine"></span><span class="bkT">&#128221; How-To Guides</span></a>
    <a class="bk hard" href="wordsearch.html" style="--w:196px;--rot:2deg;--c1:#7a5a9c;--c2:#5a3f78;--lift:3;">
      <span class="bkSpine"></span><span class="bkT">&#128269; Word Search</span><span class="bkN">10 puzzles</span></a>
  </div>
  <div id="bookShelfPlank"></div>
</div>
<footer>Built by Mot · one shelf, no batteries<br><button id="resetStats" style="margin-top:10px;background:none;border:none;color:#8d6f50;font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;">Reset all stats on this device</button>
<button id="syncBtn" style="margin-top:6px;background:none;border:none;color:#8d6f50;font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit;">Sync this device to the household</button></footer>

const shelves=document.getElementById("shelves");
const perRow=()=>window.innerWidth>=560?3:2;
// ---- sort toggle: Shelf (curated) / Most played / A-Z ----
const SORTS=["shelf","played","az"],SORT_LABEL={shelf:"Shelf",played:"Most played",az:"A\u2013Z"};
function sortMode(){try{const m=localStorage.getItem("shelf_sort");return SORTS.includes(m)?m:"shelf";}catch(e){return "shelf";}}
function playCount(g){try{return (JSON.parse(localStorage.getItem(g.key))||[]).length;}catch(e){return 0;}}
function sortedGames(){const m=sortMode(),gs=GAMES.slice();
  if(m==="az")gs.sort((a,b)=>a.name.localeCompare(b.name));
  else if(m==="played"){const idx=new Map(GAMES.map((g,i)=>[g.id,i]));
    gs.sort((a,b)=>(playCount(b)-playCount(a))||(idx.get(a.id)-idx.get(b.id)));}
  return gs;}
function build(){shelves.innerHTML="";const n=perRow();
  const list=sortedGames();
  for(let i=0;i<list.length;i+=n){const row=document.createElement("div");row.className="row";
    list.slice(i,i+n).forEach(g=>{const b=document.createElement(g.soon?"div":"a");
      b.className="box"+(g.soon?" soon":"");if(!g.soon)b.href=g.href;
      b.innerHTML=(g.soon?'<span class="sticker">SOON</span>':"")+
        '<div class="face" style="background:'+g.bg+'"><div class="cover" style="color:'+g.ink+'">'+
        '<div class="name">'+g.name+'</div><div class="tag">'+g.tag+'</div><div class="players">'+(g.players||"2")+' players</div><div class="art">'+g.art+'</div></div>'+
        '<div class="edge"></div></div>';
      row.appendChild(b);});
    shelves.appendChild(row);
    const plank=document.createElement("div");plank.className="plank";plank.innerHTML='<div class="ao"></div>';shelves.appendChild(plank);}}
let lastN=perRow();build();
window.addEventListener("resize",()=>{const n=perRow();if(n!==lastN){lastN=n;build();}});
// Reset stats: wipes every game ledger + the global ledger on THIS device.
// Keeps players, TV mode, themes, rule choices, and saved games.
(function(){const b=document.getElementById("syncBtn");
  function label(){try{b.textContent=GN.sync.status()==="on"?"Household sync: ON \u2713 (tap to turn off)":"Sync this device to the household";}catch(e){}}
  label();
  b.addEventListener("click",function(){
    if(GN.sync.status()==="on"){if(confirm("Turn off household sync on this device? Stats stay saved locally."))GN.sync.disable();label();return;}
    const code=prompt("Household passcode (same on every family device):");
    if(code&&GN.sync.enable(code)){alert("Synced! Stats now flow to the household record.");location.reload();}});})();
document.getElementById("resetStats").addEventListener("click",function(){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,6,2,.85);";
  ov.innerHTML='<div style="max-width:340px;background:linear-gradient(180deg,#3a2614,#241608);border:1px solid rgba(255,220,170,.25);border-radius:14px;padding:22px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.6);">'+
    '<div style="font-weight:800;font-size:18px;color:#f6e7c8;margin-bottom:8px;">Erase all stats?</div>'+
    '<div style="font-size:13px;color:#d8c3a4;line-height:1.5;margin-bottom:16px;">Every game record and the global ledger on this device will be wiped. Players and settings are kept. This cannot be undone.</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;">'+
    '<button id="rsNo" style="font-family:inherit;font-size:15px;font-weight:bold;padding:10px 18px;border-radius:10px;border:1px solid #6b4a28;background:#241608;color:#e8d4b4;cursor:pointer;">Keep stats</button>'+
    '<button id="rsYes" style="font-family:inherit;font-size:15px;font-weight:bold;padding:10px 18px;border-radius:10px;border:none;background:#c0392b;color:#fff;cursor:pointer;box-shadow:0 4px 0 #7e221a;">Erase everything</button>'+
    '</div></div>';
  document.body.appendChild(ov);
  ov.querySelector("#rsNo").onclick=()=>ov.remove();
  ov.addEventListener("click",e=>{if(e.target===ov)ov.remove();});
  ov.querySelector("#rsYes").onclick=function(){ov.remove();
  try{
    for(const g of GAMES)localStorage.removeItem(g.key);
    localStorage.removeItem("sorry_skunks");
    localStorage.removeItem("gn_global");
  }catch(e){}
  try{if(GN.sync.status()==="on")GN.sync.resetCloud();}catch(e){}
  setTimeout(()=>location.reload(),400);};});
// TV mode: fixed board orientation for shared screens (Fire Stick etc.)
(function(){const btn=document.getElementById("tvToggle"),st=document.getElementById("tvState");
  function refresh(){let on=false;try{on=localStorage.getItem("shelf_tv")==="1";}catch(e){}
    st.textContent=on?"On":"Off";btn.style.background=on?"rgba(176,210,53,.18)":"rgba(0,0,0,.25)";}
  (function(){const sb=document.getElementById("sortToggle"),st=document.getElementById("sortState");
    function paint(){st.textContent=SORT_LABEL[sortMode()];}
    sb.addEventListener("click",()=>{const m=sortMode(),nxt=SORTS[(SORTS.indexOf(m)+1)%SORTS.length];
      try{localStorage.setItem("shelf_sort",nxt);}catch(e){}
      paint();build();});
    paint();})();
  btn.addEventListener("click",()=>{try{const on=localStorage.getItem("shelf_tv")==="1";
    if(on)localStorage.removeItem("shelf_tv");else localStorage.setItem("shelf_tv","1");}catch(e){}refresh();});
  refresh();})();
(function(){const btn=document.getElementById("easyToggle"),st=document.getElementById("easyState");
  if(!btn||!window.GN||!GN.easyView)return;
  function refresh(){const on=GN.easyView.on();
    st.textContent=on?"On":"Off";btn.style.background=on?"rgba(176,210,53,.18)":"rgba(0,0,0,.25)";}
  btn.addEventListener("click",()=>{GN.easyView.toggle();refresh();});
  refresh();})();
// (all-games tally removed from the shelf; stats will live on the Bookshelf)
</script>
