<style>
:root{
  --bg:#3a0d14; --bg2:#5a1420; --panel:#7a1f2b; --panel2:#8e2736; --line:#b13a4b;
  --ink:#f4f1ea; --dim:#e8b9bf; --red:#ff5a5a; --gold:#ffcc4d; --teal:#4fe3d2; --blue:#6fb6ff; --green:#8ee86a; --white:#ffffff;
  --tap:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 30% 20%,#6a1826 0%,var(--bg) 60%,#2a080e 100%)}
#veins{position:fixed;inset:0;pointer-events:none;opacity:.35}
#app{position:relative;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;gap:10px;flex:0 0 auto;flex-wrap:wrap}
header h1{font-size:20px;margin:0;letter-spacing:1px}
#badge{font-size:12px;color:var(--dim);background:rgba(0,0,0,.25);padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
#hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meter{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:15px;font-weight:700}
.meter .bar{width:60px;height:8px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;transition:width .4s cubic-bezier(.2,.9,.3,1.2)}
#m-o2 i{background:var(--blue)}#m-glu i{background:var(--gold)}#m-h2o i{background:var(--teal)}
.meter.low{border-color:var(--red);animation:lowpulse 1s ease-in-out infinite}
@keyframes lowpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,90,0)}50%{box-shadow:0 0 0 4px rgba(255,90,90,.45)}}
.coin{color:var(--gold)}
main{flex:1;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;overflow:auto;padding:10px 14px 16px;opacity:0;transform:scale(.98);pointer-events:none;transition:opacity .25s,transform .25s}
.scr.on{opacity:1;transform:scale(1);pointer-events:auto}
.wrap{max-width:1100px;margin:0 auto}
h2{font-size:26px;margin:4px 0 6px}
p{line-height:1.4;font-size:18px;margin:6px 0}
.sub{color:var(--dim);font-size:16px}
.btn{min-height:var(--tap);font-size:20px;font-weight:700;border-radius:16px;border:0;cursor:pointer;color:#2a080e;background:var(--gold);padding:10px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s;box-shadow:0 4px 0 #b8902a}
.btn:active{transform:scale(.94) translateY(2px);box-shadow:0 2px 0 #b8902a}
.btn.ghost{background:rgba(0,0,0,.25);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 #2a9a8c}.btn.teal:active{box-shadow:0 2px 0 #2a9a8c}
.btn.red{background:var(--red);box-shadow:0 4px 0 #b13a4b;color:#fff}.btn.red:active{box-shadow:0 2px 0 #b13a4b}
.btn.go{background:linear-gradient(180deg,#ffd970,#ffcc4d);font-size:19px}
.btn:disabled{opacity:.4;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.row .btn{flex:1}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:700px){.split{grid-template-columns:1fr}}
/* crew */
.crew{display:flex;gap:10px;flex-wrap:wrap}
.cell{flex:1;min-width:140px;background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;gap:10px;align-items:center}
.cell svg{width:52px;height:52px;flex:0 0 52px;animation:bob 2.4s ease-in-out infinite}
.cell:nth-child(2) svg{animation-delay:-.8s}.cell:nth-child(3) svg{animation-delay:-1.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.cell b{display:block;font-size:17px}
.cell .hp{font-size:15px;letter-spacing:2px}
.cell.tired{opacity:.6}
/* map */
#map{width:100%;height:auto;max-height:66vh;display:block}
.node{cursor:pointer}
.node.locked{opacity:.45;cursor:default}
.node:active circle.base{transform:scale(.95)}
.node text{fill:#f4f1ea;font-weight:700;font-size:15px;text-anchor:middle;pointer-events:none}
.node .ic{font-size:26px;text-anchor:middle;pointer-events:none}
.node.here circle.ring{stroke:#4fe3d2;stroke-width:4}
.node.reach circle.ring{stroke:#ffcc4d;stroke-width:5;animation:pulse 1.1s ease-in-out infinite}
.node.reach .gobadge{animation:bob 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:1;r:46}50%{stroke-opacity:.35;r:52}}
.pod{pointer-events:none}
.coach{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;background:var(--gold);color:#2a080e;font-weight:800;font-size:18px;padding:12px 18px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.4);pointer-events:none;animation:bob 1.2s ease-in-out infinite;white-space:nowrap;z-index:3}
.mapwrap{position:relative}
.arrow{pointer-events:none;animation:arrowbob .8s ease-in-out infinite}
@keyframes arrowbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--dim);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:26px;height:6px;border-radius:3px}
/* event */
.choice{display:block;width:100%;text-align:left;margin-top:10px;font-size:18px}
.fact{background:rgba(0,0,0,.3);border-left:4px solid var(--teal);padding:10px 12px;border-radius:10px;margin-top:12px;font-size:17px}
/* shop */
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.shop .btn{flex-direction:column;min-height:90px}
.shop small{font-size:14px;font-weight:400}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:10px auto 0}
.pad .btn{min-height:58px;background:rgba(0,0,0,.3);color:var(--ink);border:2px solid var(--line);box-shadow:none;font-size:24px}
.ans{font-size:34px;text-align:center;min-height:48px;letter-spacing:2px;margin-top:6px}
.prob{font-size:24px;text-align:center;margin-top:8px}
/* minigame */
#gameWrap{position:relative;width:100%;background:#2a080e;border:3px solid var(--line);border-radius:18px;overflow:hidden;touch-action:none}
#game{display:block;width:100%;height:auto}
#gameHud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;font-weight:700;font-size:18px;pointer-events:none;text-shadow:0 2px 4px #000}
#gameMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(42,8,14,.78);text-align:center;padding:16px;overflow:auto}
#gameMsg.hide{display:none}
#gameMsg h3{font-size:30px;margin:0}
/* journal */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tab{padding:10px 14px;border-radius:999px;border:2px solid var(--line);background:rgba(0,0,0,.25);font-weight:700;cursor:pointer;font-size:16px}
.tab.on{background:var(--gold);color:#2a080e;border-color:var(--gold)}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.jcard{background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:14px;padding:10px;min-height:120px}
.jcard.locked{opacity:.35;filter:grayscale(1)}
.jcard .ic{font-size:34px}
.jcard b{display:block;font-size:16px;margin:4px 0}
.jcard p{font-size:14px;margin:0 0 4px;color:var(--dim)}
.jcard p em{color:var(--gold);font-style:normal;font-weight:700}
/* intro */
.intro{max-width:720px;margin:0 auto;text-align:center}
.intro .pic{font-size:64px;line-height:1;margin:6px 0}
.intro h2{font-size:32px}
.intro p{font-size:20px}
.dots{display:flex;gap:8px;justify-content:center;margin:10px 0}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.on{background:var(--gold)}
.meters3{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.meters3 div{background:rgba(0,0,0,.3);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:17px;min-width:150px}
.meters3 b{display:block;font-size:30px}
/* fx */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--teal);color:#2a080e;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:60;font-size:17px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translate(0px,0px)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}}
.punch{animation:punch .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes punch{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.title{text-align:center;padding-top:3vh}
.title h2{font-size:clamp(26px,9.6vw,52px);margin:6px 0;letter-spacing:clamp(1px,.6vw,3px);text-shadow:0 4px 0 #2a080e;max-width:100%;overflow-wrap:anywhere}
.title .pod{width:150px;height:150px;animation:bob 2.4s ease-in-out infinite}
.stars{color:var(--gold);font-size:20px}
.big{font-size:40px}
.mission{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.mission .ic{font-size:34px}
.mission b{display:block;font-size:18px}
.mission .sub{font-size:14px}
.mission .btn{margin-left:auto;min-height:48px;padding:6px 14px;font-size:17px}
.mission.done{opacity:.55}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* BLOODSTREAM - v0.6 - Oct 25 2026 - Phase 3b (unique bosses) - built for Garrett */
var VERSION=document.querySelector('meta[name=build]').getAttribute('content');
var KEY='bloodstream_v1';

/* ---------- storage (guarded) ---------- */
var mem={};
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return mem[KEY]||null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){mem[KEY]=P;}}

/* v0.2 -> v0.3 migration: an old win already unlocked lungs; give the brain too */
if(P.unlocked.indexOf('lungs')>=0&&P.unlocked.indexOf('brain')<0){P.unlocked.push('brain');P.bosses.sugar=true;}
function syncUnlocks(){Object.keys(P.bosses).forEach(function(b){if(BOSSES[b])BOSSES[b].unlocks.forEach(function(u){if(P.unlocked.indexOf(u)<0)P.unlocked.push(u);});});save();}

/* ---------- run state ---------- */
var R=null;
var PLAYKEY='bloodstream_games';
function recordPlay(){var t0=R.started||Date.now(),t1=Date.now();
  if(window.GN&&GN.recordGame){try{GN.recordGame(PLAYKEY,{start:t0,end:t1,durationMs:t1-t0,stars:R.stars,won:true,solo:true,winner:null,draw:true});return;}catch(e){}}
  try{var a=JSON.parse(localStorage.getItem(PLAYKEY))||[];if(!Array.isArray(a))a=[];a.push({start:R.started||Date.now(),end:Date.now(),stars:R.stars,won:true});localStorage.setItem(PLAYKEY,JSON.stringify(a));}catch(e){}}

/* ---------- content ---------- */
var CREW={
  oxinator:{nm:'Oxinator',kind:'Red Cell',color:'#ff5a5a',ic:'🔴',

/* ---------- audio (silent until first tap) ---------- */
var AC=null;
function beep(f,d,type,vol){
  if(!P.sound)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.value=f*(1+(Math.random()-.5)*.12);
    g.gain.value=vol||.08;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.1));
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(d||.1));
  }catch(e){}
}
var SFX={tap:function(){beep(520,.06,'square',.05);},good:function(){beep(660,.1,'triangle');setTimeout(function(){beep(880,.14,'triangle');},90);},
  bad:function(){beep(180,.2,'sawtooth',.06);},coin:function(){beep(1040,.08,'square',.05);setTimeout(function(){beep(1320,.1,'square',.05);},70);},
  hit:function(){beep(140,.08,'square',.1);},win:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){beep(f,.18,'triangle',.08);},i*120);});},
  combo:function(n){beep(660*Math.pow(1.0595,Math.min(n,12)),.09,'triangle',.07);},
  whoosh:function(){beep(300,.18,'sawtooth',.03);}};

function snack(){

function travel(k){
  if(R.o2<1||R.h2o<1){toast('Out of oxygen or water. Back to the Heart shop.');SFX.bad();if(R.at!=='heart'){R.at='heart';hub('The crew drifts back to the Heart on empty. Buy supplies before the next trip.');}return;}
  R.o2-=1;R.h2o-=1;R.steps+=1;R.coach=false;SFX.whoosh();
  var route=[R.at,k].sort().join('-');if(R.routes.indexOf(route)<0){R.routes.push(route);unlockJ('map',route);}
  R.at=k;R.visited[k]=true;unlockJ('organ',k);hud();

}

/* ---------- EVENT CARDS ---------- */
function event(){
  var pool=EVENTS.filter(function(e){return R.eventsSeen.indexOf(e.id)<0&&!(e.mission&&R.done[e.mission]);});
  if(!pool.length){pool=EVENTS.filter(function(e){return !e.mission;});R.eventsSeen=[];}
  var e=pool[Math.floor(Math.random()*pool.length)];R.eventsSeen.push(e.id);
  if(e.mission){startGame(e.mission);return;}
  var el=document.getElementById('s-event');
  el.innerHTML='<div class="wrap"><div class="card"><div class="big" style="text-align:center">'+e.ic+'</div><h2>'+esc(e.t)+'</h2><p>'+esc(e.txt)+'</p>'+e.c.map(function(c,i){return '<button class="btn ghost choice" data-i="'+i+'">'+esc(c.l)+'</button>';}).join('')+'</div></div>';
  Array.prototype.forEach.call(el.querySelectorAll('.choice'),function(b){b.onclick=function(){
    var c=e.c[+b.getAttribute('data-i')];
    if(c.game){startGame(c.game[0],c.game[1]);return;}
    var fx=c.fx||{};
    if(fx.o2)R.o2=clamp(R.o2+fx.o2);if(fx.glu)R.glu=clamp(R.glu+fx.glu);if(fx.h2o)R.h2o=clamp(R.h2o+fx.h2o);
    if(fx.coin){R.coin+=fx.coin;SFX.coin();}
    if(fx.crew){R.crew[fx.crew[0]]=Math.max(0,R.crew[fx.crew[0]]+fx.crew[1]);SFX.hit();shake();}
    if(fx.rest)Object.keys(R.crew).forEach(function(k){R.crew[k]=Math.min(3,R.crew[k]+1);});
    if(fx.germ)unlockJ('germ',fx.germ);
    hud();
    var fact=fx.germ?GERMS[fx.germ].fact:'';
    el.innerHTML='<div class="wrap"><div class="card"><h2>'+esc(e.t)+'</h2><p>'+esc(c.r)+'</p>'+(fact?'<div class="fact">💡 '+esc(fact)+'</div>':'')+'<div class="row"><button class="btn" id="go">Onward ▶</button></div></div></div>';
    el.querySelector('#go').onclick=function(){checkTired();};
  };});
  show('event');
}
function checkTired(){
  var allTired=Object.keys(R.crew).every(function(k){return R.crew[k]===0;});
  if(allTired){R.at='heart';Object.keys(R.crew).forEach(function(k){R.crew[k]=1;});hub('Everyone was too tired to go on. The Bubble Pod floated back to the Heart. Each cell has 1 energy. Snack up.');return;}
  hub();
}

/* ---------- MATH ---------- */
function mathLevel(){return Math.min(3,P.mathLevel);}
function makeProblem(){
  var L=Math.floor(mathLevel()),a,b,q,ans;
  if(L===0){a=2+rnd(8);b=2+rnd(8);q=a+' + '+b;ans=a+b;}
  else if(L===1){a=10+rnd(10);b=2+rnd(9);q=a+' - '+b;ans=a-b;}
  else if(L===2){a=2+rnd(5);b=2+rnd(5);q=a+' x '+b;ans=a*b;}
  else{b=2+rnd(4);ans=2+rnd(6);a=b*ans;q=a+' ÷ '+b;}
  return {q:q,ans:ans};
}
function rnd(n){return Math.floor(Math.random()*n);}
function askMath(prompt,onRight){
  var pr=makeProblem();var typed='';var tries=0;
  var el=document.getElementById('s-shop');
  function draw(){
    el.innerHTML='<div class="wrap"><div class="card"><h2>🧮 '+esc(prompt)+'</h2><div class="prob">'+pr.q+' = ?</div><div class="ans" id="ans">'+(typed||'_')+'</div><div class="pad">'+[1,2,3,4,5,6,7,8,9,'⌫',0,'✔'].map(function(k){return '<button class="btn" data-k="'+k+'">'+k+'</button>';}).join('')+'</div></div></div>';
    Array.prototype.forEach.call(el.querySelectorAll('.pad .btn'),function(b){b.onclick=function(){var k=b.getAttribute('data-k');
      if(k==='⌫')typed=typed.slice(0,-1);else if(k==='✔'){check();return;}else if(typed.length<3)typed+=k;
      el.querySelector('#ans').textContent=typed||'_';};});
  }
  function check(){
    if(+typed===pr.ans){SFX.good();flash();P.mathLevel=Math.min(3,P.mathLevel+(tries===0?0.34:0));save();onRight();}
    else{tries++;SFX.bad();shake();typed='';toast(tries>=2?'Hint: the answer is close to '+(pr.ans+(rnd(2)?2:-2)):'Not yet. Try again.');draw();}
  }
  draw();show('shop');
}

/* ---------- MINIGAMES (canvas) ----------
   kinds: race (drag + catch), knee (tap growing leaks), swat (tap crawling germs, spare the red cells),
          boss (tap falling blobs, drain the boss bar). Missions reskin a kind. */
var G=null;
function startGame(kind,arg){
  var el=document.getElementById('s-game');
  var INFO={
    race:{t:'🏃 Running Race',who:'oxinator',how:'Drag the pod left and right. Catch blue O2 bubbles. Dodge grey CO2 clouds.',sec:20,good:'#6fb6ff',bad:'#777',gl:'O2',bl:'CO2',mission:'race'},
    swim:{t:'🏊 Swimming',who:'oxinator',how:'Cold water! Drag the pod. Catch warm red blood. Dodge the blue cold spots.',sec:20,good:'#ff5a5a',bad:'#6fb6ff',gl:'WARM',bl:'COLD',mission:'swim'},
    knee:{t:'🤕 Scraped Knee',who:'patchlet',how:'Tap every leak before it grows big. Patchlet plugs it.',sec:20,lbl:'LEAK',color:'#ff5a5a',mission:'knee'},
    teeth:{t:'🦷 Brush Teeth',who:'patchlet',how:'Cavity germs are drilling! Tap each one before it grows. Sweep them all out.',sec:20,lbl:'DRILL',color:'#b48bff',mission:'teeth',germ:'cavity'},
    flex:{t:'💪 Stretch Out',who:'patchlet',how:'Cramps are knotting up! Tap each knot before it grows. Patchlet smooths it out.',sec:20,lbl:'KNOT',color:'#ff8a3a',mission:'flex',kind:'knee'},
    balance:{t:'👂 Dizzy Spin',who:'oxinator',how:'The kid is spinning! Drag the pod. Catch the green STEADY drops, dodge the purple WOBBLE blobs.',sec:20,good:'#8ee86a',bad:'#b48bff',gl:'STEADY',bl:'WOBBLE',mission:'balance',kind:'race'},
    eyespy:{t:'👁️ Eye Spy',who:'fighty',how:'Pollen is sneaking in among the red cells. Tap only the yellow pollen. Leave the red cells alone!',sec:18,germ:'pollen',mission:'eyespy',kind:'swat'},
    swat:{t:'⚪ Fighty vs '+(GERMS[arg]?GERMS[arg].nm:'Germ'),who:'fighty',how:'Germs are crawling in! Tap the green germs. Do NOT tap the red cells, they are friends.',sec:18,germ:arg},
    sneeze:{t:'🤧 Sneeze Attack',who:'fighty',how:'Dust is drifting toward the nose! Tap every dust puff. Leave the red cells alone.',sec:18,germ:'dust',mission:'sneeze',kind:'swat'},
    boss:{t:(GERMS[arg]?GERMS[arg].ic+' '+GERMS[arg].nm:'Boss'),who:'fighty',how:({
      sugar:'Sugar blobs are raining down! Tap each one before it lands. The monster gets FASTER as it gets weaker. 8 land and Fighty is out.',
      cold:'The virus makes COPIES. Leave one alone too long and it splits in two. Tap them fast and keep the count down. 14 on screen and the Lungs are overrun.',
      bellybug:'The Belly Bug darts around and spits acid. Tap the BUG itself to hurt it. Acid that lands on the stomach wall counts as a miss. 8 misses and Fighty is out.',
      cavity:'The Cavity Crew drills into the teeth along the bottom. Tap each driller before its hole gets big. Lose 4 teeth and the fight is over.',
      fever:'The Fever Dragon is turning up the heat! DRAG the pod. Catch blue water drops to cool down and hurt the dragon. Dodge the fire. If the thermometer fills, Fighty overheats.'
    })[arg]||'Tap the blobs before they land.',sec:0}
  };
  var info=INFO[kind];var base=info.kind||kind;if(base==='swim')base='race';if(base==='teeth')base='knee';if(base==='sneeze')base='swat';var friendRate=kind==='eyespy'?.55:.25;
  el.innerHTML='<div class="wrap"><h2>'+info.t+'</h2><div id="gameWrap"><canvas id="game" width="900" height="500"></canvas><div id="gameHud"><span id="gScore">0</span><span id="gTime"></span></div><div id="gameMsg"><div style="font-size:48px">'+CREW[info.who].ic+'</div><h3>'+CREW[info.who].nm+' is up!</h3><p>'+info.how+'</p><button class="btn" id="gStart">Go!</button></div></div></div>';
  show('game');
  var cv=el.querySelector('#game'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  var wrap=el.querySelector('#gameWrap');
  if(G&&G.raf){cancelAnimationFrame(G.raf);G.over=true;}
  G={kind:kind,base:base,t:0,score:0,miss:0,items:[],px:W/2,hp:0,maxhp:0,over:false,last:0,raf:0,hit:0,combo:0};
  var B=kind==='boss'?BOSSES[arg]:null;
  function pos(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
  var BK=B?arg:null;
  function hitBoss(x,y){G.score++;G.combo++;G.hit=3;G.hp-=1;spark(x,y,B.blob);SFX.combo(G.combo);shake();}
  wrap.onpointerdown=function(e){if(G.over||G.t===0)return;var p=pos(e);
    if(base==='race'||BK==='fever'){G.px=p.x;return;}
    if(BK==='bellybug'){var bg=G.bug;if(bg&&Math.hypot(bg.x-p.x,bg.y-p.y)<bg.r+28){hitBoss(bg.x,bg.y);bg.tx=80+Math.random()*(W-160);bg.ty=110+Math.random()*(H-220);bg.speed=Math.min(520,bg.speed+30);bg.sq=1.5;}else G.combo=0;return;}
    var hitSomething=false;
    for(var i=G.items.length-1;i>=0;i--){var it=G.items[i];var d=Math.hypot(it.x-p.x,it.y-p.y);if(d<it.r+22){
      if(it.friend){G.items.splice(i,1);G.miss++;G.combo=0;SFX.bad();shake();spark(it.x,it.y,'#ff5a5a');toast('Oops, that was a red cell!');}
      else{G.items.splice(i,1);if(BK==='cavity'&&it.tooth!=null)G.teeth[it.tooth].busy=false;if(B){hitBoss(it.x,it.y);}else{G.score++;G.combo++;G.hit=3;spark(it.x,it.y,'#ffcc4d');SFX.combo(G.combo);}}
      hitSomething=true;break;}}
    if(!hitSomething)G.combo=0;
  };

/* ---------- END OF RUN ---------- */

  var next=!nb?'All '+total+' bosses beaten. Replay any of them for stars and fill the Journal. More body coming as Dad builds it.':'Next: the '+GERMS[nb].nm+' is waiting at the '+ORGANS[BOSSES[nb].at].nm+'. The Brain\'s boss board shows what it needs.';
  var el=document.getElementById('s-end');
  el.innerHTML='<div class="wrap title"><div class="big">🏆</div><h2 style="font-size:40px">Trip Complete</h2><p>Stars this trip: <span class="stars" id="cnt">0</span></p><p class="sub">Journal: '+journalPct()+'% filled · Trips: '+P.runs+' · Bosses: '+beaten+'/'+total+'</p><p>'+next+'</p><div class="row" style="max-width:520px;margin:14px auto 0"><button class="btn" id="again">🚀 New trip</button><button class="btn ghost" id="jr">📖 Journal</button></div></div>';
  show('end');
  var n=0,target=R.stars,c=el.querySelector('#cnt');var iv=setInterval(function(){n++;c.textContent='⭐ '+n;SFX.coin();if(n>=target)clearInterval(iv);},120);if(target===0)c.textContent='⭐ 0';
  el.querySelector('#again').onclick=function(){title();};
  el.querySelector('#jr').onclick=journal;
}

/* ---------- JOURNAL ---------- */
function unlockJ(type,id){var k=type+':'+id;if(!P.journal[k]){P.journal[k]=1;save();toast('📖 New journal card: '+jName(type,id));}}
function jName(t,id){if(t==='cell')return CREW[id].nm;if(t==='organ')return ORGANS[id].nm;if(t==='germ')return GERMS[id].nm;if(t==='map'){var p=id.split('-');return ORGANS[p[0]].nm+' to '+ORGANS[p[1]].nm;}if(t==='mystery'){var m=MYSTERIES.filter(function(x){return x.id===id;})[0];return m?m.nm:id;}return id;}
function allCards(){
  var L=[];
  Object.keys(CREW).forEach(function(k){var c=CREW[k];L.push({t:'cell',id:k,ic:c.ic,nm:c.nm,sub:c.kind,html:'<p>'+esc(c.job)+'</p><p><em>Bio:</em> '+esc(c.bio)+'</p><p><em>Secret:</em> '+esc(c.secret)+'</p><p><em>'+esc(c.fav)+'</em></p><p>'+esc(c.fact)+'</p>'});});
  Object.keys(ORGANS).forEach(function(k){L.push({t:'organ',id:k,ic:ORGANS[k].ic,nm:ORGANS[k].nm,sub:'Organ',txt:ORGANS[k].fact});});
  Object.keys(GERMS).forEach(function(k){L.push({t:'germ',id:k,ic:GERMS[k].ic,nm:GERMS[k].nm,sub:GERMS[k].boss?'BOSS germ':'Germ',txt:GERMS[k].fact});});
  LINKS.forEach(function(l){var id=l.slice().sort().join('-');L.push({t:'map',id:id,ic:'🗺️',nm:jName('map',id),sub:'Route',txt:'A path you traveled.'});});
  MYSTERIES.forEach(function(m){L.push({t:'mystery',id:m.id,ic:m.ic,nm:m.nm,sub:'Mystery'+(m.by?' · found by '+m.by:''),txt:m.text});});
  return L;
}
function journalPct(){var all=allCards();var n=all.filter(function(c){return P.journal[c.t+':'+c.id];}).length;return Math.round(n/all.length*100);}
var jtab='cell';
function journal(){
  var el=document.getElementById('s-journal');var all=allCards();
  var tabs=[['cell','🔴 Cells'],['organ','❤️ Organs'],['germ','🦠 Germs'],['map','🗺️ Maps'],['mystery','❓ Mysteries']];
  el.innerHTML='<div class="wrap"><h2>📖 Journal · '+journalPct()+'% filled</h2><div class="tabs">'+tabs.map(function(t){var n=all.filter(function(c){return c.t===t[0]&&P.journal[c.t+':'+c.id];}).length,tot=all.filter(function(c){return c.t===t[0];}).length;return '<div class="tab'+(t[0]===jtab?' on':'')+'" data-t="'+t[0]+'">'+t[1]+' '+n+'/'+tot+'</div>';}).join('')+'</div><div class="jgrid">'+
    all.filter(function(c){return c.t===jtab;}).map(function(c){var on=P.journal[c.t+':'+c.id];return '<div class="jcard'+(on?'':' locked')+'"><div class="ic">'+(on?c.ic:'❔')+'</div><b>'+(on?esc(c.nm):'???')+'</b>'+(on?'<p>'+esc(c.sub)+'</p>'+(c.html||'<p>'+esc(c.txt)+'</p>'):'<p>Not found yet</p>')+'</div>';}).join('')+
    '</div><div class="row"><button class="btn ghost" id="back">◀ Back</button></div></div>';
  Array.prototype.forEach.call(el.querySelectorAll('.tab'),function(t){t.onclick=function(){jtab=t.getAttribute('data-t');journal();};});
  el.querySelector('#back').onclick=leaveJournal;
  show('journal');
}

/* ---------- boot ---------- */
syncUnlocks();title();
</script>
