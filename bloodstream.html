<html lang="en">
<head>
<meta charset="utf-8">

<title>Bloodstream</title>
<style>
:root{
  --bg:#3a0d14; --bg2:#5a1420; --panel:#7a1f2b; --panel2:#8e2736; --line:#b13a4b;
  --ink:#f4f1ea; --dim:#e8b9bf; --red:#ff5a5a; --gold:#ffcc4d; --teal:#4fe3d2; --blue:#6fb6ff; --green:#8ee86a; --white:#ffffff;
  --tap:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 30% 20%,#6a1826 0%,var(--bg) 60%,#2a080e 100%)}
#veins{position:fixed;inset:0;pointer-events:none;opacity:.35}
#app{position:relative;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;gap:10px;flex:0 0 auto}
header h1{font-size:20px;margin:0;letter-spacing:1px}
#badge{font-size:12px;color:var(--dim);background:rgba(0,0,0,.25);padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
#hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meter{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:15px;font-weight:700}
.meter .bar{width:60px;height:8px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;transition:width .4s cubic-bezier(.2,.9,.3,1.2)}
#m-o2 i{background:var(--blue)}#m-glu i{background:var(--gold)}#m-h2o i{background:var(--teal)}
.coin{color:var(--gold)}
main{flex:1;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;overflow:auto;padding:10px 14px 16px;opacity:0;transform:scale(.98);pointer-events:none;transition:opacity .25s,transform .25s}
.scr.on{opacity:1;transform:scale(1);pointer-events:auto}
.wrap{max-width:1100px;margin:0 auto}
h2{font-size:26px;margin:4px 0 6px}
p{line-height:1.4;font-size:18px;margin:6px 0}
.sub{color:var(--dim);font-size:16px}
.btn{min-height:var(--tap);font-size:20px;font-weight:700;border-radius:16px;border:0;cursor:pointer;color:#2a080e;background:var(--gold);padding:10px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s;box-shadow:0 4px 0 #b8902a}
.btn:active{transform:scale(.94) translateY(2px);box-shadow:0 2px 0 #b8902a}
.btn.ghost{background:rgba(0,0,0,.25);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 #2a9a8c}.btn.teal:active{box-shadow:0 2px 0 #2a9a8c}
.btn.red{background:var(--red);box-shadow:0 4px 0 #b13a4b;color:#fff}.btn.red:active{box-shadow:0 2px 0 #b13a4b}
.btn:disabled{opacity:.4;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.row .btn{flex:1}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:700px){.split{grid-template-columns:1fr}}
/* crew */
.crew{display:flex;gap:10px;flex-wrap:wrap}
.cell{flex:1;min-width:140px;background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;gap:10px;align-items:center}
.cell svg{width:52px;height:52px;flex:0 0 52px;animation:bob 2.4s ease-in-out infinite}
.cell:nth-child(2) svg{animation-delay:-.8s}.cell:nth-child(3) svg{animation-delay:-1.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.cell b{display:block;font-size:17px}
.cell .hp{font-size:15px;letter-spacing:2px}
.cell.tired{opacity:.6}
/* map */
#map{width:100%;height:auto;max-height:62vh;display:block}
.node{cursor:pointer}
.node.locked{opacity:.4;cursor:default}
.node:active circle.base{transform:scale(.95)}
.node text{fill:#f4f1ea;font-weight:700;font-size:15px;text-anchor:middle;pointer-events:none}
.node .ic{font-size:26px;text-anchor:middle;pointer-events:none}
.node.here circle.ring{stroke:#ffcc4d;stroke-width:4;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.3}}
.pod{pointer-events:none}
/* event */
.choice{display:block;width:100%;text-align:left;margin-top:10px;font-size:18px}
.fact{background:rgba(0,0,0,.3);border-left:4px solid var(--teal);padding:10px 12px;border-radius:10px;margin-top:12px;font-size:17px}
/* shop */
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.shop .btn{flex-direction:column;min-height:90px}
.shop small{font-size:14px;font-weight:400}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:10px auto 0}
.pad .btn{min-height:58px;background:rgba(0,0,0,.3);color:var(--ink);border:2px solid var(--line);box-shadow:none;font-size:24px}
.ans{font-size:34px;text-align:center;min-height:48px;letter-spacing:2px;margin-top:6px}
.prob{font-size:24px;text-align:center;margin-top:8px}
/* minigame */
#gameWrap{position:relative;width:100%;background:#2a080e;border:3px solid var(--line);border-radius:18px;overflow:hidden;touch-action:none}
#game{display:block;width:100%;height:auto}
#gameHud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;font-weight:700;font-size:18px;pointer-events:none;text-shadow:0 2px 4px #000}
#gameMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(42,8,14,.75);text-align:center;padding:16px}
#gameMsg.hide{display:none}
#gameMsg h3{font-size:30px;margin:0}
/* journal */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tab{padding:10px 14px;border-radius:999px;border:2px solid var(--line);background:rgba(0,0,0,.25);font-weight:700;cursor:pointer;font-size:16px}
.tab.on{background:var(--gold);color:#2a080e;border-color:var(--gold)}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.jcard{background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:14px;padding:10px;min-height:120px}
.jcard.locked{opacity:.35;filter:grayscale(1)}
.jcard .ic{font-size:34px}
.jcard b{display:block;font-size:16px;margin:4px 0}
.jcard p{font-size:14px;margin:0;color:var(--dim)}
/* fx */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--teal);color:#2a080e;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:60;font-size:17px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translate(0px,0px)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}}
.punch{animation:punch .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes punch{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.title{text-align:center;padding-top:4vh}
.title h2{font-size:52px;margin:6px 0;letter-spacing:3px;text-shadow:0 4px 0 #2a080e}
.title .pod{width:160px;height:160px;animation:bob 2.4s ease-in-out infinite}
.stars{color:var(--gold);font-size:20px}
.big{font-size:40px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>

var LINKS=[['heart','stomach'],['heart','bones'],['heart','lab'],['stomach','bones'],['lab','bones'],['lab','stomach'],['lab','lungs'],['stomach','lungs'],['lab','brain'],['bones','brain']];

  sugar:{nm:'Sugar Monster',ic:'🍭',fact:'Sugar is fuel, but too much at once makes a spike and then a crash. Your body stores extra as fat.'},

  {id:'cold',t:'Cold Virus Spotted',txt:'A cold virus is trying to sneak into a cell to make copies of itself.',ic:'🦠',

/* ---------- audio (silent until first tap) ---------- */
var AC=null;
function beep(f,d,type,vol){
  if(!P.sound)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.value=f*(1+(Math.random()-.5)*.12);
    g.gain.value=vol||.08;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.1));
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(d||.1));
  }catch(e){}
}
var SFX={tap:function(){beep(520,.06,'square',.05);},good:function(){beep(660,.1,'triangle');setTimeout(function(){beep(880,.14,'triangle');},90);},
  bad:function(){beep(180,.2,'sawtooth',.06);},coin:function(){beep(1040,.08,'square',.05);setTimeout(function(){beep(1320,.1,'square',.05);},70);},
  hit:function(){beep(140,.08,'square',.1);},win:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){beep(f,.18,'triangle',.08);},i*120);});}};

/* ---------- fx helpers ---------- */

function flash(){var f=document.getElementById('flash');f.style.transition='none';f.style.opacity=.5;setTimeout(function(){f.style.transition='opacity .25s';f.style.opacity=0;},30);}
function shake(){if(!P.shake)return;var a=document.getElementById('app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');}
function punch(el){el.classList.remove('punch');void el.offsetWidth;el.classList.add('punch');}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
document.getElementById('badge').onclick=function(){toast(VERSION);};
document.body.addEventListener('pointerdown',function(e){if(e.target.closest('.btn,.node,.tab,.choice'))SFX.tap();},true);

/* ---------- HUD ---------- */
function hud(){
  if(!R)return;
  var set=function(id,v){var m=document.getElementById(id);m.querySelector('i').style.width=(v/10*100)+'%';m.querySelector('span').textContent=v;};
  set('m-o2',R.o2);set('m-glu',R.glu);set('m-h2o',R.h2o);
  document.getElementById('m-coin').textContent=R.coin;
}
function clamp(v){return Math.max(0,Math.min(10,v));}

/* ---------- screens ---------- */
var cur='';
function show(id){
  Array.prototype.forEach.call(document.querySelectorAll('.scr'),function(s){s.classList.toggle('on',s.id==='s-'+id);});
  cur=id;
}
function leaveJournal(){if(!R)title();else if(R.ended)show('end');else hub();}
document.getElementById('btnJournal').onclick=function(){if(cur==='journal')leaveJournal();else journal();};

/* ---------- SVG art ---------- */
function podSvg(size){

}
function cellSvg(k){
  var c=CREW[k];var eye='<circle cx="42" cy="46" r="5" fill="#2a080e"/><circle cx="58" cy="46" r="5" fill="#2a080e"/><circle cx="44" cy="44" r="2" fill="#fff"/><circle cx="60" cy="44" r="2" fill="#fff"/><path d="M40 60 Q50 68 60 60" stroke="#2a080e" stroke-width="3" fill="none" stroke-linecap="round"/>';
  var body=k==='patchlet'?'<path d="M50 10 L80 30 L85 65 L55 92 L20 70 L15 35 Z" fill="'+c.color+'" stroke="#2a080e" stroke-width="3" stroke-linejoin="round"/>':

/* ---------- MATH ---------- */
function mathLevel(){return Math.min(3,P.mathLevel);}
function makeProblem(ctx){
  var L=mathLevel(),a,b,q,ans;
  if(L===0){a=2+rnd(8);b=2+rnd(8);q=a+' + '+b;ans=a+b;}
  else if(L===1){a=10+rnd(10);b=2+rnd(9);q=a+' - '+b;ans=a-b;}
  else if(L===2){a=2+rnd(5);b=2+rnd(5);q=a+' x '+b;ans=a*b;}
  else{b=2+rnd(4);ans=2+rnd(6);a=b*ans;q=a+' ÷ '+b;}
  return {q:q,ans:ans};
}
function rnd(n){return Math.floor(Math.random()*n);}
function askMath(prompt,onRight,onDone){
  var pr=makeProblem();var typed='';var tries=0;
  var el=document.getElementById('s-shop');
  function draw(){
    el.innerHTML='<div class="wrap"><div class="card"><h2>🧮 '+esc(prompt)+'</h2><div class="prob">'+pr.q+' = ?</div><div class="ans" id="ans">'+(typed||'_')+'</div><div class="pad">'+[1,2,3,4,5,6,7,8,9,'⌫',0,'✔'].map(function(k){return '<button class="btn" data-k="'+k+'">'+k+'</button>';}).join('')+'</div></div></div>';
    Array.prototype.forEach.call(el.querySelectorAll('.pad .btn'),function(b){b.onclick=function(){var k=b.getAttribute('data-k');
      if(k==='⌫')typed=typed.slice(0,-1);else if(k==='✔'){check();return;}else if(typed.length<3)typed+=k;
      el.querySelector('#ans').textContent=typed||'_';};});
  }
  function check(){
    if(+typed===pr.ans){SFX.good();flash();P.mathLevel=Math.min(3,P.mathLevel+(tries===0?0.34:0));save();onRight();}
    else{tries++;SFX.bad();shake();typed='';toast(tries>=2?'Hint: the answer is close to '+(pr.ans+(rnd(2)?2:-2)):'Not yet. Try again.');draw();}
  }
  draw();show('shop');
}

/* ---------- MINIGAMES (canvas) ---------- */
var G=null;
function startGame(kind){
  var el=document.getElementById('s-game');
  var info={race:{t:'🏃 Running Race',who:'oxinator',how:'Drag the pod left and right. Catch blue oxygen bubbles. Dodge grey CO2 clouds.',sec:20},
            knee:{t:'🤕 Scraped Knee',who:'patchlet',how:'Tap every leak before it grows big. Patchlet plugs it.',sec:20},
            boss:{t:'🍭 Sugar Monster',who:'fighty',how:'Tap sugar blobs before they land. Every swat hurts the monster. Missed blobs tire the crew.',sec:0}}[kind];
  el.innerHTML='<div class="wrap"><h2>'+info.t+'</h2><div id="gameWrap"><canvas id="game" width="900" height="500"></canvas><div id="gameHud"><span id="gScore">0</span><span id="gTime"></span></div><div id="gameMsg"><div style="font-size:48px">'+CREW[info.who].ic+'</div><h3>'+CREW[info.who].nm+' is up!</h3><p>'+info.how+'</p><button class="btn" id="gStart">Go!</button></div></div></div>';
  show('game');
  var cv=el.querySelector('#game'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  var wrap=el.querySelector('#gameWrap');
  G={kind:kind,t:0,score:0,miss:0,items:[],px:W/2,hp:0,maxhp:0,over:false,last:0,raf:0,stop:0,hit:0};
  function pos(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
  wrap.onpointerdown=function(e){if(G.over||G.t===0)return;var p=pos(e);
    if(kind==='race'){G.px=p.x;}
    else{for(var i=G.items.length-1;i>=0;i--){var it=G.items[i];var d=Math.hypot(it.x-p.x,it.y-p.y);if(d<it.r+22){G.items.splice(i,1);G.score++;G.hit=3;spark(it.x,it.y,kind==='boss'?'#ff6ad5':'#ffcc4d');SFX.good();if(kind==='boss'){G.hp-=1;shake();}break;}}}
  };
  wrap.onpointermove=function(e){if(kind==='race'&&e.buttons)G.px=pos(e).x;};
  var parts=[];
  function spark(x,y,c){for(var i=0;i<10;i++)parts.push({x:x,y:y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,l:1,c:c});}
  function spawn(dt){
    if(kind==='race'){if(Math.random()<dt*2.2){var bad=Math.random()<.3;G.items.push({x:40+Math.random()*(W-80),y:-20,r:bad?26:20,vy:120+Math.random()*120+G.t*4,bad:bad});}}
    else if(kind==='knee'){if(Math.random()<dt*1.5){G.items.push({x:60+Math.random()*(W-120),y:80+Math.random()*(H-160),r:14,grow:18+Math.random()*10});}}
    else{if(Math.random()<dt*(1.6+G.t*.05)){G.items.push({x:200+Math.random()*(W-400),y:150,r:24,vy:90+Math.random()*90+G.t*5,vx:(Math.random()-.5)*120});}}
  }
  function step(ts){
    if(!G||G.over)return;
    var dt=Math.min(.05,(ts-(G.last||ts))/1000);G.last=ts;
    if(G.hit>0){G.hit--;ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(0,0,W,H);G.raf=requestAnimationFrame(step);return;}/* hit-stop */
    G.t+=dt;spawn(dt);
    ctx.clearRect(0,0,W,H);
    /* background */
    ctx.fillStyle='#4a0f1a';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#7a1f2b';ctx.lineWidth=40;ctx.lineCap='round';
    for(var i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-50,80+i*120+Math.sin(G.t+i)*10);ctx.bezierCurveTo(W*.3,40+i*120,W*.7,120+i*120,W+50,80+i*120);ctx.stroke();}
    if(kind==='boss'){
      ctx.font='90px serif';ctx.textAlign='center';var bob=Math.sin(G.t*3)*8;ctx.fillText('🍭',W/2,120+bob);
      ctx.fillStyle='#2a080e';ctx.fillRect(W/2-150,20,300,22);ctx.fillStyle='#ff6ad5';ctx.fillRect(W/2-150,20,300*Math.max(0,G.hp/G.maxhp),22);
      ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.fillText('Sugar Monster '+G.hp+'/'+G.maxhp,W/2,58);
    }
    /* items */
    for(i=G.items.length-1;i>=0;i--){var it=G.items[i];
      if(kind==='race'){it.y+=it.vy*dt;
        if(Math.hypot(it.x-G.px,it.y-(H-60))<it.r+34){G.items.splice(i,1);if(it.bad){G.miss++;SFX.hit();shake();spark(it.x,it.y,'#888');}else{G.score++;SFX.good();spark(it.x,it.y,'#6fb6ff');}continue;}
        if(it.y>H+30){G.items.splice(i,1);if(!it.bad)G.miss++;continue;}
        ctx.beginPath();ctx.arc(it.x,it.y,it.r,0,7);ctx.fillStyle=it.bad?'#777':'#6fb6ff';ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText(it.bad?'CO2':'O2',it.x,it.y+6);
      } else if(kind==='knee'){it.r+=it.grow*dt;
        if(it.r>60){G.items.splice(i,1);G.miss++;SFX.hit();shake();continue;}
        ctx.beginPath();ctx.arc(it.x,it.y,it.r,0,7);ctx.fillStyle='#ff5a5a';ctx.fill();ctx.strokeStyle='#ffcc4d';ctx.lineWidth=4;ctx.stroke();
        ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('LEAK',it.x,it.y+5);
      } else {it.y+=it.vy*dt;it.x+=it.vx*dt;
        if(it.y>H+20){G.items.splice(i,1);G.miss++;SFX.hit();shake();continue;}
        ctx.beginPath();ctx.arc(it.x,it.y,it.r,0,7);ctx.fillStyle='#ff6ad5';ctx.fill();ctx.fillStyle='#2a080e';ctx.beginPath();ctx.arc(it.x-8,it.y-4,3,0,7);ctx.arc(it.x+8,it.y-4,3,0,7);ctx.fill();
      }
    }
    /* pod (race) */
    if(kind==='race'){var sq=1+Math.min(.25,Math.abs(G.px-(G.lastpx||G.px))*.01);G.lastpx=G.px;ctx.save();ctx.translate(G.px,H-60);ctx.scale(sq,1/sq);ctx.beginPath();ctx.arc(0,0,34,0,7);ctx.fillStyle='rgba(79,227,210,.7)';ctx.fill();ctx.strokeStyle='#bffaf3';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fillStyle='#ff5a5a';ctx.fill();ctx.restore();}
    /* particles */
    for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.l-=dt*2.5;if(p.l<=0){parts.splice(i,1);continue;}ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.fillRect(p.x-3,p.y-3,6,6);}ctx.globalAlpha=1;
    el.querySelector('#gScore').textContent=(kind==='boss'?'Swats: ':'Caught: ')+G.score+'  Missed: '+G.miss;
    var left=kind==='boss'?'':Math.ceil(info.sec-G.t)+'s';el.querySelector('#gTime').textContent=left;
    var end=kind==='boss'?(G.hp<=0||G.miss>=8):G.t>=info.sec;
    if(end)finish();else G.raf=requestAnimationFrame(step);
  }
  function finish(){
    G.over=true;var msg=el.querySelector('#gameMsg');msg.classList.remove('hide');
    var who=info.who,stars=0,txt='',fact='';
    if(kind==='race'){stars=Math.min(5,Math.floor(G.score/3));var dmg=Math.floor(G.miss/4);R.crew[who]=Math.max(0,R.crew[who]-dmg);R.o2=clamp(R.o2+Math.min(4,Math.floor(G.score/4)));R.done.race=true;txt='Oxinator caught '+G.score+' bubbles. The legs got their oxygen. ⭐'+stars+(dmg?' Oxinator is tired from the CO2.':'');fact='Muscles burn more oxygen when you run, so your heart beats faster to deliver it.';unlockJ('mystery','goose');}
    else if(kind==='knee'){stars=Math.min(5,Math.floor(G.score/3));var d2=Math.floor(G.miss/3);R.crew[who]=Math.max(0,R.crew[who]-d2);R.h2o=clamp(R.h2o-Math.min(3,G.miss));R.done.knee=true;txt='Patchlet plugged '+G.score+' leaks. A scab is forming. ⭐'+stars+(G.miss?' Some blood leaked out ('+Math.min(3,G.miss)+' water).':'');fact='A scab is a dried plug of platelets and sticky threads called fibrin. Picking it reopens the leak.';unlockJ('mystery','yawn');}
    else{var won=G.hp<=0;if(won){stars=5;R.done.boss=true;P.wins++;if(P.unlocked.indexOf('lungs')<0)P.unlocked.push('lungs');unlockJ('germ','sugar');unlockJ('mystery','fat');SFX.win();txt='Fighty swatted the Sugar Monster down to nothing! ⭐5. The LUNGS are now unlocked on the map.';fact=GERMS.sugar.fact;}
      else{R.crew.fighty=0;R.sugar=Math.max(0,R.sugar-2);txt='Too many sugar blobs got through. Fighty needs a snack and a rest. The monster shrank a little. Try again from the Heart.';fact='Sugar crashes happen when a big spike drops fast. Slow fuel like apples and bread keeps the body steady.';}}
    R.coin+=stars;R.stars+=stars;save();hud();
    msg.innerHTML='<h3>'+(kind==='boss'&&G.hp>0?'Not this time':'Done!')+'</h3><p>'+txt+'</p><div class="fact" style="text-align:left">💡 '+fact+'</div><button class="btn" id="gDone">'+(kind==='boss'&&G.hp<=0?'Finish the trip ▶':'Back to map ▶')+'</button>';
    msg.querySelector('#gDone').onclick=function(){if(kind==='boss'&&R.done.boss)endRun();else checkTired();};
  }
  el.querySelector('#gStart').onclick=function(){el.querySelector('#gameMsg').classList.add('hide');G.t=0.0001;G.last=0;if(kind==='boss'){G.maxhp=10+R.sugar*2;G.hp=G.maxhp;}G.raf=requestAnimationFrame(step);};
}

/* ---------- END OF RUN ---------- */
function endRun(){
  R.ended=true;P.runs++;P.bestStars=Math.max(P.bestStars,R.stars);save();recordPlay();
  var el=document.getElementById('s-end');
  el.innerHTML='<div class="wrap title"><div class="big">🏆</div><h2 style="font-size:40px">Trip Complete</h2><p>Stars this trip: <span class="stars" id="cnt">0</span></p><p class="sub">Journal: '+journalPct()+'% filled · Trips: '+P.runs+'</p><p>The Sugar Monster is beaten and the Lungs are open. More of the body unlocks as Dad builds it.</p><div class="row" style="max-width:520px;margin:14px auto 0"><button class="btn" id="again">🚀 New trip</button><button class="btn ghost" id="jr">📖 Journal</button></div></div>';
  show('end');
  var n=0,target=R.stars,c=el.querySelector('#cnt');var iv=setInterval(function(){n++;c.textContent='⭐ '+n;SFX.coin();if(n>=target)clearInterval(iv);},120);if(target===0)c.textContent='⭐ 0';
  el.querySelector('#again').onclick=function(){title();};
  el.querySelector('#jr').onclick=journal;
}

/* ---------- JOURNAL ---------- */
function unlockJ(type,id){var k=type+':'+id;if(!P.journal[k]){P.journal[k]=1;save();toast('📖 New journal card: '+jName(type,id));}}
function jName(t,id){if(t==='cell')return CREW[id].nm;if(t==='organ')return ORGANS[id].nm;if(t==='germ')return GERMS[id].nm;if(t==='map'){var p=id.split('-');return ORGANS[p[0]].nm+' to '+ORGANS[p[1]].nm;}if(t==='mystery'){var m=MYSTERIES.filter(function(x){return x.id===id;})[0];return m?m.nm:id;}return id;}
function allCards(){
  var L=[];
  Object.keys(CREW).forEach(function(k){L.push({t:'cell',id:k,ic:CREW[k].ic,nm:CREW[k].nm,sub:CREW[k].kind,txt:CREW[k].job+' '+CREW[k].fact});});
  Object.keys(ORGANS).forEach(function(k){L.push({t:'organ',id:k,ic:ORGANS[k].ic,nm:ORGANS[k].nm,sub:'Organ',txt:ORGANS[k].fact});});
  Object.keys(GERMS).forEach(function(k){L.push({t:'germ',id:k,ic:GERMS[k].ic,nm:GERMS[k].nm,sub:'Germ',txt:GERMS[k].fact});});
  LINKS.forEach(function(l){var id=l.slice().sort().join('-');L.push({t:'map',id:id,ic:'🗺️',nm:jName('map',id),sub:'Route',txt:'A path you traveled.'});});
  MYSTERIES.forEach(function(m){L.push({t:'mystery',id:m.id,ic:m.ic,nm:m.nm,sub:'Mystery'+(m.by?' · found by '+m.by:''),txt:m.text});});
  return L;
}
function journalPct(){var all=allCards();var n=all.filter(function(c){return P.journal[c.t+':'+c.id];}).length;return Math.round(n/all.length*100);}
var jtab='cell';
function journal(){
  var el=document.getElementById('s-journal');var all=allCards();
  var tabs=[['cell','🔴 Cells'],['organ','❤️ Organs'],['germ','🦠 Germs'],['map','🗺️ Maps'],['mystery','❓ Mysteries']];
  el.innerHTML='<div class="wrap"><h2>📖 Journal · '+journalPct()+'% filled</h2><div class="tabs">'+tabs.map(function(t){return '<div class="tab'+(t[0]===jtab?' on':'')+'" data-t="'+t[0]+'">'+t[1]+'</div>';}).join('')+'</div><div class="jgrid">'+
    all.filter(function(c){return c.t===jtab;}).map(function(c){var on=P.journal[c.t+':'+c.id];return '<div class="jcard'+(on?'':' locked')+'"><div class="ic">'+(on?c.ic:'❔')+'</div><b>'+(on?esc(c.nm):'???')+'</b><p>'+(on?esc(c.sub)+'<br>'+esc(c.txt):'Not found yet')+'</p></div>';}).join('')+
    '</div><div class="row"><button class="btn ghost" id="back">◀ Back</button></div></div>';
  Array.prototype.forEach.call(el.querySelectorAll('.tab'),function(t){t.onclick=function(){jtab=t.getAttribute('data-t');journal();};});
  el.querySelector('#back').onclick=leaveJournal;
  show('journal');
}

/* ---------- boot ---------- */
title();
</script>
